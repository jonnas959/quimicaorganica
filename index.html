   Os distratores alimentam as alternativas do modo Laboratório.
   ========================================================================== */

/* ---- transformações elementares do grafo ---- */
function attach(m, c, spec){
  if(!spec || spec==='H') return -1;          // H é implícito: não vira nó
  if(spec==='OH'){ var o = M.addAtom(m,'O'); M.addBond(m,c,o,1); return o; }
  if(spec==='=O'){ var o2 = M.addAtom(m,'O'); M.addBond(m,c,o2,2); return o2; }
  if(spec==='NH2'){ var n = M.addAtom(m,'N'); M.addBond(m,c,n,1); return n; }
  if(spec==='CN'){ var cc = M.addAtom(m,'C'), nn = M.addAtom(m,'N'); M.addBond(m,c,cc,1); M.addBond(m,cc,nn,3); return cc; }
  if(spec==='CH3'){ var k = M.addAtom(m,'C'); M.addBond(m,c,k,1); return k; }
  if(spec==='COOH'){ var k2 = M.addAtom(m,'C'), o3 = M.addAtom(m,'O'), o4 = M.addAtom(m,'O');
                     M.addBond(m,c,k2,1); M.addBond(m,k2,o3,2); M.addBond(m,k2,o4,1); return k2; }
  var x = M.addAtom(m, spec); M.addBond(m, c, x, 1); return x;
}

// Adição através de uma ligação múltipla: baixa a ordem e pendura gA em `a` e gB em `b`
function addAcross(m, a, b, gA, gB){
  var mm = M.clone(m);
  var bd = M.bond(mm, a, b);
  if(!bd) return null;
  bd.o = bd.o - 1;
  if(bd.o===0) M.delBond(mm, a, b);
  attach(mm, a, gA);
  attach(mm, b, gB);
  return mm;
}

// Abertura de anel pequeno: quebra a ligação C–C e pendura os grupos
function openRing(m, a, b, gA, gB){
  var mm = M.clone(m);
  M.delBond(mm, a, b);
  attach(mm, a, gA);
  attach(mm, b, gB);
  return mm;
}

// Markovnikov: o H entra no carbono que já tem mais hidrogênios
function markov(m, a, b){
  var ha = M.h(m,a), hb = M.h(m,b);
  if(ha===hb) return { hC:a, xC:b, simetrico:true };
  return ha>hb ? { hC:a, xC:b, simetrico:false } : { hC:b, xC:a, simetrico:false };
}

/* ---- localizadores estruturais ---- */
function dblCC(m){
  var benz = benzeneRing(m);
  return m.bonds.filter(function(b){
    if(m.atoms[b.a].el!=='C' || m.atoms[b.b].el!=='C' || b.o!==2) return false;
    if(benz && benz.indexOf(b.a)>=0 && benz.indexOf(b.b)>=0) return false;
    return true;
  });
}
function triCC(m){
  return m.bonds.filter(function(b){
    return b.o===3 && m.atoms[b.a].el==='C' && m.atoms[b.b].el==='C';
  });
}
function carbonylCs(m){
  return groupsOf(m).filter(function(g){ return g.tipo==='aldeido'||g.tipo==='cetona'; });
}
function alcoolCs(m){
  return groupsOf(m).filter(function(g){ return g.tipo==='alcool'; });
}
function haletoCs(m){
  var out = [];
  for(var i=0;i<m.atoms.length;i++){
    if(!HALO[m.atoms[i].el]) continue;
    var c = M.nbrIdx(m,i).filter(function(j){ return m.atoms[j].el==='C'; });
    if(c.length) out.push({ x:i, c:c[0], el:m.atoms[i].el });
  }
  return out;
}
function smallRing(m){
  var r = findRing(m);
  if(!r) return null;
  if(isBenzeneRing(m,r)) return null;
  return (r.length===3 || r.length===4) ? r : null;
}
function isPureAlcano(m){
  var gs = groupsOf(m);
  return gs.length===1 && (gs[0].tipo==='alcano' || gs[0].tipo==='ciclano');
}

/* ---- rótulo de produto ---- */
function P(mol, papel, nota){
  return { mol:mol, papel:papel||'principal', nota:nota||null };
}
function T(texto, papel){ return { texto:texto, papel:papel||'subproduto' }; }

// O nome do produto sai sempre do nomeador; "nota" é só o comentário didático
function produtoNome(p){
  if(p.texto) return p.texto;
  return iupacName(p.mol);
}

/* ============================================================================
   REGRAS — ADIÇÃO
   ========================================================================== */
var RX = [];

RX.push({
  id:'hidrogenacao', grupo:'Adição', nome:'Hidrogenação catalítica',
  reagente:'H₂', condicao:'Ni ou Pt/Pd, Δ',
  classes:['Adição','Redução'],
  aplica:function(m){
    return dblCC(m).length || triCC(m).length || carbonylCs(m).length || smallRing(m) || benzeneRing(m);
  },
  run:function(m){
    var tri = triCC(m), dbl = dblCC(m), cb = carbonylCs(m), sr = smallRing(m), bz = benzeneRing(m);
    if(tri.length){
      var p1 = addAcross(m, tri[0].a, tri[0].b, 'H','H');
      var p2 = addAcross(p1, tri[0].a, tri[0].b, 'H','H');
      return {
        produtos:[P(p2,'principal'), P(p1,'secundário','produto de 1 mol de H₂ (alceno)')],
        regra:'Alcino consome 2 mols de H₂',
        porque:'A tripla vira dupla com o primeiro mol de H₂ e vira simples com o segundo. Com H₂ em excesso o produto é o alcano.',
        mecanismo:'Os dois hidrogênios entram do mesmo lado, adsorvidos na superfície do metal (adição sin).'
      };
    }
    if(dbl.length){
      var pa = addAcross(m, dbl[0].a, dbl[0].b, 'H','H');
      return {
        produtos:[P(pa,'principal')],
        regra:'Adição de H₂ à dupla',
        porque:'A dupla se rompe (uma ligação pi), cada carbono recebe um H e a cadeia fica saturada. É adição e, ao mesmo tempo, redução: o Nox dos carbonos da dupla diminui.',
        mecanismo:'H₂ é quebrado na superfície do níquel; os dois H entram pela mesma face da dupla.'
      };
    }
    if(cb.length){
      var g = cb[0];
      var pb = addAcross(m, g.atoms[0], g.atoms[1], 'H','H');
      var tipo = g.tipo==='aldeido' ? 'primário' : 'secundário';
      return {
        produtos:[P(pb,'principal')],
        regra:'Redução de carbonila',
        porque:'A dupla C=O vira C–OH. '+(g.tipo==='aldeido'?'Aldeído dá álcool primário':'Cetona dá álcool secundário')+'. Classificação dupla: é adição e é redução (o Nox do carbono da carbonila cai 2 unidades).',
        mecanismo:'O H entra no carbono e o outro H no oxigênio, formando o álcool '+tipo+'.'
      };
    }
    if(sr){
      var po = openRing(m, sr[0], sr[1], 'H','H');
      return {
        produtos:[P(po,'principal')],
        regra:'Abertura de anel tensionado',
        porque:'Anéis de 3 e 4 carbonos têm ângulos muito fechados (60° e 90°) e por isso são instáveis: sofrem ADIÇÃO com abertura do ciclo, como se fossem insaturados. Anéis de 5 e 6 carbonos não abrem — fazem substituição.',
        mecanismo:'A ligação C–C mais tensionada se rompe e cada ponta recebe um hidrogênio.'
      };
    }
    if(bz){
      return {
        produtos:[P(smiles('C1CCCCC1'),'principal','ciclo-hexano')],
        regra:'Exceção do benzeno',
        porque:'Normalmente o benzeno faz SUBSTITUIÇÃO (a ressonância do anel é estável demais). Mas com H₂, níquel, alta pressão e temperatura ele sofre ADIÇÃO de 3 mols de H₂ e vira ciclo-hexano.',
        mecanismo:'C₆H₆ + 3 H₂ → C₆H₁₂'
      };
    }
    return null;
  }
});

RX.push({
  id:'halogenacao_adicao', grupo:'Adição', nome:'Adição de halogênio',
  reagente:'Cl₂ ou Br₂', condicao:'em CCl₄, sem luz',
  classes:['Adição'],
  aplica:function(m){ return dblCC(m).length || triCC(m).length || smallRing(m); },
  run:function(m, opt){
    var X = (opt && opt.X) || 'Br';
    var tri = triCC(m), dbl = dblCC(m), sr = smallRing(m);
    if(dbl.length){
      var p = addAcross(m, dbl[0].a, dbl[0].b, X, X);
      return {
        produtos:[P(p,'principal')],
        regra:'Di-haleto vicinal',
        porque:'Os dois halogênios entram em carbonos VIZINHOS (vicinal), um em cada carbono da antiga dupla. Não existe Markovnikov aqui: os dois grupos que entram são iguais.',
        mecanismo:'A dupla ataca a molécula de Br₂ formando um íon bromônio cíclico; o Br⁻ entra pelo lado oposto.',
        teste:'É este o teste da água de bromo: a cor castanha do Br₂ desaparece.'
      };
    }
    if(tri.length){
      var q1 = addAcross(m, tri[0].a, tri[0].b, X, X);
      var q2 = addAcross(q1, tri[0].a, tri[0].b, X, X);
      return {
        produtos:[P(q2,'principal'), P(q1,'secundário','com 1 mol de X₂')],
        regra:'Alcino consome 2 mols',
        porque:'Cada mol de halogênio quebra uma ligação pi. Com excesso, forma-se o tetra-haleto.'
      };
    }
    if(sr){
      var po = openRing(m, sr[0], sr[1], X, X);
      return {
        produtos:[P(po,'principal')],
        regra:'Abertura de anel tensionado',
        porque:'Ciclopropano e ciclobutano abrem o anel e os halogênios ficam nas duas pontas.'
      };
    }
    return null;
  }
});

RX.push({
  id:'hidrohalogenacao', grupo:'Adição', nome:'Adição de hidrácido (Markovnikov)',
  reagente:'HCl, HBr ou HI', condicao:'sem peróxido',
  classes:['Adição'],
  aplica:function(m){ return dblCC(m).length || triCC(m).length || smallRing(m); },
  run:function(m, opt){
    var X = (opt && opt.X) || 'Br';
    var dbl = dblCC(m), tri = triCC(m), sr = smallRing(m);
    if(dbl.length){
      var b = dbl[0], mk = markov(m, b.a, b.b);
      var principal = addAcross(m, mk.hC, mk.xC, 'H', X);
      var anti = addAcross(m, mk.xC, mk.hC, 'H', X);
      var out = {
        produtos:[P(principal,'principal')],
        regra:'Regra de Markovnikov',
        porque:mk.simetrico
          ? 'Os dois carbonos da dupla têm o mesmo número de hidrogênios, então só existe um produto possível: a regra de Markovnikov não precisa ser usada.'
          : 'Markovnikov: o hidrogênio entra no carbono MAIS hidrogenado (o que já tem mais H) e o halogênio no menos hidrogenado. "Quem tem mais, ganha mais."',
        mecanismo:'O H⁺ entra primeiro e forma o carbocátion MAIS ESTÁVEL (3° > 2° > 1°). O halogeneto ataca esse carbono — por isso o X fica no carbono menos hidrogenado.',
        alvo:[mk.hC, mk.xC]
      };
      if(!mk.simetrico) out.distratores = [{ mol:anti, erro:'Esse é o produto anti-Markovnikov. Só aparece com HBr NA PRESENÇA DE PERÓXIDO.' }];
      return out;
    }
    if(tri.length){
      var t = tri[0], mk2 = markov(m, t.a, t.b);
      var p1 = addAcross(m, mk2.hC, mk2.xC, 'H', X);
      var d2 = dblCC(p1)[0];
      var p2 = d2 ? addAcross(p1, d2.a, d2.b, 'H', X) : p1;
      // o segundo halogênio entra no MESMO carbono (Markovnikov de novo)
      return {
        produtos:[P(p1,'principal','com 1 mol de HX'), P(p2,'secundário','com 2 mols de HX (di-haleto geminado)')],
        regra:'Markovnikov duas vezes',
        porque:'Na primeira adição o H vai para o carbono mais hidrogenado. Na segunda, o mesmo raciocínio faz o segundo halogênio entrar NO MESMO carbono do primeiro: forma-se um di-haleto geminado.'
      };
    }
    if(sr){
      // escolhe a ligação do anel entre o carbono MAIS e o MENOS hidrogenado;
      // o H entra no mais hidrogenado (Markovnikov aplicado à abertura)
      var melhor = null;
      for(var k=0;k<sr.length;k++){
        var a = sr[k], b = sr[(k+1)%sr.length];
        var dif = Math.abs(M.h(m,a) - M.h(m,b));
        if(!melhor || dif > melhor.dif) melhor = { a:a, b:b, dif:dif };
      }
      var hC = M.h(m,melhor.a) >= M.h(m,melhor.b) ? melhor.a : melhor.b;
      var xC = hC===melhor.a ? melhor.b : melhor.a;
      var po = openRing(m, hC, xC, 'H', X);
      return {
        produtos:[P(po,'principal')],
        regra:'Abertura com Markovnikov',
        porque:'O anel tensionado se rompe na ligação entre o carbono mais e o menos hidrogenado. O H entra no carbono MAIS hidrogenado e o halogênio no menos — a mesma lógica de Markovnikov usada nos alcenos.',
        alvo:[hC, xC]
      };
    }
    return null;
  }
});

RX.push({
  id:'hbr_peroxido', grupo:'Adição', nome:'Adição anti-Markovnikov (efeito Kharasch)',
  reagente:'HBr', condicao:'na presença de peróxido (H₂O₂ ou R–O–O–R)',
  classes:['Adição'],
  aplica:function(m){ return dblCC(m).length>0; },
  run:function(m){
    var b = dblCC(m)[0], mk = markov(m, b.a, b.b);
    var principal = addAcross(m, mk.xC, mk.hC, 'H','Br');  // invertido
    var markovProd = addAcross(m, mk.hC, mk.xC, 'H','Br');
    return {
      produtos:[P(principal,'principal')],
      regra:'Anti-Markovnikov (só com HBr + peróxido)',
      porque:'Com peróxido o mecanismo muda de iônico para RADICALAR. O bromo entra como radical no carbono MAIS hidrogenado e o H vai para o menos hidrogenado — exatamente o contrário de Markovnikov. Cuidado: isso só vale para o HBr. Com HCl e HI a regra continua sendo Markovnikov mesmo com peróxido.',
      mecanismo:'O peróxido se quebra e gera radicais; o Br• ataca a dupla formando o radical de carbono MAIS ESTÁVEL (3° > 2° > 1°), que fica no outro carbono.',
      alvo:[mk.hC, mk.xC],
      distratores:[{ mol:markovProd, erro:'Esse é o produto de Markovnikov — seria o certo SEM peróxido.' }]
    };
  }
});

RX.push({
  id:'hidratacao', grupo:'Adição', nome:'Hidratação (adição de água)',
  reagente:'H₂O', condicao:'H₂SO₄ diluído, catálise ácida',
  classes:['Adição'],
  aplica:function(m){ return dblCC(m).length>0; },
  run:function(m){
    var b = dblCC(m)[0], mk = markov(m, b.a, b.b);
    var principal = addAcross(m, mk.hC, mk.xC, 'H','OH');
    var anti = addAcross(m, mk.xC, mk.hC, 'H','OH');
    var out = {
      produtos:[P(principal,'principal')],
      regra:'Markovnikov',
      porque:'A água entra como H e OH. O H vai para o carbono mais hidrogenado e o OH para o menos hidrogenado. Por isso o alceno costuma dar álcool SECUNDÁRIO ou TERCIÁRIO, não primário.',
      mecanismo:'H⁺ forma o carbocátion mais estável; a água ataca esse carbono e depois perde um H⁺.',
      alvo:[mk.hC, mk.xC]
    };
    if(!mk.simetrico) out.distratores = [{ mol:anti, erro:'Esse seria o produto anti-Markovnikov, que não se forma na hidratação com H₂SO₄.' }];
    return out;
  }
});

RX.push({
  id:'hidratacao_alcino', grupo:'Adição', nome:'Hidratação de alcino (enol → tautomeria)',
  reagente:'H₂O', condicao:'H₂SO₄ / HgSO₄',
  classes:['Adição'],
  aplica:function(m){ return triCC(m).length>0; },
  run:function(m){
    var t = triCC(m)[0], mk = markov(m, t.a, t.b);
    var enol = addAcross(m, mk.hC, mk.xC, 'H','OH');       // C=C–OH
    // tautomeria: a dupla some, o OH vira C=O e o H migra
    var final = tautomerize(enol);
    var nC = M.carbons(m).length;
    return {
      produtos:[P(final.mol,'principal'), P(enol,'secundário','enol intermediário (instável)')],
      regra:'Tautomeria enol → carbonila',
      porque: nC===2
        ? 'O etino é a exceção: dá ETANAL (aldeído). Todos os outros alcinos dão CETONA. O enol formado (álcool ligado a carbono de dupla) é instável e se rearranja: a dupla vai para o oxigênio.'
        : 'O OH entra por Markovnikov no carbono menos hidrogenado, formando um enol. O enol é instável: o H do OH migra para o outro carbono e a dupla passa para o oxigênio, gerando uma CETONA. Só o etino foge disso e dá etanal.',
      mecanismo:'C≡C + H₂O → enol (C=C–OH) → tautomeria → C–C=O',
      passosEnol:true
    };
  }
});

// Enol → composto carbonílico
function tautomerize(m){
  var mm = M.clone(m);
  for(var i=0;i<mm.atoms.length;i++){
    if(mm.atoms[i].el!=='O' || M.h(mm,i)!==1) continue;
    var cs = M.nbrIdx(mm,i).filter(function(j){ return mm.atoms[j].el==='C'; });
    if(!cs.length) continue;
    var c = cs[0];
    var d = M.nbrs(mm,c).filter(function(x){ return x.o===2 && mm.atoms[x.j].el==='C'; });
    if(!d.length) continue;
    M.bond(mm, c, d[0].j).o = 1;    // a dupla C=C some
    M.bond(mm, c, i).o = 2;         // vira C=O
    return { mol:mm, mudou:true, carbonila:c };
  }
  return { mol:mm, mudou:false };
}

// Saytzeff: a dupla se forma com o carbono vizinho MENOS hidrogenado
function saytzeff(m, c){
  var viz = M.cNbrs(m,c).filter(function(x){ return M.h(m,x.j)>0 && x.o===1; });
  if(!viz.length) return null;
  var ord = viz.slice().sort(function(a,b){ return M.h(m,a.j) - M.h(m,b.j); });
  return { principal:ord[0].j, outros:ord.slice(1).map(function(x){ return x.j; }) };
}

  id:'desidratacao_intra', grupo:'Eliminação', nome:'Desidratação intramolecular (Saytzeff)',

  classes:['Eliminação'],
  aplica:function(m){ return alcoolCs(m).some(function(g){ return !!saytzeff(m, g.atoms[0]); }); },
  run:function(m){
    var gs = alcoolCs(m).filter(function(g){ return !!saytzeff(m, g.atoms[0]); });
    if(!gs.length) return null;
    var c = gs[0].atoms[0], o = gs[0].atoms[1];
    var sz = saytzeff(m, c);
    function fazer(viz){
      var mm = M.clone(m);
      M.delAtom(mm, o);
      var c2 = c > o ? c-1 : c, v2 = viz > o ? viz-1 : viz;
      M.bond(mm, c2, v2).o = 2;
      return mm;
    }
    var principal = fazer(sz.principal);
    var secund = sz.outros.map(function(v){ return P(fazer(v),'secundário','produto anti-Saytzeff (minoritário)'); });
    return {
      produtos:[P(principal,'principal')].concat(secund).concat([T('H₂O')]),
      regra:'Regra de Saytzeff',
      porque:'Sai o OH de um carbono e um H do carbono VIZINHO, formando a dupla. Quando há mais de um vizinho possível, sai o H do carbono MENOS hidrogenado — assim a dupla fica mais substituída, que é o alceno mais estável. É a regra de Saytzeff: "o pobre fica mais pobre".',
      mecanismo:'O OH é protonado, sai como água formando carbocátion, e um H do carbono vizinho sai gerando a dupla.',
      alvo:[c, sz.principal],
      atencao:'A 170 °C dá ALCENO. A 140 °C, a mesma mistura dá ÉTER. A temperatura decide o produto.'
    };
  }
});

// Todos os monossubstituídos possíveis, agrupados por hidrogênios equivalentes.
// A contagem de chaves canônicas distintas é o número de isômeros.
function monoSubst(m, X){
  var vistos = {}, out = [];
  M.carbons(m).forEach(function(c){
    if(M.h(m,c)===0) return;
    var mm = M.clone(m);
    attach(mm, c, X);
    var k = canonKey(mm);
    if(vistos[k]) return;
    vistos[k] = 1;
    out.push({ mol:mm, c:c, classe:carbonClass(m,c), nH:M.h(m,c) });
  });
  return out;
}

/* ---- benzeno: dirigência ---- */
var META_DIRIGENTES = ['nitro','carboxi','formil','acil','acetil','sulfo','ciano','triclorometil','carbalcoxi'];
function dirigencia(pref){
  if(META_DIRIGENTES.indexOf(pref)>=0) return { tipo:'meta', ativador:false };
  if(['fluoro','cloro','bromo','iodo'].indexOf(pref)>=0) return { tipo:'orto-para', ativador:false };
  return { tipo:'orto-para', ativador:true };
}

function arilSubstituintes(m, ring){
  var out = [];
  ring.forEach(function(c, idx){
    M.nbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      out.push({ at:c, idx:idx, j:x.j, pref:aromaticSubPrefix(m, c, x.j) });
    });
  });
  return out;
}

// Coloca `grupo` no anel na posição relativa pedida
function arilPor(m, ring, baseIdx, rel, grupo){
  var delta = rel==='orto' ? 1 : rel==='meta' ? 2 : 3;
  var alvo = ring[(baseIdx + delta) % ring.length];
  if(M.h(m, alvo)===0){
    // tenta o lado oposto (orto/meta têm duas posições)
    alvo = ring[(baseIdx - delta + ring.length*2) % ring.length];
    if(M.h(m, alvo)===0) return null;
  }
  var mm = M.clone(m);
  attach(mm, alvo, grupo);
  return mm;
}

function benzenoSubstituicao(m, grupo, nomeReag){
  var ring = benzeneRing(m);
  if(!ring) return null;
  var subs = arilSubstituintes(m, ring);
  if(!subs.length){
    var mm = M.clone(m);
    attach(mm, ring[0], grupo);
    return { produtos:[P(mm,'principal')], regra:'Substituição eletrofílica no anel',
             porque:'O benzeno é muito estável por ressonância, então ele não faz adição: um H do anel é trocado pelo grupo que chega. Como o benzeno não tem substituinte, todas as 6 posições são iguais e só existe um produto.' };
  }
  // o substituinte que manda é o de maior efeito: ativador orto-para vence desativador
  var ordenado = subs.slice().sort(function(a,b){
    var da = dirigencia(a.pref), db = dirigencia(b.pref);
    return (db.ativador?1:0) - (da.ativador?1:0);
  });
  var chefe = ordenado[0];
  var dir = dirigencia(chefe.pref);
  var idx = ring.indexOf(chefe.at);
  if(dir.tipo==='meta'){
    var pm = arilPor(m, ring, idx, 'meta', grupo);
    var po = arilPor(m, ring, idx, 'orto', grupo);
    var pp = arilPor(m, ring, idx, 'para', grupo);
    var dist = [];
    if(po) dist.push({ mol:po, erro:'O grupo –'+chefe.pref+' é META-dirigente: não dá produto orto.' });
    if(pp) dist.push({ mol:pp, erro:'O grupo –'+chefe.pref+' é META-dirigente: não dá produto para.' });
    return {
      produtos:[P(pm,'principal')],
      regra:'Dirigência META',
      porque:'O grupo –'+chefe.pref+' já presente no anel é DESATIVADOR e META-dirigente: ele empobrece o anel de elétrons justamente nas posições orto e para, então o novo grupo entra na posição META (posição 3). Grupos meta-dirigentes: –NO₂, –COOH, –CHO, –CO–R, –SO₃H, –CN, –CCl₃.',
      distratores:dist,
      alvo:[ring[(idx+2)%6]]
    };
  }
  var pOrto = arilPor(m, ring, idx, 'orto', grupo);
  var pPara = arilPor(m, ring, idx, 'para', grupo);
  var pMeta = arilPor(m, ring, idx, 'meta', grupo);
  var prods = [];
  if(pPara) prods.push(P(pPara,'principal','isômero para (predomina — menos impedimento)'));
  if(pOrto) prods.push(P(pOrto, pPara?'secundário':'principal','isômero orto'));
  var desat = dir.ativador ? '' : ' Atenção: os halogênios são uma exceção curiosa — DESATIVAM o anel (deixam a reação mais lenta) mas ainda assim dirigem para orto e para.';
  return {
    produtos:prods,
    regra:'Dirigência ORTO-PARA',
    porque:'O grupo –'+chefe.pref+' já presente no anel é ORTO-PARA dirigente: ele enriquece (ou dirige) as posições 2 e 4, então o novo grupo entra em orto ou em para, formando uma MISTURA dos dois isômeros. Grupos orto-para: –OH, –NH₂, –OR, –R (alquila) e os halogênios.' + desat,
    distratores: pMeta ? [{ mol:pMeta, erro:'Esse é o isômero meta — errado, porque o grupo que já estava no anel é orto-para dirigente.' }] : [],

function subsHaleto(m, spec, nomeProduto){
  var hs = haletoCs(m);
  if(!hs.length) return null;
  var h = hs[0];
  var mm = M.clone(m);
  M.delAtom(mm, h.x);
  var c = h.c > h.x ? h.c-1 : h.c;
  attach(mm, c, spec);
  return { mol:mm, c:c, x:h.el };
}

   REGRAS — OXIRREDUÇÃO
   ========================================================================== */

function coefTxt(v, mult){
  v = Math.round(v*mult*1000)/1000;
  return v===1 ? '' : v + ' ';
}
function combustaoEq(m, completa){
  var c = atomCount(m);
  var x = c.C, y = c.H, z = c.O || 0;
  var fml = formulaPlain(m);
  function inteiro(v, k){ return Math.abs(v*k - Math.round(v*k)) < 1e-9; }
  if(completa){
    var o2 = x + y/4 - z/2, h2o = y/2, mult = 1;
    while(!(inteiro(o2,mult) && inteiro(h2o,mult)) && mult<8) mult++;
    return coefTxt(1,mult) + fml + ' + ' + coefTxt(o2,mult) + 'O₂ → ' +
           coefTxt(x,mult) + 'CO₂ + ' + coefTxt(h2o,mult) + 'H₂O';
  }
  var o2b = x/2 + y/4 - z/2, m2 = 1;
  while(!(inteiro(o2b,m2) && inteiro(y/2,m2)) && m2<8) m2++;
  return coefTxt(1,m2) + fml + ' + ' + coefTxt(o2b,m2) + 'O₂ → ' +
         coefTxt(x,m2) + 'CO + ' + coefTxt(y/2,m2) + 'H₂O';
}

// Quebra oxidativa da dupla
function quebraDupla(m, modo){
  var b = dblCC(m)[0];
  if(!b) return null;
  var mm = M.clone(m);
  var ha = M.h(mm, b.a), hb = M.h(mm, b.b);
  M.delBond(mm, b.a, b.b);
  var notas = [], co2 = 0;
  [[b.a,ha],[b.b,hb]].forEach(function(par){
    var c = par[0], h = par[1];
    if(modo==='energica'){
      if(h===2){ attach(mm,c,'=O'); attach(mm,c,'=O'); co2++; notas.push('=CH₂ vira CO₂ + H₂O'); }
      else if(h===1){ attach(mm,c,'=O'); attach(mm,c,'OH'); notas.push('carbono com 1 H vira ÁCIDO CARBOXÍLICO'); }
      else { attach(mm,c,'=O'); notas.push('carbono com 2 cadeias vira CETONA'); }
    } else {
      attach(mm,c,'=O');
      notas.push(h>=1 ? 'carbono com H vira ALDEÍDO' : 'carbono sem H vira CETONA');
    }
  });
  return { mol:mm, notas:notas, co2:co2, alvo:[b.a,b.b] };
}

  id:'oxidacao_energica', grupo:'Oxirredução', nome:'Oxidação enérgica',
  reagente:'KMnO₄ (ou K₂Cr₂O₇)', condicao:'meio ÁCIDO (H₂SO₄), a QUENTE',
  classes:['Oxirredução'],
  aplica:function(m){ return dblCC(m).length>0 || (benzeneRing(m) && temCadeiaLateralOxidavel(m)); },
  run:function(m){
    if(dblCC(m).length){
      var r = quebraDupla(m, 'energica');
      var partes = M.split(r.mol).filter(function(x){
        return !(x.atoms.length===3 && formulaPlain(x)==='CO2');
      });
      var prods = partes.map(function(x){ return P(x,'principal'); });
      if(r.co2) prods.push(T(r.co2>1 ? r.co2+' CO₂ + H₂O' : 'CO₂ + H₂O','principal'));
      return {
        produtos:prods,
        regra:'Quebra da dupla — conte os hidrogênios',
        porque:'A cadeia se PARTE exatamente na dupla. O que cada pedaço vira depende de quantos hidrogênios o carbono da dupla tinha:\n• 2 H (=CH₂) → CO₂ + H₂O\n• 1 H → ÁCIDO CARBOXÍLICO\n• nenhum H (dois grupos ligados) → CETONA',
        mecanismo:r.notas.join(' · '),
        alvo:r.alvo,
        atencao:'Cetona NÃO oxida mais (não tem H no carbono da carbonila). Já o aldeído continuaria oxidando até ácido.'
      };
    }
    var ring = benzeneRing(m);
    var mm = M.clone(m);
    // oxidação da cadeia lateral do anel: tudo vira –COOH
    var subs = arilSubstituintes(m, ring).filter(function(s){ return m.atoms[s.j].el==='C'; });
    var base = cutSide(m, subs[0].at, subs[0].j, subs[0].at);
    var novo = M.clone(base.mol);
    attach(novo, base.map[subs[0].at], 'COOH');
    return {
      produtos:[P(novo,'principal'), T('CO₂ + H₂O')],
      regra:'Oxidação da cadeia lateral',
      porque:'O anel aromático resiste à oxidação, mas a CADEIA LATERAL é oxidada até –COOH, não importa o tamanho dela. Qualquer alquilbenzeno com H no carbono ligado ao anel dá ÁCIDO BENZOICO.',
      atencao:'Se o carbono ligado ao anel não tiver hidrogênio nenhum (como no terc-butilbenzeno), a cadeia lateral não oxida.'
    };
  }
});

function temCadeiaLateralOxidavel(m){
  var ring = benzeneRing(m);
  if(!ring) return false;
  return arilSubstituintes(m, ring).some(function(s){
    return m.atoms[s.j].el==='C' && M.h(m, s.j)>0;
  });
}

RX.push({

  classes:['Oxirredução','Redução'],
  aplica:function(m){
    return groupsOf(m).some(function(g){ return ['acido','ester','aldeido','cetona'].indexOf(g.tipo)>=0; });
  },
  run:function(m){
    var g = groupsOf(m).filter(function(x){ return ['acido','ester','aldeido','cetona'].indexOf(x.tipo)>=0; })[0];
    var mm = M.clone(m);
    if(g.tipo==='acido'){
      // COOH → CH2OH: remove um dos oxigênios e abre a dupla
      var C = g.atoms[0], Osimples = g.atoms[1], Odbl = g.atoms[2];
      M.delAtom(mm, Odbl);
      var c2 = C > Odbl ? C-1 : C;
      var o2 = Osimples > Odbl ? Osimples-1 : Osimples;
      M.bond(mm, c2, o2).o = 1;
      return {
        produtos:[P(mm,'principal')],
        regra:'Só hidreto reduz ácido e éster',
        porque:'Ácidos carboxílicos e ésteres NÃO são reduzidos por H₂/Ni — eles são resistentes demais. Só um redutor forte como o LiAlH₄ consegue, e o produto é sempre um ÁLCOOL PRIMÁRIO.'
      };
    }
    if(g.tipo==='ester'){
      var Ce = g.atoms[0], Oe = g.atoms[1], Od = g.atoms[2], Re = g.atoms[3];
      var acidoLado = cutSide(m, Oe, Re, Ce);
      var alcoLado = cutSide(m, Oe, Re, Re);
      var p1 = M.clone(acidoLado.mol);
      // reduz a carbonila a CH2OH
      var cIdx = acidoLado.map[Ce], oD = acidoLado.map[Od], oS = acidoLado.map[Oe];
      M.delAtom(p1, oD);
      var ci = cIdx > oD ? cIdx-1 : cIdx, oi = oS > oD ? oS-1 : oS;
      M.bond(p1, ci, oi).o = 1;
      var p2 = M.clone(alcoLado.mol);
      attach(p2, alcoLado.map[Re], 'OH');
      return {
        produtos:[P(p1,'principal'), P(p2,'principal')],
        regra:'Éster → dois álcoois',
        porque:'O LiAlH₄ quebra o éster e reduz o lado do ácido a álcool primário; o outro lado sai como o álcool que já estava ali.'
      };
    }
    var p = addAcross(m, g.atoms[0], g.atoms[1], 'H','H');
    return {
      produtos:[P(p,'principal')],
      regra:'Carbonila → álcool',
      porque:'Aldeído vira álcool primário e cetona vira álcool secundário. Aqui o H₂/Ni também funcionaria.'

function reacoesAplicaveis(m){
  return RX.filter(function(r){
    try { return !!r.aplica(m); } catch(e){ return false; }
  });
}
function rxById(id){
  for(var i=0;i<RX.length;i++) if(RX[i].id===id) return RX[i];
  return null;
}
function rodarReacao(id, m, opt){
  var r = rxById(id);
  if(!r) return null;
  try {
    if(!r.aplica(m)) return { erro:'Esta molécula não atende ao requisito desta reação.' };
    var res = r.run(m, opt);
    if(!res) return { erro:'Não foi possível aplicar a regra a esta estrutura.' };
    res.regraObj = r;
    return res;
  } catch(e){
    return { erro:'Erro ao aplicar a reação: ' + e.message };
  }
}

var NIVEL_CFG = [
  null,
  { nome:'Fundamentos', nC:[1,5], ram:1, funcs:['alcano'] },
  { nome:'Adição',      nC:[2,6], ram:1, funcs:['alcano','alceno','alcino','dieno','ciclano'] },
  { nome:'Eliminação',  nC:[2,6], ram:2, funcs:['alcool','haleto','alceno'] },
  { nome:'Substituição',nC:[3,7], ram:2, funcs:['alcano','haleto','aromatico','ciclano'] },
  { nome:'Oxirredução', nC:[2,7], ram:2, funcs:['alcool','aldeido','cetona','acido','alceno','aromatico'] },
  { nome:'Integração',  nC:[2,8], ram:2, funcs:['alcano','alceno','alcino','dieno','ciclano','haleto','alcool','fenol',
                                                'eter','aldeido','cetona','acido','ester','amina','amida','nitrila','nitro','aromatico'] }
];

function randomSkeleton(nC, maxRam){
  var m = M.make();
  M.addAtom(m,'C');
  for(var i=1;i<nC;i++){
    var cands = M.carbons(m).filter(function(c){
      return M.h(m,c)>0 && M.cNbrs(m,c).length < (2 + maxRam);
    });
    if(!cands.length) break;
    // dá preferência a crescer nas pontas para não virar uma bola de ramos
    var pontas = cands.filter(function(c){ return M.cNbrs(m,c).length<=1; });
    var alvo = (Math.random()<0.65 && pontas.length) ? pick(pontas) : pick(cands);
    var k = M.addAtom(m,'C');
    M.addBond(m, alvo, k, 1);
  }
  return m;
}

function aplicarFuncao(m, tipo){
  var mm = M.clone(m);
  var cs = M.carbons(mm);
  function comH(minH){ return cs.filter(function(c){ return M.h(mm,c)>=(minH||1); }); }

  if(tipo==='alcano') return mm;

  if(tipo==='alceno' || tipo==='alcino'){
    var ord = tipo==='alceno' ? 2 : 3;
    var cands = mm.bonds.filter(function(b){
      return mm.atoms[b.a].el==='C' && mm.atoms[b.b].el==='C' &&
             M.h(mm,b.a) >= ord-1 && M.h(mm,b.b) >= ord-1;
    });
    if(!cands.length) return null;
    pick(cands).o = ord;
    return mm;
  }
  if(tipo==='dieno'){
    var b1 = mm.bonds.filter(function(b){ return M.h(mm,b.a)>=1 && M.h(mm,b.b)>=1; });
    if(b1.length<2) return null;
    var esc = shuffle(b1).slice(0,2);
    // tenta deixá-los conjugados
    esc.forEach(function(b){ if(M.h(mm,b.a)>=1 && M.h(mm,b.b)>=1) b.o = 2; });
    return mm;
  }
  if(tipo==='ciclano'){
    var n = 3 + rnd(4);
    var r = M.make();
    for(var i=0;i<n;i++) M.addAtom(r,'C');
    for(var k=0;k<n;k++) M.addBond(r, k, (k+1)%n, 1);
    if(Math.random()<0.45 && n>=4){
      var alvo = rnd(n), me = M.addAtom(r,'C');
      M.addBond(r, alvo, me, 1);
    }
    return r;
  }
  if(tipo==='aromatico'){
    var b = smiles('C1=CC=CC=C1');
    var ring = findRing(b);
    var subs = ['CH3','Cl','Br','NO2','OH','C2H5'];
    var q = 1 + (Math.random()<0.45 ? 1 : 0);
    var usados = [];
    for(var s=0;s<q;s++){
      var p = rnd(6), guard = 0;
      while(usados.indexOf(p)>=0 && guard++<20) p = rnd(6);
      usados.push(p);
      var g = pick(subs);
      if(g==='CH3') attach(b, ring[p], 'CH3');
      else if(g==='C2H5'){ var c1 = attach(b, ring[p], 'CH3'); attach(b, c1, 'CH3'); }
      else if(g==='OH') attach(b, ring[p], 'OH');
      else if(g==='NO2') attach(b, ring[p], 'NO2');
      else attach(b, ring[p], g);
    }
    return b;
  }

  var alvo;
  switch(tipo){
    case 'alcool':
      alvo = pick(comH(1)); if(alvo===undefined) return null;
      attach(mm, alvo, 'OH'); return mm;
    case 'fenol':
      var f = smiles('C1=CC=CC=C1'); attach(f, findRing(f)[0], 'OH'); return f;
    case 'haleto':
      alvo = pick(comH(1)); if(alvo===undefined) return null;
      attach(mm, alvo, pick(['Cl','Br','I','F'])); return mm;
    case 'nitro':
      alvo = pick(comH(1)); if(alvo===undefined) return null;
      attach(mm, alvo, 'NO2'); return mm;
    case 'aldeido':
      var pontas = cs.filter(function(c){ return M.cNbrs(mm,c).length<=1 && M.h(mm,c)>=2; });
      if(!pontas.length) return null;
      attach(mm, pick(pontas), '=O'); return mm;
    case 'cetona':
      var meios = cs.filter(function(c){ return M.cNbrs(mm,c).length===2 && M.h(mm,c)>=2; });
      if(!meios.length) return null;
      attach(mm, pick(meios), '=O'); return mm;
    case 'acido':
      var p2 = cs.filter(function(c){ return M.cNbrs(mm,c).length<=1 && M.h(mm,c)>=3; });
      if(!p2.length) return null;
      var c2 = pick(p2); attach(mm, c2, '=O'); attach(mm, c2, 'OH'); return mm;
    case 'ester':
      var p3 = cs.filter(function(c){ return M.cNbrs(mm,c).length<=1 && M.h(mm,c)>=3; });
      if(!p3.length) return null;
      var c3 = pick(p3);
      attach(mm, c3, '=O');
      var o3 = attach(mm, c3, 'O');
      var r3 = attach(mm, o3, 'CH3');
      if(Math.random()<0.5) attach(mm, r3, 'CH3');
      return mm;
    case 'eter':
      var p4 = cs.filter(function(c){ return M.h(mm,c)>=1; });
      if(!p4.length) return null;
      var o4 = attach(mm, pick(p4), 'O');
      var r4 = attach(mm, o4, 'CH3');
      if(Math.random()<0.4) attach(mm, r4, 'CH3');
      return mm;
    case 'amina':
      alvo = pick(comH(1)); if(alvo===undefined) return null;
      attach(mm, alvo, 'NH2'); return mm;
    case 'amida':
      var p5 = cs.filter(function(c){ return M.cNbrs(mm,c).length<=1 && M.h(mm,c)>=3; });
      if(!p5.length) return null;
      var c5 = pick(p5); attach(mm, c5, '=O'); attach(mm, c5, 'NH2'); return mm;
    case 'nitrila':
      var p6 = cs.filter(function(c){ return M.cNbrs(mm,c).length<=1 && M.h(mm,c)>=3; });
      if(!p6.length) return null;
      attach(mm, pick(p6), 'CN'); return mm;
  }
  return mm;
}

// Gera um álcool / haleto de classe 1°, 2° ou 3°, ou uma amina primária,
// secundária ou terciária. É o que alimenta o treino de classificação.
function gerarClassificado(tipo, classe){
  if(tipo==='amina'){
    for(var t=0;t<50;t++){
      var m = M.make();
      var n = M.addAtom(m,'N');
      for(var k=0;k<classe;k++){
        var tam = 1 + rnd(3), prev = n;
        for(var i=0;i<tam;i++){
          var c = M.addAtom(m,'C');
          M.addBond(m, prev, c, 1);
          prev = c;
        }
      }
      if(!M.valid(m)) continue;
      var g = groupsOf(m).filter(function(x){ return x.tipo==='amina'; })[0];
      if(!g || g.classe!==classe) continue;
      var nome = iupacName(m);
      if(!nome || nome==='—' || /undefined|NaN/.test(nome)) continue;
      return m;
    }
    return smiles(['CCN','CCNC','CCN(C)C'][classe-1]);
  }
  for(var tent=0; tent<80; tent++){
    var nC = Math.max(classe+1, 2 + rnd(5));
    var esq = randomSkeleton(nC, 2);
    var cands = M.carbons(esq).filter(function(c){
      return carbonClass(esq,c)===classe && M.h(esq,c)>=1;
    });
    if(!cands.length) continue;
    var mm = M.clone(esq), alvo = pick(cands);
    if(tipo==='alcool') attach(mm, alvo, 'OH');
    else attach(mm, alvo, pick(['Cl','Br','I']));
    if(!M.valid(mm)) continue;
    var gg = groupsOf(mm).filter(function(x){ return x.tipo===tipo; })[0];
    if(!gg || gg.classe!==classe) continue;
    var nm = iupacName(mm);
    if(!nm || nm==='—' || /undefined|NaN/.test(nm)) continue;
    return mm;
  }
  var reserva = {
    alcool:['CCCO','CCC(O)C','CC(C)(C)O'],
    haleto:['CCCCl','CCC(Cl)C','CC(C)(Cl)C']
  };
  return smiles(reserva[tipo][classe-1]);
}

function gerarMolecula(nivel, forcarTipo){
  var cfg = NIVEL_CFG[Math.min(Math.max(nivel,1), NIVEL_CFG.length-1)];
  for(var tent=0; tent<60; tent++){
    var tipo = forcarTipo || pick(cfg.funcs);
    var nC = cfg.nC[0] + rnd(cfg.nC[1]-cfg.nC[0]+1);
    if(tipo==='acido'||tipo==='ester'||tipo==='amida'||tipo==='nitrila') nC = Math.max(2, nC-1);
    var esq = randomSkeleton(nC, cfg.ram);
    var m = aplicarFuncao(esq, tipo);
    if(!m || !M.valid(m)) continue;
    if(M.carbons(m).length < 1) continue;
    var nome;
    try { nome = iupacName(m); } catch(e){ continue; }
    if(!nome || nome==='—' || /undefined|NaN|\?|muito longa|poli/.test(nome)) continue;
    // não repetir a mesma molécula da rodada anterior
    if(ULTIMA_GERADA === canonKey(m)) continue;
    ULTIMA_GERADA = canonKey(m);
    return m;
  }
  return smiles(pick(['CCC','CC=CC','CCO','CC(=O)C','CCCC']));
}
var ULTIMA_GERADA = '';

// Molécula aleatória que sirva para uma reação específica
function gerarParaReacao(rxId, nivel){
  var r = rxById(rxId);
  for(var i=0;i<80;i++){
    var m = gerarMolecula(nivel||3);
    try { if(r.aplica(m)){ var res = r.run(m); if(res && res.produtos && res.produtos.length) return m; } } catch(e){}
  }
  // exemplos de segurança por reação
  var fallback = {
    hidrogenacao:'CC=CC', halogenacao_adicao:'CC=CC', hidrohalogenacao:'C=CC',
    hbr_peroxido:'C=CC', hidratacao:'C=CC', hidratacao_alcino:'CC#C',
    dieno_conjugado:'C=CC=C', polimerizacao:'C=C',
    desidratacao_intra:'CCC(O)C', desidratacao_inter:'CCO', desidroalogenacao:'CCC(Br)C',
    desalogenacao:'BrCCBr', desidrogenacao:'CCC',
    halogenacao_alcano:'CC(C)CC', nitracao_alcano:'CCC', sulfonacao_alcano:'CCC',
    benzeno_halogenacao:'CC1=CC=CC=C1', benzeno_nitracao:'CC1=CC=CC=C1',
    benzeno_sulfonacao:'C1=CC=CC=C1', friedel_alquilacao:'C1=CC=CC=C1',
    friedel_acilacao:'C1=CC=CC=C1', benzeno_bhc:'C1=CC=CC=C1',
    haleto_hidrolise:'CCC(Br)C', haleto_alcoxido:'CCCl', haleto_cianeto:'CCCl', haleto_amonia:'CCCl',
    esterificacao:'CC(=O)O', hidrolise_ester:'CC(=O)OCC', saponificacao:'CC(=O)OCC',
    combustao:'CCC', oxidacao_branda:'CC=CC', oxidacao_energica:'CC(C)=CC',
    ozonolise:'CC(C)=CC', oxidacao_alcool:'CCC(O)C', bafometro:'CCO',
    reducao_lialh4:'CC(=O)O', reducao_nitro:'{NO2}C1=CC=CC=C1', reducao_nitrila:'CC#N',
    alcool_sodio:'CCO', fenol_naoh:'OC1=CC=CC=C1'
  };
  return smiles(fallback[rxId] || 'CC=CC');
}

function livroPorTitulo(t){
  for(var i=0;i<LIVRO.length;i++) if(LIVRO[i].tit===t) return LIVRO[i];
  return null;
}
function buscarLivro(q){
  q = normName(q);
  if(!q) return LIVRO;
  return LIVRO.filter(function(v){
    return normName(v.tit + ' ' + v.cat + ' ' + (v.tags||'') + ' ' + v.txt + ' ' + (v.peg||'')).indexOf(q) >= 0;
  });
}

function molToJSON(m){
  return { a:m.atoms.map(function(x){ return x.el; }),
           b:m.bonds.map(function(x){ return [x.a, x.b, x.o]; }) };
}
function molFromJSON(j){
  var m = M.make();
  (j.a||[]).forEach(function(el){ M.addAtom(m, el); });
  (j.b||[]).forEach(function(b){ M.addBond(m, b[0], b[1], b[2]); });
  return m;
}

      S = Object.assign(JSON.parse(JSON.stringify(estadoPadrao)), o);
      S.stats = Object.assign({ respondidas:0, acertos:0, contadores:{} }, o.stats||{});
    }
  } catch(e){ /* primeira vez ou storage bloqueado: segue com o padrão */ }
}
function salvar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch(e){}
}
function zerarProgresso(){
  S = JSON.parse(JSON.stringify(estadoPadrao));
  salvar();
}

function nivelJogador(){ return Math.floor(S.xp/250) + 1; }
function xpNoNivel(){ return S.xp % 250; }

function darXP(n, motivo){
  S.xp += n;
  salvar();
  atualizarHeader();
  if(n>0) toast('+' + n + ' XP' + (motivo ? ' — ' + motivo : ''));
}

function registrarTopico(topico, acertou){
  if(!S.topicos[topico]) S.topicos[topico] = { c:0, e:0 };
  S.topicos[topico][acertou ? 'c' : 'e']++;
  S.stats.respondidas++;
  if(acertou) S.stats.acertos++;
  salvar();
}
function contar(chave, n){
  S.stats.contadores[chave] = (S.stats.contadores[chave]||0) + (n===undefined?1:n);
  salvar();
  return S.stats.contadores[chave];
}

/* ---- revisão espaçada: o que errei volta até 3 acertos seguidos ---- */
function paraRevisao(q){
  if(!q || !q.mol) return;
  var chave = q.topico + '|' + canonKey(q.mol);
  var ja = S.revisao.filter(function(r){ return r.chave===chave; })[0];
  if(ja){ ja.acertos = 0; ja.quando = Date.now(); }
  else S.revisao.push({ chave:chave, topico:q.topico, mol:molToJSON(q.mol), acertos:0, quando:Date.now() });
  if(S.revisao.length > 60) S.revisao.shift();
  salvar();
  atualizarHeader();
}
function acertouRevisao(q){
  if(!q || !q.mol) return;
  var chave = q.topico + '|' + canonKey(q.mol);
  for(var i=0;i<S.revisao.length;i++){
    if(S.revisao[i].chave===chave){
      S.revisao[i].acertos++;
      if(S.revisao[i].acertos >= 3){
        S.revisao.splice(i,1);
        toast('Item dominado — saiu da fila de revisão', 'gold');
        if(!S.revisao.length) ganharConquista('revisor');
      }
      salvar(); atualizarHeader();
      return;
    }
  }
}
function proximoRevisao(){
  if(!S.revisao.length) return null;
  var r = S.revisao.slice().sort(function(a,b){ return a.acertos - b.acertos || a.quando - b.quando; })[0];
  return { topico:r.topico, mol:molFromJSON(r.mol) };
}

/* ---- conquistas ---- */
function ganharConquista(id){
  if(S.conquistas[id]) return;
  var c = CONQUISTAS.filter(function(x){ return x.id===id; })[0];
  if(!c) return;
  S.conquistas[id] = Date.now();
  salvar();
  toast('Conquista: ' + c.nome, 'gold');
}
function checarConquistas(){
  if(contarSemIncrementar('markov_ok') >= 5) ganharConquista('markovnikov');
  if(contarSemIncrementar('saytzeff_ok') >= 5) ganharConquista('saytzeff');
  if(contarSemIncrementar('nome_ok') >= 15) ganharConquista('nomeador');
  if(contarSemIncrementar('nox_ok') >= 10) ganharConquista('nox');
  if(contarSemIncrementar('dirigencia_ok') >= 5) ganharConquista('dirigente');
  if(contarSemIncrementar('inverso_ok') >= 5) ganharConquista('inverso');
  if(S.stats.respondidas >= 100) ganharConquista('maratona');
  if(TRILHA.every(function(t){ return S.trilha[t.id] && S.trilha[t.id].concluido; })) ganharConquista('trilha');
}
function contarSemIncrementar(k){ return S.stats.contadores[k] || 0; }

/* ---- trilha ---- */
function trilhaDe(id){
  if(!S.trilha[id]) S.trilha[id] = { pratica:0, melhorDesafio:0, estrelas:0, concluido:false };
  return S.trilha[id];
}
function nivelLiberado(id){
  if(id===1) return true;
  var ant = S.trilha[id-1];
  return !!(ant && ant.concluido);
}
function ultimoNivelLiberado(){
  var n = 1;
  TRILHA.forEach(function(t){ if(nivelLiberado(t.id)) n = t.id; });
  return n;
}

// distratores de molécula, garantindo que sejam diferentes do gabarito
function distratoresMol(certo, candidatos, n){
  var kc = canonKey(certo), vistos = {}, out = [];
  vistos[kc] = 1;
  candidatos.forEach(function(c){
    if(out.length >= n || !c || !c.mol) return;
    try {
      var k = canonKey(c.mol);
      if(vistos[k]) return;
      var nm = iupacName(c.mol);
      if(!nm || nm==='—' || /undefined/.test(nm)) return;
      vistos[k] = 1;
      out.push(c);
    } catch(e){}
  });
  return out;
}

// nome errado por numeração: troca o localizador por outro válido
function nomeNumeracaoErrada(nome){
  var mm = nome.match(/(\d+)/);
  if(!mm) return null;
  var d = parseInt(mm[1],10);
  var novo = d===1 ? 2 : (d===2 ? (/-[34]-/.test(nome)?1:3) : d-1);
  var alt = nome.replace(/\d+/, String(novo));
  return alt===nome ? null : alt;
}

function explicarNome(m){
  var g = mainGroup(m);
  var partes = [];
  var cs = M.carbons(m).length;
  partes.push('São ' + cs + ' carbonos no total.');
  if(g) partes.push('A função principal é <b>' + g.rotulo + '</b>, que define o sufixo.');
  var q = chiralCarbons(m);
  if(q.length) partes.push('Existe ' + q.length + ' carbono quiral nesta estrutura.');
  return partes.join(' ');
}

function questaoClasse(nivel, molDada){
  var m = molDada, alvo = -1;

    if(cands.length) alvo = pick(cands);
    else if(molDada) alvo = pick(M.carbons(m));

  if(alvo<0){ m = smiles('CC(C)CC'); alvo = 1; }
  var cls = carbonClass(m, alvo);

  });

function questaoNox(nivel, molDada){
  var m = molDada || gerarMolecula(Math.max(nivel,3));
  var cs = M.carbons(m);
  var alvo = pick(cs);
  var nox = noxCarbon(m, alvo);
  var opts = {}, lista = [];
  lista.push(nox);
  [nox+1, nox-1, nox+2, nox-2, -nox].forEach(function(v){
    if(lista.length<4 && lista.indexOf(v)<0 && v>=-4 && v<=4) lista.push(v);
  });
  var ops = shuffle(lista).map(function(v){
    return opc(noxStr(v), v===nox, 'Recontando: cada H vale −1, cada C vale 0 e cada ligação com O/N/halogênio vale +1.');
  });
  var nH = M.h(m,alvo);
  var het = M.nbrs(m,alvo).filter(function(x){ return m.atoms[x.j].el!=='C'; });
  var somaHet = het.reduce(function(a,x){ return a + x.o; }, 0);
  return {

  };
}

function questaoQuiral(nivel){

  });
  if(n>2) ops = [opc('Nenhum',false),opc('1 carbono',false),opc(n+' carbonos',true)];

    enunciado:'Quantos carbonos quirais (assimétricos) esta molécula tem?',

}

function questaoProduto(topico, nivel, rxForcada, tentativa){
  var ids = RX_POR_TOPICO[topico] || RX_POR_TOPICO.produto_adicao;
  var id = rxForcada || pick(ids);
  var m = gerarParaReacao(id, nivel);
  var res = rodarReacao(id, m, { X: pick(['Cl','Br']) });
  var r = rxById(id);
  // Nestes dois tópicos a graça está na ESCOLHA entre dois produtos possíveis:
  // se a molécula sorteada for simétrica, sorteia outra.
  tentativa = tentativa || 0;
  if(tentativa < 12 && res && !res.erro){
    var temEscolha = (res.distratores && res.distratores.length) ||
                     res.produtos.some(function(p){ return p.papel==='secundário' && p.mol; });
    if((topico==='markovnikov' || topico==='saytzeff') && !temEscolha)
      return questaoProduto(topico, nivel, rxForcada, tentativa+1);
  }
  if(!res || res.erro || !res.produtos.length) return questaoProduto('produto_adicao', nivel, 'hidrohalogenacao');
  var principais = res.produtos.filter(function(p){ return p.papel==='principal' && p.mol; });
  if(!principais.length) return questaoProduto('produto_adicao', nivel, 'hidrohalogenacao');
  var certo = principais[0].mol;

  // distratores: os da própria regra, os secundários e produtos de outras reações
  var cands = [];
  (res.distratores||[]).forEach(function(d){ cands.push({ mol:d.mol, erro:d.erro }); });
  res.produtos.forEach(function(p){
    if(p.mol && p.papel==='secundário') cands.push({ mol:p.mol, erro:'Esse é o produto SECUNDÁRIO — ' + (p.nota||'forma-se em menor quantidade') + '.' });
  });
  reacoesAplicaveis(m).forEach(function(outra){
    if(outra.id===id || cands.length>6) return;
    var o = rodarReacao(outra.id, m);
    if(o && !o.erro && o.produtos){
      o.produtos.forEach(function(p){
        if(p.mol && p.papel==='principal') cands.push({ mol:p.mol, erro:'Esse seria o produto de outra condição: '+outra.nome+' ('+outra.reagente+', '+outra.condicao+').' });
      });
    }
  });
  var dist = distratoresMol(certo, shuffle(cands), 3);
  while(dist.length<3){
    var extra = gerarMolecula(nivel);
    if(canonKey(extra)!==canonKey(certo) && !dist.some(function(d){ return canonKey(d.mol)===canonKey(extra); }))
      dist.push({ mol:extra, erro:'Essa estrutura nem sequer poderia se formar a partir do reagente dado.' });
  }
  var ops = shuffle([{ mol:certo, certa:true, txt:iupacName(certo) }].concat(
    dist.slice(0,3).map(function(d){ return { mol:d.mol, certa:false, txt:iupacName(d.mol), erro:d.erro }; })
  ));

  var outros = res.produtos.filter(function(p){ return p!==principais[0]; })
    .map(function(p){ return produtoNome(p) + (p.nota ? ' ('+p.nota+')' : ''); });

  return {
    topico:topico, tipo:'escolha', mol:m, opcoes:ops,
    reacao:r, resultado:res,
    highlight:res.alvo||[],
    enunciado:'Qual é o <b>produto principal</b> da reação abaixo?',
    equacao:{ reagente:r.reagente, condicao:r.condicao },
    explica:'<b>'+esc(res.regra)+'</b><br>'+esc(res.porque).replace(/\n/g,'<br>') +
            (res.mecanismo ? '<br><span class="tiny">Mecanismo: '+esc(res.mecanismo)+'</span>' : '') +
            (outros.length ? '<br><span class="tiny">Também se forma: '+esc(outros.join(' · '))+'</span>' : '') +
            (res.atencao ? '<div class="pega" style="margin-top:8px"><h4>Atenção</h4>'+esc(res.atencao)+'</div>' : ''),
    dicas:[
      'Reação de <b>'+r.grupo.toLowerCase()+'</b>. A regra em jogo é: '+esc(res.regra)+'.',
      res.alvo && res.alvo.length ? 'Olhe os carbonos destacados: é ali que a mudança acontece.' : 'Identifique o grupo funcional que vai reagir.',
      esc(String(res.porque).split('.')[0]) + '.'
    ],
    xp:15
  };
}

// "Qual é o NOME do produto principal?" — alternativas textuais, incluindo
// o mesmo produto com numeração errada, que é o erro mais comum em prova.
function questaoNomeProduto(nivel, tentativa){
  tentativa = tentativa || 0;
  var id = pick(['hidrohalogenacao','hidratacao','hbr_peroxido','desidratacao_intra','desidroalogenacao',
                 'oxidacao_alcool','halogenacao_alcano','benzeno_nitracao','hidratacao_alcino','haleto_hidrolise']);
  var m = gerarParaReacao(id, nivel);
  var res = rodarReacao(id, m, { X:pick(['Cl','Br']) });
  var r = rxById(id);
  if(!res || res.erro) return tentativa<8 ? questaoNomeProduto(nivel, tentativa+1) : questaoProduto('produto_adicao', nivel);
  var pr = res.produtos.filter(function(p){ return p.papel==='principal' && p.mol; })[0];
  if(!pr) return tentativa<8 ? questaoNomeProduto(nivel, tentativa+1) : questaoProduto('produto_adicao', nivel);

  var certo = iupacName(pr.mol);
  var alts = [], vistos = {};
  vistos[normName(certo)] = 1;
  function push(txt, erro){
    if(!txt) return;
    var k = normName(txt);
    if(vistos[k]) return;
    vistos[k] = 1;
    alts.push(opc(txt, false, erro));
  }
  push(nomeNumeracaoErrada(certo), 'A estrutura está certa, mas a NUMERAÇÃO não: a cadeia deve ser numerada pela ponta que dá o menor localizador ao grupo principal.');
  (res.distratores||[]).forEach(function(d){ if(d.mol) push(iupacName(d.mol), d.erro); });
  res.produtos.forEach(function(p){
    if(p.mol && p.papel==='secundário') push(iupacName(p.mol), 'Esse é o produto secundário, não o principal.');
  });
  reacoesAplicaveis(m).forEach(function(o){
    if(o.id===id || alts.length>5) return;
    var x = rodarReacao(o.id, m);
    if(x && !x.erro) x.produtos.forEach(function(p){
      if(p.mol && p.papel==='principal') push(iupacName(p.mol), 'Esse é o produto de outra condição: '+o.nome+'.');
    });
  });
  var guarda = 0;
  while(alts.length<3 && guarda++<20) push(iupacName(gerarMolecula(nivel)), 'Essa estrutura não pode se formar aqui.');
  if(alts.length<3) return tentativa<8 ? questaoNomeProduto(nivel, tentativa+1) : questaoProduto('produto_adicao', nivel);

  var ops = shuffle([opc(certo, true)].concat(shuffle(alts).slice(0,3)));
  return {
    topico:'nome_produto', tipo:'escolha', mol:m, opcoes:ops, reacao:r, resultado:res,
    highlight:res.alvo||[],
    enunciado:'Qual é o <b>nome</b> do produto principal?',
    equacao:{ reagente:r.reagente, condicao:r.condicao },
    explica:'<b>'+esc(res.regra)+'</b><br>'+esc(res.porque).replace(/\n/g,'<br>') +
            '<br>O produto é <b>'+esc(certo)+'</b>. Depois de montar a estrutura, confira a numeração: ela começa pela ponta que dá o MENOR localizador ao grupo principal.',
    dicas:['Primeiro descubra a estrutura do produto; o nome vem depois.',
           'Regra em jogo: '+esc(res.regra)+'.',
           'O nome tem '+M.carbons(pr.mol).length+' carbonos na molécula e começa com "'+esc(certo.slice(0,4))+'…".'],
    xp:16
  };
}

function questaoIsomeros(nivel){
  var m, res;
  for(var t=0;t<40;t++){
    m = gerarMolecula(Math.max(nivel,1), 'alcano');
    if(M.carbons(m).length<3) continue;
    res = rodarReacao('halogenacao_alcano', m, { X:'Cl' });
    if(res && !res.erro && res.isomeros>=1) break;
  }
  if(!res || res.erro){ m = smiles('CC(C)CC'); res = rodarReacao('halogenacao_alcano', m, { X:'Cl' }); }
  var n = res.isomeros;
  var lista = [n];
  [n+1, n-1, n+2, 1].forEach(function(v){ if(lista.length<4 && v>=1 && lista.indexOf(v)<0) lista.push(v); });
  var ops = shuffle(lista).map(function(v){
    return opc(v + ' isômero' + (v>1?'s':''), v===n, 'Recontagem: cada TIPO de hidrogênio diferente gera um produto.');
  });
  return {
    topico:'isomeros', tipo:'escolha', mol:m, opcoes:ops,
    enunciado:'Quantos produtos diferentes de <b>monocloração</b> (Cl₂ + luz) esta molécula pode formar?',
    explica:'São <b>'+n+'</b>. '+res.isomerosTexto+' Dois hidrogênios contam como iguais quando trocá-los não muda a estrutura.',
    dicas:['Marque os hidrogênios equivalentes: os que estão em posições idênticas contam como um só.',
           'Troque o H de cada carbono pelo Cl e veja quantas moléculas DIFERENTES aparecem.',
           'São '+n+' tipos de hidrogênio.'],
    xp:14
  };
}

function questaoDirigencia(nivel){

  };

function questaoInverso(nivel){

                 'haleto_hidrolise','oxidacao_alcool','hidratacao','desidroalogenacao']);

    enunciado:'Os produtos abaixo vieram de <b>'+esc(r.nome)+'</b> ('+esc(r.reagente)+', '+esc(r.condicao)+').<br>Qual era o composto de partida?',

  };
}

    { a:'benzeno_bhc', b:'benzeno_halogenacao', sm:'C1=CC=CC=C1',
      perg:'Para o benzeno sofrer ADIÇÃO de cloro (formando BHC), o que é preciso?',
      certa:'Cl₂ com LUZ e sem catalisador', erradas:[['Cl₂ com AlCl₃, sem luz','Com catalisador ocorre substituição: dá clorobenzeno.'],['Cl₂ com H₂SO₄','Essa condição não é usada para o benzeno.'],['HCl com AlCl₃','Hidrácido não reage com o anel aromático.']],
      exp:'Luz + sem catalisador → adição (BHC). Catalisador + sem luz → substituição (clorobenzeno).' }
  ];
  var p = pick(pares);
  var ops = shuffle([opc(p.certa, true)].concat(p.erradas.map(function(e){ return opc(e[0], false, e[1]); })));
  return {
    topico:'condicao', tipo:'escolha', mol:smiles(p.sm), opcoes:ops,
    enunciado:p.perg,
    explica:p.exp,
    dicas:['A condição (temperatura, solvente, luz, catalisador) muda completamente o produto.',
           'Compare as duas alternativas mais parecidas: o que muda entre elas?',
           p.exp.split('.')[0] + '.'],
    xp:14
  };
}

function questaoSequencia(nivel){
  var rotas = [
    { sm:'CC=CC', passos:[['hidratacao','H₂O / H₂SO₄'],['oxidacao_alcool','K₂Cr₂O₇ / H⁺']],
      exp:'Alceno → álcool (Markovnikov) → cetona (álcool secundário oxida a cetona).' },
    { sm:'CC(C)CC', passos:[['halogenacao_alcano','Cl₂ / luz'],['haleto_hidrolise','NaOH aquoso']],
      exp:'Alcano → haleto (no carbono terciário) → álcool (substituição em meio aquoso).' },
    { sm:'CCC(Br)C', passos:[['desidroalogenacao','KOH alcoólico'],['oxidacao_branda','KMnO₄ diluído a frio']],
      exp:'Haleto → alceno (Saytzeff) → diol vicinal (Baeyer).' },
    { sm:'CCC(O)C', passos:[['desidratacao_intra','H₂SO₄ 170 °C'],['hidrogenacao','H₂ / Ni']],
      exp:'Álcool → alceno (Saytzeff) → alcano (hidrogenação).' },
    { sm:'C1=CC=CC=C1', passos:[['benzeno_nitracao','HNO₃ / H₂SO₄'],['reducao_nitro','H₂ / Ni']],
      exp:'Benzeno → nitrobenzeno → anilina. É a rota industrial clássica dos corantes.' }
  ];
  var r = pick(rotas);
  var m = smiles(r.sm), atual = m, etapas = [];
  for(var i=0;i<r.passos.length;i++){
    var res = rodarReacao(r.passos[i][0], atual);
    if(!res || res.erro) return questaoSequencia(nivel);
    var p = res.produtos.filter(function(x){ return x.mol && x.papel==='principal'; })[0];
    if(!p) return questaoSequencia(nivel);
    etapas.push({ cond:r.passos[i][1], mol:p.mol, res:res });
    atual = p.mol;
  }
  var certo = atual;
  var cands = etapas.slice(0,-1).map(function(e){ return { mol:e.mol, erro:'Esse é o produto INTERMEDIÁRIO, do primeiro passo apenas.' }; });
  cands.push({ mol:m, erro:'Esse é o reagente inicial, não o produto final.' });
  for(var k=0;k<6 && cands.length<7;k++) cands.push({ mol:gerarMolecula(nivel), erro:'Essa estrutura não sai desta sequência.' });
  var dist = distratoresMol(certo, cands, 3);
  var ops = shuffle([{ mol:certo, certa:true, txt:iupacName(certo) }].concat(
    dist.slice(0,3).map(function(d){ return { mol:d.mol, certa:false, txt:iupacName(d.mol), erro:d.erro }; })
  ));
  return {
    topico:'sequencia', tipo:'escolha', mol:m, opcoes:ops, etapas:etapas,
    enunciado:'Qual é o produto <b>final</b> desta sequência?',
    explica:r.exp + '<br>Caminho: ' + [iupacName(m)].concat(etapas.map(function(e){ return iupacName(e.mol); })).join(' → '),
    dicas:['Resolva um passo de cada vez, sem pular etapas.',
           'Primeiro passo: ' + r.passos[0][1] + '. O que ele faz com essa molécula?',
           r.exp],
    xp:18
  };
}

/* ---- despachante ---- */
function gerarQuestao(topico, nivel){
  nivel = nivel || 3;
  switch(topico){
    case 'nome': return questaoNome(nivel);
    case 'funcao': return questaoFuncao(nivel);
    case 'classe': return questaoClasse(nivel);
    case 'nox': return questaoNox(nivel);
    case 'quiral': return questaoQuiral(nivel);
    case 'isomeros': return questaoIsomeros(nivel);
    case 'dirigencia': return questaoDirigencia(nivel);
    case 'teste': return questaoTeste(nivel);
    case 'inverso': return questaoInverso(nivel);
    case 'condicao': return questaoCondicao(nivel);
    case 'sequencia': return questaoSequencia(nivel);
    case 'nome_produto': return questaoNomeProduto(nivel);
    case 'classe_funcao': return questaoClassificarFuncao(nivel);
    case 'pares': return questaoPares(nivel);
    case 'grupo': return questaoGrupo(nivel);
    case 'markovnikov': case 'saytzeff': case 'tautomeria':
    case 'produto_adicao': case 'produto_eliminacao':
    case 'produto_substituicao': case 'produto_oxidacao':
      return questaoProduto(topico, nivel);
    default: return questaoNome(nivel);
  }
}

function gerarQuestaoDeRevisao(){
  var r = proximoRevisao();
  if(!r) return null;
  var q;
  switch(r.topico){
    case 'nome': q = questaoNome(3, r.mol); break;
    case 'funcao': q = questaoFuncao(3, r.mol); break;
    case 'classe': q = questaoClasse(3, r.mol); break;
    case 'nox': q = questaoNox(3, r.mol); break;
    default: q = gerarQuestao(r.topico, 3);
  }
  q.revisao = true;
  return q;
}

function toast(msg, cls){
  var d = document.createElement('div');
  d.className = 'toast' + (cls ? ' ' + cls : '');

  $('toasts').appendChild(d);
  setTimeout(function(){

function modal(titulo, html, botoes){
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="modal"><button class="x" data-fechar>&times;</button><h3>'+titulo+'</h3>'+
                '<div class="mbody">'+html+'</div>'+
                '<div class="btnrow" style="margin-top:14px;justify-content:flex-end">'+
                (botoes||[]).map(function(b,i){ return '<button class="btn '+(b.cls||'')+'" data-b="'+i+'">'+esc(b.txt)+'</button>'; }).join('')+
                '</div></div>';
  document.body.appendChild(m);
  function fechar(){ if(m.parentNode) m.parentNode.removeChild(m); }
  m.addEventListener('click', function(e){
    if(e.target===m || e.target.hasAttribute('data-fechar')) return fechar();
    var b = e.target.closest('[data-b]');
    if(b){
      var acao = (botoes||[])[parseInt(b.getAttribute('data-b'),10)];
      if(acao && acao.fn) acao.fn(fechar);
      else fechar();
    }
  });
  return { fechar:fechar, el:m };
}

var TUT = { passos:[], i:0, aoFim:null };

function spotlight(passos, aoFim){
  TUT.passos = passos; TUT.i = 0; TUT.aoFim = aoFim;
  mostrarPasso();
}
function mostrarPasso(){
  var sp = $('spot'), hole = qs('.hole', sp), bub = qs('.bubble', sp);
  if(TUT.i >= TUT.passos.length){ fecharSpot(); if(TUT.aoFim) TUT.aoFim(); return; }
  var p = TUT.passos[TUT.i];
  sp.classList.add('on');
  var el = p.alvo ? document.querySelector(p.alvo) : null;
  if(el){
    rolarPara(el, { block:'center', behavior:'smooth' });
    setTimeout(function(){ posicionar(el, p, hole, bub); }, 260);
  } else {
    hole.style.width = '0px'; hole.style.height = '0px';
    hole.style.left = '50%'; hole.style.top = '50%';
    posicionarBolha(null, p, bub);
  }
  bub.innerHTML = '<b>'+esc(p.titulo)+'</b>'+p.txt+
    '<div class="tbtns"><button class="btn sm gh" id="tutPular">Pular</button>'+
    '<button class="btn sm pri" id="tutOk">'+(TUT.i===TUT.passos.length-1?'Entendi':'Próximo')+'</button></div>';
  qs('#tutOk', bub).onclick = function(){ TUT.i++; mostrarPasso(); };
  qs('#tutPular', bub).onclick = function(){ fecharSpot(); if(TUT.aoFim) TUT.aoFim(); };
}
function posicionar(el, p, hole, bub){
  var r = el.getBoundingClientRect(), pad = 6;
  hole.style.left = (r.left-pad)+'px';
  hole.style.top = (r.top-pad)+'px';
  hole.style.width = (r.width+pad*2)+'px';
  hole.style.height = (r.height+pad*2)+'px';
  posicionarBolha(r, p, bub);
}
function posicionarBolha(r, p, bub){
  var W = window.innerWidth, H = window.innerHeight;
  var bw = Math.min(320, W-28);
  bub.style.width = bw+'px';
  if(!r){
    bub.style.left = ((W-bw)/2)+'px';
    bub.style.top = (H/2-60)+'px';
    return;
  }
  var abaixo = r.bottom + 14;
  var cabe = abaixo + 150 < H;
  bub.style.top = (cabe ? abaixo : Math.max(10, r.top - 170)) + 'px';
  bub.style.left = Math.max(12, Math.min(W-bw-12, r.left + r.width/2 - bw/2)) + 'px';
}

function telaTrilha(){
  var html = '<div class="card"><h2 style="margin-bottom:2px">Trilha de reações orgânicas</h2>' +
    '<p class="sub">Do zero ao nível de prova difícil. Cada nível abre o próximo.</p>';

  TRILHA.forEach(function(t){
    var st = trilhaDe(t.id);

    totalM += t.metaPratica + t.metaDesafio;
  });
  html += '<div class="prog" style="margin-top:10px"><i style="width:'+Math.round(totalP/totalM*100)+'%"></i></div>' +
          '<div class="tiny" style="margin-top:5px">'+Math.round(totalP/totalM*100)+'% da trilha concluída</div></div>';

          '<span class="stars">'+('★★★'.slice(0,st.estrelas) + '☆☆☆'.slice(0,3-st.estrelas))+'</span>' +
        '</div>' +
        '<div class="sub" style="margin-top:3px">'+esc(t.desc)+'</div>' +
        (lib ? '<div class="prog"><i style="width:'+pct+'%"></i></div>' +
               '<div class="tiny" style="margin-top:4px">prática '+Math.min(st.pratica,t.metaPratica)+'/'+t.metaPratica+
               (st.melhorDesafio ? ' · melhor desafio '+st.melhorDesafio+'%' : '')+'</div>'

function desenharCB(){
  var m = CB.mol;
  var wrap = $('svgWrap');
  if(!wrap) return;
  qsa('[data-vista]').forEach(function(b){
    b.className = b.getAttribute('data-vista')===CB.vista ? 'on' : '';
  });
  var bn = qs('[data-num]'); if(bn) bn.className = CB.numerar ? 'on' : '';

  var nums = null;
  if(CB.numerar){
    // usa a numeração da IUPAC quando existe, para bater com o nome mostrado
    nums = numeracaoIUPAC(m);
    if(!nums){
      nums = {};
      M.carbons(m).forEach(function(c,i){ nums[c] = (i+1); });
    }
  }

  if(CB.vista==='estrutural'){
    wrap.innerHTML = '<div class="molbox clickable">' +
      molSVG(m, { click:true, highlight:CB.sel>=0?[CB.sel]:[], highlight2:CB.ligando>=0?[CB.ligando]:[],
                  numbers:nums, maxH:300 }) + '</div>';
    qsa('.atomhit', wrap).forEach(function(el){
      el.onclick = function(){ clicarAtomo(parseInt(el.getAttribute('data-atom'),10)); };
    });
  } else if(CB.vista==='condensada'){
    wrap.innerHTML = '<div class="molbox" style="padding:26px 14px;text-align:center;font-size:20px">' +
      condensed(m) + '</div>';
  } else {
    wrap.innerHTML = '<div class="molbox" style="padding:30px 14px;text-align:center">' +
      '<div style="font-size:30px;font-weight:650">' + formula(m) + '</div>' +
      '<div class="tiny" style="margin-top:6px">massa molar ≈ ' + massaMolar(m) + ' g/mol</div></div>';
  }

  var d = $('dicaSel');
  if(d){
    if(CB.ligando>=0) d.innerHTML = '<span class="chip wa">Toque no segundo átomo para criar a ligação</span>';
    else if(CB.sel>=0){
      var livre = M.free(m, CB.sel);
      d.innerHTML = 'Selecionado: <b>' + m.atoms[CB.sel].el + (CB.sel>=0 ? ' (átomo ' + (CB.sel+1) + ')' : '') + '</b> · ' +
        M.h(m,CB.sel) + ' H · <b>' + livre + '</b> ligação(ões) livre(s)' +
        (m.atoms[CB.sel].el==='C' ? ' · ' + carbonClassName(carbonClass(m,CB.sel)) + ' · Nox ' + noxStr(noxCarbon(m,CB.sel)) : '');
    }
    else d.innerHTML = 'Toque em um átomo do desenho para selecioná-lo.';
  }
  painelCB();
}

function clicarAtomo(i){
  if(CB.ligando>=0 && CB.ligando!==i){
    var a = CB.ligando, b = i;
    CB.ligando = -1;
    if(M.bond(CB.mol,a,b)) { toast('Esses átomos já estão ligados. Use os botões de ligação simples/dupla/tripla.'); return desenharCB(); }
    if(M.free(CB.mol,a)<1 || M.free(CB.mol,b)<1){
      toast('Não dá: um dos átomos já usou toda a valência.');
      return desenharCB();
    }
    M.addBond(CB.mol, a, b, 1);
    CB.sel = b;
    return desenharCB();
  }
  CB.ligando = -1;
  CB.sel = i;
  desenharCB();
}

function precisaSelecao(){
  if(CB.sel<0){ toast('Escolha antes um átomo no desenho.'); return false; }
  return true;
}

function explicarValencia(el, precisa){
  var v = VAL[el]||4;
  return 'O ' + el + ' faz no máximo ' + v + ' ligação(ões) e este já está completo. ' +
         'Para caber mais ' + precisa + ', tire um grupo ou escolha outro átomo.';
}

function addCarbono(ordem){
  if(!precisaSelecao()) return;
  var m = CB.mol, s = CB.sel;
  if(M.free(m,s) < ordem){
    toast(explicarValencia(m.atoms[s].el, ordem + ' ligação(ões)'));
    return;
  }
  var novo = M.addAtom(m,'C');
  M.addBond(m, s, novo, ordem);
  CB.sel = novo;
  desenharCB();
  if(!contarSemIncrementar('construiu')) { contar('construiu'); ganharConquista('primeiro'); }
}

function novoCiclo(n, aromatico){
  var m = M.make();
  for(var i=0;i<n;i++) M.addAtom(m,'C');
  for(var k=0;k<n;k++) M.addBond(m, k, (k+1)%n, 1);
  if(aromatico){ M.bond(m,0,1).o = 2; M.bond(m,2,3).o = 2; M.bond(m,4,5).o = 2; }
  CB.mol = m; CB.sel = 0; CB.ligando = -1;
  desenharCB();
}

function mudarOrdem(ord){
  if(!precisaSelecao()) return;
  var m = CB.mol, s = CB.sel;
  var viz = M.nbrs(m, s);
  if(!viz.length) return toast('Este átomo não tem ligação para alterar.');
  var alvos = viz.filter(function(x){
    var delta = ord - x.o;
    return delta<=0 || (M.free(m,s)>=delta && M.free(m,x.j)>=delta);
  });
  if(!alvos.length) return toast('Não há valência livre para aumentar essa ligação. Tire um H ocupando, ou escolha outro par.');
  function aplicar(j){
    M.bond(m, s, j).o = ord;
    desenharCB();
  }
  if(alvos.length===1) return aplicar(alvos[0].j);
  var html = '<p class="sub">Com qual vizinho?</p>' + alvos.map(function(x){
    return '<button class="opt" data-j="'+x.j+'">átomo '+(x.j+1)+' — '+m.atoms[x.j].el+' (ligação atual: '+x.o+')</button>';
  }).join('');
  var mm = modal('Alterar ligação', html, [{ txt:'Cancelar' }]);
  qsa('[data-j]', mm.el).forEach(function(b){
    b.onclick = function(){ aplicar(parseInt(b.getAttribute('data-j'),10)); mm.fechar(); };
  });
}

function addGrupo(g){
  if(!precisaSelecao()) return;
  var m = CB.mol, s = CB.sel, el = m.atoms[s].el;
  var custo = (g==='=O') ? 2 : 1;
  if(M.free(m,s) < custo){
    toast(explicarValencia(el, g==='=O' ? 'uma dupla com oxigênio' : 'este grupo'));
    return;
  }
  if(el!=='C' && ['COOH','CN','fenil','OMe'].indexOf(g)>=0){
    toast('Este grupo deve ser ligado a um carbono.');
    return;
  }
  switch(g){
    case 'OH': attach(m, s, 'OH'); break;
    case '=O': attach(m, s, '=O'); break;
    case 'COOH': attach(m, s, 'COOH'); break;
    case 'NH2': attach(m, s, 'NH2'); break;
    case 'CN': attach(m, s, 'CN'); break;
    case 'NO2': attach(m, s, 'NO2'); break;
    case 'SO3H': attach(m, s, 'SO3H'); break;
    case 'OMe': var o = attach(m, s, 'O'); attach(m, o, 'CH3'); break;
    case 'fenil':
      var base = m.atoms.length;
      for(var i=0;i<6;i++) M.addAtom(m,'C');
      for(var k=0;k<6;k++) M.addBond(m, base+k, base+(k+1)%6, 1);
      M.bond(m, base+0, base+1).o = 2;
      M.bond(m, base+2, base+3).o = 2;
      M.bond(m, base+4, base+5).o = 2;
      M.addBond(m, s, base, 1);
      break;
    default: attach(m, s, g);
  }
  desenharCB();
}

function acaoCB(a){
  if(a==='remover'){
    if(!precisaSelecao()) return;
    if(CB.mol.atoms.length<=1) return toast('Precisa sobrar pelo menos um átomo.');
    var teste = M.clone(CB.mol);
    M.delAtom(teste, CB.sel);
    if(!M.connected(teste)) return toast('Removendo esse átomo a molécula ficaria partida em dois pedaços.');
    CB.mol = teste; CB.sel = 0; CB.ligando = -1;
    desenharCB();
  }
  else if(a==='limpar'){ CB.mol = smiles('C'); CB.sel = 0; desenharCB(); }
  else if(a==='aleatoria'){ CB.mol = gerarMolecula(ultimoNivelLiberado()+1); CB.sel = 0; desenharCB(); }
  else if(a==='exemplos'){
    var exs = [
      ['CC(C)CC','2-metilbutano'], ['CC=CC','but-2-eno'], ['CC#C','propino'],
      ['CC(O)C','propan-2-ol'], ['CCC=O','propanal'], ['CC(=O)CC','butanona'],
      ['CC(=O)O','ácido etanoico'], ['CC(=O)OCC','etanoato de etila'],
      ['CCOCC','etoxietano'], ['CCN','etanamina'], ['CC#N','etanonitrila'],
      ['C1=CC=CC=C1','benzeno'], ['CC1=CC=CC=C1','tolueno'], ['OC1=CC=CC=C1','fenol'],
      ['{NO2}C1=CC=CC=C1','nitrobenzeno'], ['C1CCCCC1','ciclo-hexano'], ['C1CC1','ciclopropano'],
      ['C=CC=C','buta-1,3-dieno'], ['CCC(Br)C','2-bromobutano'], ['OCC(O)CO','glicerol']
    ];
    var html = '<div class="grid g2">' + exs.map(function(e,i){
      return '<button class="opt" data-ex="'+i+'" style="margin:0">'+esc(e[1])+'</button>';
    }).join('') + '</div>';
    var mm = modal('Exemplos', html, [{ txt:'Fechar' }]);
    qsa('[data-ex]', mm.el).forEach(function(b){
      b.onclick = function(){
        CB.mol = smiles(exs[parseInt(b.getAttribute('data-ex'),10)][0]);
        CB.sel = 0; mm.fechar(); desenharCB();
      };
    });
  }
}

// Confere a molécula montada contra o gabarito, pela chave canônica
function conferirDesafio(){
  var d = CB.desafio;
  if(!d) return;
  var meu = CB.mol, certo = d.mol;
  var fb = $('fbDesafio');
  if(sameMol(meu, certo)){
    fb.innerHTML = '<div class="fb ok"><b>É exatamente esse · +20 XP</b>' +
      '<div class="why">'+esc(d.regra)+' — '+esc(d.porque).replace(/\n/g,'<br>')+'</div></div>' +
      '<div class="btnrow" style="margin-top:8px"><button class="btn pri" id="proxDes">Outra reação</button></div>';
    darXP(20, 'produto montado');
    registrarTopico('produto_montado', true);
    $('proxDes').onclick = function(){
      var b = d; CB.desafio = null;
      irPara('laboratorio', { mol:gerarMolecula(ultimoNivelLiberado()+1) });
    };
    CB.desafio = null;
    return;
  }
  // pistas progressivas, sem entregar o gabarito de graça
  var pistas = [];
  var fMeu = formulaPlain(meu), fCerto = formulaPlain(certo);
  if(fMeu !== fCerto) pistas.push('A fórmula molecular ainda não bate: a sua é <b>'+fMeu+'</b> e a do produto é <b>'+fCerto+'</b>.');
  else pistas.push('A fórmula molecular já está certa (<b>'+fCerto+'</b>) — o que está diferente é a POSIÇÃO dos grupos.');
  var gMeu = mainGroup(meu), gCerto = mainGroup(certo);
  if(gMeu && gCerto && gMeu.tipo!==gCerto.tipo) pistas.push('A função também está diferente: você montou um(a) <b>'+gMeu.rotulo+'</b> e o produto é um(a) <b>'+gCerto.rotulo+'</b>.');
  pistas.push('Regra que vale aqui: <b>'+esc(d.regra)+'</b>');
  fb.innerHTML = '<div class="fb no"><b>Ainda não é esse</b>' +
    '<div class="why">'+pistas.join('<br>')+'</div></div>';
}

/* ---- painel de informações em tempo real ---- */
function painelCB(){
  var m = CB.mol, p = $('painelInfo');
  if(!p) return;
  var nome, erroNome = null;
  try { nome = iupacName(m); } catch(e){ nome = '—'; erroNome = e.message; }
  var quir = chiralCarbons(m);
  var funcs = functionLabels(m);

  var html = '<div class="card">' +
    '<div class="molname">'+esc(nome)+'</div>' +
    '<div class="molform">'+formula(m)+' · '+condensed(m)+'</div>' +
    '<div class="chips" style="margin-top:8px">' +
      funcs.map(function(f){ return '<span class="chip ac">'+esc(f)+'</span>'; }).join('') +
      (quir.length ? '<span class="chip ro">'+quir.length+' carbono quiral'+(quir.length>1?'s':'')+'</span>' : '') +
      (M.carbons(m).length ? '<span class="chip">'+M.carbons(m).length+' carbonos</span>' : '') +
    '</div>' +
    (quir.length ? '<div class="tiny" style="margin-top:8px">Com carbono quiral, uma reação que o crie a partir de estrutura plana dá <b>mistura racêmica</b>.</div>' : '') +
    '</div>';

  html += '<div class="card"><div class="viewtabs">' +
    '<button data-aba="ident"'+(CB.aba==='ident'?' class="on"':'')+'>Carbonos</button>' +
    '<button data-aba="rx"'+(CB.aba==='rx'?' class="on"':'')+'>Pode sofrer</button>' +
    '<button data-aba="teste"'+(CB.aba==='teste'?' class="on"':'')+'>Testes</button>' +
    '</div><div id="abaConteudo"></div></div>';

  p.innerHTML = html;
  qsa('[data-aba]', p).forEach(function(b){
    b.onclick = function(){ CB.aba = b.getAttribute('data-aba'); painelCB(); };
  });
  var alvo = $('abaConteudo');

  if(CB.aba==='ident'){
    var cs = M.carbons(m);
    if(!cs.length){ alvo.innerHTML = '<p class="sub">Sem carbonos.</p>'; return; }
    var numIU = numeracaoIUPAC(m);
    // ordena pela numeração IUPAC; os carbonos de ramificação vão para o fim
    var ordem = cs.slice();
    if(numIU) ordem.sort(function(a,b){
      var na = numIU[a] || 99, nb = numIU[b] || 99;
      return na - nb;
    });
    alvo.innerHTML = '<div class="tscroll"><table class="t">' +
      '<tr><th>C</th><th>Classificação</th><th>H</th><th>Nox</th><th>Quiral</th></tr>' +
      ordem.map(function(c,i){
        var rot = numIU ? (numIU[c] ? 'C'+numIU[c] : 'ramo') : 'C'+(i+1);
        return '<tr data-c="'+c+'" style="cursor:pointer'+(c===CB.sel?';background:rgba(94,234,212,.07)':'')+'">' +
          '<td><b>'+rot+'</b></td>' +
          '<td>'+carbonClassName(carbonClass(m,c))+'</td>' +
          '<td>'+M.h(m,c)+'</td>' +
          '<td><b>'+noxStr(noxCarbon(m,c))+'</b></td>' +
          '<td>'+(isChiralCarbon(m,c)?'<span class="chip ro">sim</span>':'—')+'</td></tr>';
      }).join('') + '</table></div>' +
      '<div class="tiny" style="margin-top:8px">' +
      (numIU ? 'Os números seguem a numeração IUPAC da cadeia principal — os mesmos que aparecem no nome. ' : '') +
      'Nox: cada H vale −1, cada C vale 0 e cada ligação com O, N ou halogênio vale +1 (C=O vale +2).</div>';
    qsa('[data-c]', alvo).forEach(function(tr){
      tr.onclick = function(){ CB.sel = parseInt(tr.getAttribute('data-c'),10); desenharCB(); };
    });
  }
  else if(CB.aba==='rx'){
    var rs = reacoesAplicaveis(m);
    if(!rs.length){ alvo.innerHTML = '<p class="sub">Nenhuma reação do programa se aplica a esta estrutura.</p>'; return; }
    var porGrupo = {};
    rs.forEach(function(r){ (porGrupo[r.grupo] = porGrupo[r.grupo]||[]).push(r); });
    alvo.innerHTML = Object.keys(porGrupo).map(function(g){
      return '<h4 style="margin-top:10px">'+esc(g)+'</h4>' + porGrupo[g].map(function(r){
        return '<div class="rulehit" style="padding:8px 0">' +
          '<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">' +
          '<div style="flex:1;min-width:150px"><b>'+esc(r.nome)+'</b>' +
          '<div class="tiny">'+esc(r.reagente)+' · '+esc(r.condicao)+'</div></div>' +
          '<button class="btn sm" data-rx="'+r.id+'">Ver produto</button></div></div>';
      }).join('');
    }).join('');
    qsa('[data-rx]', alvo).forEach(function(b){
      b.onclick = function(){ irPara('laboratorio', { mol:M.clone(m), rx:b.getAttribute('data-rx') }); };
    });
  }
  else {
    alvo.innerHTML = '<div class="tscroll"><table class="t"><tr><th>Teste</th><th>Resultado</th></tr>' +
      TESTES.map(function(t){
        var r = t.ver(m);
        return '<tr><td>'+esc(t.nome)+'</td><td><span class="chip '+(r.pos?'ok':'no')+'">'+
               (r.pos?'positivo':'negativo')+'</span> <span class="tiny">'+esc(r.obs)+'</span></td></tr>';
      }).join('') + '</table></div>';
  }
}

var FUN = { aba:'reconhecer', acertos:0, total:0, alvo:null };

var FUN_ABAS = [

function telaFuncoes(args){
  if(args && args.aba) FUN.aba = args.aba;
  var pct = FUN.total ? Math.round(FUN.acertos/FUN.total*100) : 0;

  var html = '<div class="card">' +
    '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">' +

      FUN_ABAS.map(function(a){

    '<div class="tiny" id="funDesc"></div>' +
    '</div><div id="funArea"></div>';

  render(html);
