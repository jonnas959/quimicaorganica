<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório de Reações</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b23; --panel2:#1b212c; --panel3:#222a37;
  --line:#2a3340; --line2:#3a4656;
  --tx:#e7ebf2; --mut:#93a0b4; --mut2:#6c7a8e;
  --ac:#5eead4; --ac2:#7dd3fc; --ok:#4ade80; --no:#fb7185; --wa:#fbbf24; --ro:#c084fc;
  --r:10px; --r2:6px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;   /* controles nativos e barra de rolagem acompanham o tema */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac2)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:650}
h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0 0 .7em}
code,.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace}
sub{font-size:.72em}

/* ---------- topo ---------- */
header{
  position:sticky; top:0; z-index:60; background:rgba(14,17,22,.93);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand .flask{width:22px;height:22px;flex:0 0 auto}
.brand small{display:block;font-weight:400;font-size:10.5px;color:var(--mut2);letter-spacing:.3px}
.hdr-sp{flex:1}
.xpbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.lvlchip{background:var(--panel2);border:1px solid var(--line2);padding:3px 8px;border-radius:999px;font-weight:650;color:var(--ac);font-size:12px}
.xpbar{width:90px;height:6px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:var(--r2);padding:6px 9px;color:var(--mut);line-height:1}
.iconbtn:hover{border-color:var(--line2);color:var(--tx)}

nav{border-bottom:1px solid var(--line);background:var(--bg)}
.navin{display:flex;gap:2px;max-width:1240px;margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  padding:10px 11px;white-space:nowrap;font-size:13.5px;font-weight:550;
}
.navin button:hover{color:var(--tx)}
.navin button.on{color:var(--ac);border-bottom-color:var(--ac)}
.navin button .nlock{opacity:.45;font-size:11px}

main{max-width:1240px;margin:0 auto;padding:16px 12px 90px}

/* ---------- blocos ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:12px}
.card h3{margin-bottom:8px}
.sub{color:var(--mut);font-size:13px}
.tiny{font-size:12px;color:var(--mut2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.split3{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:860px){.split,.split3,.g2,.g3{grid-template-columns:1fr}}

.btn{
  background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
  padding:9px 14px;border-radius:var(--r2);font-weight:550;font-size:14px;
  min-height:40px;
}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06221d;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gh{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.chip.no{color:var(--no);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.chip.wa{color:var(--wa);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.chip.ac{color:var(--ac);border-color:rgba(94,234,212,.35);background:rgba(94,234,212,.08)}
.chip.ro{color:var(--ro);border-color:rgba(192,132,252,.35);background:rgba(192,132,252,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

input[type=text],input[type=number],select,textarea{
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r2);
  padding:10px 12px;width:100%;min-height:42px;outline:none;
}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(94,234,212,.12)}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}

/* ---------- molécula / svg ---------- */
.molbox{background:#0b0e13;border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.molbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.molbox .molcap{position:absolute;left:8px;top:6px;font-size:11.5px;color:var(--mut2);letter-spacing:.2px}
.molbox.clickable .atomhit{cursor:pointer}
.molname{font-size:17px;font-weight:650;letter-spacing:-.2px}
.molform{font-size:14px;color:var(--mut)}
.viewtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.viewtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:4px 10px;border-radius:999px;font-size:12px}
.viewtabs button.on{background:var(--panel3);color:var(--tx);border-color:var(--line2)}

.rxnline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rxnline .arrow{position:relative;min-width:110px;text-align:center;color:var(--mut);font-size:11.5px;padding:0 4px}
.rxnline .arrow b{display:block;color:var(--ac2);font-weight:600}
.rxnline .arrow:after{content:"";display:block;height:1px;background:var(--line2);margin:3px 0 2px;position:relative}
.rxnline .item{flex:1 1 200px;min-width:170px}

/* ---------- tabela ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
table.t th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- feedback ---------- */
.fb{border-radius:var(--r);padding:12px 14px;border:1px solid;margin-top:12px;font-size:14px}
.fb.ok{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.07)}
.fb.no{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.07)}
.fb.tip{border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.07)}
.fb b{display:block;margin-bottom:4px}
.fb .why{color:var(--mut);font-size:13.5px}

.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--r);padding:11px 13px;margin-bottom:8px;font-size:14px}
.opt:hover{border-color:var(--ac);background:var(--panel3)}
.opt.sel{border-color:var(--ac2)}
.opt.right{border-color:var(--ok);background:rgba(74,222,128,.09)}
.opt.wrong{border-color:var(--no);background:rgba(251,113,133,.09)}
.opt .oi{color:var(--mut2);font-weight:700;margin-right:8px}

/* ---------- trilha ---------- */
.trail{display:grid;gap:10px}
.node{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;position:relative}
.node.lock{opacity:.5}
.node.done{border-color:rgba(74,222,128,.3)}
.node .dot{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);
  display:grid;place-items:center;font-weight:700;color:var(--mut)}
.node.done .dot{background:rgba(74,222,128,.14);border-color:var(--ok);color:var(--ok)}
.node.cur .dot{border-color:var(--ac);color:var(--ac)}
.stars{color:var(--wa);letter-spacing:2px;font-size:13px}
.prog{height:5px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--ac)}

/* ---------- teoria ---------- */
.theory{border-left:3px solid var(--ac2);padding-left:12px;margin:10px 0}
.theory h4{color:var(--ac2)}
.pega{border-left:3px solid var(--wa);padding-left:12px;margin:10px 0}
.pega h4{color:var(--wa)}
.ex{background:var(--panel2);border-radius:var(--r2);padding:8px 10px;font-size:13.5px;margin:6px 0}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(6,8,11,.72);z-index:100;display:grid;place-items:center;padding:14px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:640px;width:100%;
  max-height:88vh;overflow:auto;padding:18px;box-shadow:var(--sh)}
.modal h3{margin-bottom:10px}
.modal .x{float:right;background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:0 4px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;
  width:calc(100% - 28px);max-width:420px;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 13px;font-size:13.5px;
  box-shadow:var(--sh);animation:tin .25s ease}
.toast.gold{border-color:var(--wa);background:rgba(251,191,36,.12)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- tutorial spotlight ---------- */
#spot{position:fixed;inset:0;z-index:90;pointer-events:none;display:none}
#spot.on{display:block}
#spot .hole{position:absolute;border:2px solid var(--ac);border-radius:10px;
  box-shadow:0 0 0 9999px rgba(6,8,11,.74);transition:all .2s ease}
#spot .bubble{position:absolute;max-width:320px;background:var(--panel);border:1px solid var(--ac);
  border-radius:var(--r);padding:12px 14px;font-size:13.5px;pointer-events:auto;box-shadow:var(--sh)}
#spot .bubble b{color:var(--ac);display:block;margin-bottom:3px}
#spot .bubble .tbtns{margin-top:10px;display:flex;gap:8px;justify-content:flex-end}

/* ---------- autoteste ---------- */
#selftest{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.96);display:none;overflow:auto;padding:16px}
#selftest.on{display:block}
#selftest .wrap{max-width:960px;margin:0 auto}
.tline{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:3px 6px;border-bottom:1px solid #1b212c;word-break:break-word}
.tline.pass{color:var(--ok)}
.tline.fail{color:var(--no);background:rgba(251,113,133,.07)}
.tline .exp{color:var(--mut)}

/* ---------- misc ---------- */
.kbd{background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11.5px}
.flaskwrap{display:flex;gap:10px;flex-wrap:wrap}
.flask-card{flex:1 1 150px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.tube{width:34px;height:74px;margin:0 auto 6px;border:2px solid var(--line2);border-top:0;border-radius:0 0 16px 16px;position:relative;overflow:hidden;background:#0b0e13}
.tube i{position:absolute;left:0;right:0;bottom:0;height:56%;transition:background .4s}
.tube .fizz{position:absolute;left:50%;bottom:8%;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.65);animation:fz 1.1s infinite}
@keyframes fz{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-38px);opacity:0}}
.flame{width:28px;height:44px;margin:0 auto;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 75%,#fff6c2,#ffbe3d 45%,#ff7a18 75%);filter:blur(.4px)}
.flame.soot{background:radial-gradient(ellipse at 50% 75%,#ffd280,#d97706 40%,#4b3b2a 78%)}
.sep{height:1px;background:var(--line);margin:12px 0}
.badge{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--r);padding:8px 10px;font-size:12.5px}
.badge.got{border-color:var(--wa);background:rgba(251,191,36,.08)}
.badge.got .bt{color:var(--wa)}
.badge .bt{font-weight:650;display:block}
.hl{background:rgba(94,234,212,.16);border-radius:3px;padding:0 3px}
.noselect{-webkit-user-select:none;user-select:none}
.center{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:650}
.timer.low{color:var(--no)}
ul.tight{margin:.2em 0 .7em;padding-left:20px}
ul.tight li{margin-bottom:3px}
.searchwrap{position:relative}
.searchwrap input{padding-left:32px}
.rulehit{border-bottom:1px solid var(--line);padding:10px 0}
.rulehit:last-child{border-bottom:0}
.rulehit h4{margin-bottom:3px}
.rulehit .cat{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}
@media (max-width:520px){
  .hdr{padding:7px 10px} .brand small{display:none}
  main{padding:12px 10px 80px}
  .card{padding:12px}
  h2{font-size:18px}
  .xpbar{width:60px}
}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="brand">
      <svg class="flask" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6M10 3v6.2L4.6 18.4A2 2 0 0 0 6.3 21.5h11.4a2 2 0 0 0 1.7-3.1L14 9.2V3"/>
        <path d="M7.2 15h9.6"/>
      </svg>
      <div>Laboratório de Reações<small>Química Orgânica — 3º ano</small></div>
    </div>
    <div class="hdr-sp"></div>
    <div class="xpbox">
      <span class="lvlchip" id="hdLvl">Nv 1</span>
      <div class="xpbar" title="XP"><i id="hdXp" style="width:0%"></i></div>
      <span id="hdXpTx" class="tiny">0 XP</span>
    </div>
    <button class="iconbtn" id="btnRev" title="Fila de revisão">&#8635; <span id="revN">0</span></button>
    <button class="iconbtn" id="btnCfg" title="Progresso, exportar e importar">&#9881;</button>
  </div>
  <nav><div class="navin" id="nav"></div></nav>
</header>
<main id="view"></main>
<div id="toasts"></div>
<div id="spot"><div class="hole"></div><div class="bubble"></div></div>
<div id="selftest"><div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
    <h2 style="margin:0">Autoteste</h2><span class="tiny">Ctrl+Shift+T fecha</span>
    <span style="flex:1"></span>
    <button class="btn sm" id="stRun">Rodar de novo</button>
    <button class="btn sm gh" id="stOnlyFail">Só falhas</button>
    <button class="btn sm gh" id="stClose">Fechar</button>
  </div>
  <div id="stSummary" class="card" style="margin-bottom:10px"></div>
  <div id="stOut" class="card" style="padding:4px 6px"></div>
</div></div>
<script>
"use strict";
/* ============================================================================
   LABORATÓRIO DE REAÇÕES
   Jogo de Química Orgânica — 3º ano do ensino médio (BR)
   Arquivo único, sem build, sem backend. Tudo roda offline.

   Organização (ordem neste arquivo):
     1. MODELO      — grafo de átomos/ligações, mini-SMILES, propriedades
     2. NOMEADOR    — IUPAC (acíclico, cíclico, aromático) + leitura de respostas
     3. DESENHO     — layout 2D e SVG (estrutural / condensada / molecular)
     4. REAÇÕES     — regras declarativas de transformação do grafo
     5. TESTES      — reagentes de identificação (Tollens, Baeyer, ...)
     6. GERADOR     — moléculas aleatórias por nível
     7. CONTEÚDO    — teoria, livro de regras, trilha, conquistas
     8. ESTADO      — XP, progresso, revisão espaçada, localStorage
     9. UI          — telas dos 6 modos, tutoriais, dicas
    10. AUTOTESTE   — Ctrl+Shift+T

   DECISÕES DE SIMPLIFICAÇÃO (ensino médio brasileiro):
   - Hidrogênios são implícitos (contados pela valência), como em fórmula de traços.
   - Grupos -NO2 e -SO3H são um único nó do grafo (pseudo-átomo de valência 1).
     Evita cargas formais, que não são cobradas no EM, e simplifica nitração/sulfonação.
   - Benzeno é desenhado em Kekulé (duplas alternadas), que é o que cai em prova.
   - Quiralidade é verificada apenas em carbonos de cadeia aberta.
   - Estereoquímica cis/trans não entra no nome (fora do escopo pedido).
   ========================================================================== */

/* ============================================================================
   1. MODELO DE MOLÉCULA
   ========================================================================== */

var VAL = { C:4, N:3, O:2, S:2, F:1, Cl:1, Br:1, I:1, NO2:1, SO3H:1, H:1 };
var HALO = { F:1, Cl:1, Br:1, I:1 };
// Átomos mais eletronegativos que o carbono: puxam o Nox para cima (+1 por ligação)
var ELETRONEG = { O:1, N:1, F:1, Cl:1, Br:1, I:1, S:0, NO2:1, SO3H:1 };
var MASSA = { C:12, H:1, O:16, N:14, S:32, F:19, Cl:35.5, Br:80, I:127 };

var M = {
  make: function(){ return { atoms:[], bonds:[] }; },

  clone: function(m){
    return {
      atoms: m.atoms.map(function(a){ return { el:a.el }; }),
      bonds: m.bonds.map(function(b){ return { a:b.a, b:b.b, o:b.o }; })
    };
  },

  addAtom: function(m, el){ m.atoms.push({ el:el }); return m.atoms.length-1; },

  addBond: function(m, a, b, o){
    if(a===b || a<0 || b<0) return null;
    var ex = M.bond(m,a,b);
    if(ex){ ex.o = o||1; return ex; }
    var nb = { a:a, b:b, o:o||1 };
    m.bonds.push(nb); return nb;
  },

  bond: function(m, a, b){
    for(var i=0;i<m.bonds.length;i++){
      var x = m.bonds[i];
      if((x.a===a&&x.b===b)||(x.a===b&&x.b===a)) return x;
    }
    return null;
  },

  delBond: function(m, a, b){
    for(var i=0;i<m.bonds.length;i++){
      var x = m.bonds[i];
      if((x.a===a&&x.b===b)||(x.a===b&&x.b===a)){ m.bonds.splice(i,1); return true; }
    }
    return false;
  },

  // Remove o átomo e reindexa tudo que vinha depois dele.
  delAtom: function(m, i){
    m.bonds = m.bonds.filter(function(b){ return b.a!==i && b.b!==i; });
    m.bonds.forEach(function(b){ if(b.a>i) b.a--; if(b.b>i) b.b--; });
    m.atoms.splice(i,1);
  },

  nbrs: function(m, i){
    var out = [];
    for(var k=0;k<m.bonds.length;k++){
      var b = m.bonds[k];
      if(b.a===i) out.push({ j:b.b, o:b.o });
      else if(b.b===i) out.push({ j:b.a, o:b.o });
    }
    return out;
  },

  nbrIdx: function(m, i){ return M.nbrs(m,i).map(function(x){ return x.j; }); },

  // Vizinhos que são carbono
  cNbrs: function(m, i){
    return M.nbrs(m,i).filter(function(x){ return m.atoms[x.j].el==='C'; });
  },

  // Soma das ordens de ligação (valência ocupada)
  used: function(m, i){
    var s = 0, n = M.nbrs(m,i);
    for(var k=0;k<n.length;k++) s += n[k].o;
    return s;
  },

  // Hidrogênios implícitos
  h: function(m, i){
    var v = VAL[m.atoms[i].el]||0;
    return Math.max(0, v - M.used(m,i));
  },

  free: function(m, i){ return (VAL[m.atoms[i].el]||0) - M.used(m,i); },

  carbons: function(m){
    var out = [];
    for(var i=0;i<m.atoms.length;i++) if(m.atoms[i].el==='C') out.push(i);
    return out;
  },

  connected: function(m){
    if(!m.atoms.length) return true;
    var seen = {}, st = [0]; seen[0]=1;
    while(st.length){
      var i = st.pop();
      M.nbrIdx(m,i).forEach(function(j){ if(!seen[j]){ seen[j]=1; st.push(j); } });
    }
    return Object.keys(seen).length === m.atoms.length;
  },

  // Componentes conexos como moléculas separadas (usado nas quebras de cadeia)
  split: function(m){
    var seen = {}, out = [];
    for(var s=0;s<m.atoms.length;s++){
      if(seen[s]) continue;
      var grp = [], st = [s]; seen[s]=1;
      while(st.length){
        var i = st.pop(); grp.push(i);
        M.nbrIdx(m,i).forEach(function(j){ if(!seen[j]){ seen[j]=1; st.push(j); } });
      }
      grp.sort(function(a,b){ return a-b; });
      var map = {}, nm = M.make();
      grp.forEach(function(g,k){ map[g]=k; M.addAtom(nm, m.atoms[g].el); });
      m.bonds.forEach(function(b){
        if(map[b.a]!==undefined && map[b.b]!==undefined) M.addBond(nm, map[b.a], map[b.b], b.o);
      });
      out.push(nm);
    }
    return out;
  },

  valid: function(m){
    for(var i=0;i<m.atoms.length;i++){
      if(M.used(m,i) > (VAL[m.atoms[i].el]||0)) return false;
    }
    return M.connected(m);
  }
};

/* ---- mini-SMILES -----------------------------------------------------------
   Aceita: C N O S F Cl Br I, {NO2} {SO3H}, ligações - = #, ramos ( ),
   fechamento de anel por dígito. Só para montar moléculas no código;
   o jogador nunca digita SMILES.                                             */
function smiles(str){
  var m = M.make(), prev = -1, order = 1, stack = [], rings = {}, i = 0;
  while(i < str.length){
    var c = str[i];
    if(c===' '){ i++; continue; }
    if(c==='('){ stack.push(prev); i++; continue; }
    if(c===')'){ prev = stack.pop(); i++; continue; }
    if(c==='-'){ order = 1; i++; continue; }
    if(c==='='){ order = 2; i++; continue; }
    if(c==='#'){ order = 3; i++; continue; }
    if(c>='1' && c<='9'){
      if(rings[c]===undefined) rings[c] = { a:prev, o:order };
      else { M.addBond(m, rings[c].a, prev, Math.max(rings[c].o, order)); delete rings[c]; }
      order = 1; i++; continue;
    }
    var el = null;
    if(c==='{'){ var j = str.indexOf('}', i); el = str.slice(i+1, j); i = j+1; }
    else if(str.substr(i,2)==='Cl'){ el='Cl'; i+=2; }
    else if(str.substr(i,2)==='Br'){ el='Br'; i+=2; }
    else if('CNOSFI'.indexOf(c)>=0){ el=c; i++; }
    else { i++; continue; }
    var idx = M.addAtom(m, el);
    if(prev>=0) M.addBond(m, prev, idx, order);
    order = 1; prev = idx;
  }
  return m;
}

/* ---- anéis ---------------------------------------------------------------- */
// Escopo do jogo: no máximo um anel por molécula. Devolve os índices em ordem cíclica.
function findRing(m){
  var n = m.atoms.length;
  var parent = {}, seen = {};
  function dfs(v, p){
    seen[v] = 1; parent[v] = p;
    var nb = M.nbrIdx(m, v);
    for(var k=0;k<nb.length;k++){
      var w = nb[k];
      if(w===p) continue;
      if(seen[w]){
        // achou ciclo: sobe de v até w
        var path = [v], cur = v, guard = 0;
        while(cur!==w && guard++ < n+2){ cur = parent[cur]; if(cur===undefined) return null; path.push(cur); }
        if(cur===w) return path;
        return null;
      }
      var r = dfs(w, v);
      if(r) return r;
    }
    return null;
  }
  for(var s=0;s<n;s++){ if(!seen[s]){ var r = dfs(s,-1); if(r) return r; } }
  return null;
}

function inRing(m, i){
  var r = findRing(m);
  return !!(r && r.indexOf(i)>=0);
}

function isBenzeneRing(m, ring){
  if(!ring || ring.length!==6) return false;
  for(var k=0;k<6;k++) if(m.atoms[ring[k]].el!=='C') return false;
  var dbl = 0;
  for(var k2=0;k2<6;k2++){
    var b = M.bond(m, ring[k2], ring[(k2+1)%6]);
    if(!b) return false;
    if(b.o===2) dbl++;
  }
  return dbl===3;
}

function benzeneRing(m){
  var r = findRing(m);
  return (r && isBenzeneRing(m,r)) ? r : null;
}

/* ---- fórmula molecular ---------------------------------------------------- */
function formula(m){
  var c = { C:0, H:0, N:0, O:0, S:0, F:0, Cl:0, Br:0, I:0 };
  for(var i=0;i<m.atoms.length;i++){
    var el = m.atoms[i].el;
    if(el==='NO2'){ c.N++; c.O+=2; }
    else if(el==='SO3H'){ c.S++; c.O+=3; c.H++; }
    else c[el] = (c[el]||0)+1;
    c.H += M.h(m,i);
  }
  var order = ['C','H','N','O','S','F','Cl','Br','I'], out = '';
  order.forEach(function(e){
    if(c[e]>0) out += e + (c[e]>1 ? sub(c[e]) : '');
  });
  return out || '—';
}
function sub(n){ return '<sub>'+n+'</sub>'; }
function formulaPlain(m){ return formula(m).replace(/<sub>/g,'').replace(/<\/sub>/g,''); }

function massaMolar(m){
  var s = 0;
  for(var i=0;i<m.atoms.length;i++){
    var el = m.atoms[i].el;
    if(el==='NO2') s += MASSA.N + 2*MASSA.O;
    else if(el==='SO3H') s += MASSA.S + 3*MASSA.O + MASSA.H;
    else s += MASSA[el]||0;
    s += M.h(m,i)*MASSA.H;
  }
  return Math.round(s*100)/100;
}

// Contagem bruta de átomos (para balanceamento de combustão)
function atomCount(m){
  var c = { C:0, H:0, O:0, N:0, S:0, X:0 };
  for(var i=0;i<m.atoms.length;i++){
    var el = m.atoms[i].el;
    if(el==='NO2'){ c.N++; c.O+=2; }
    else if(el==='SO3H'){ c.S++; c.O+=3; c.H++; }
    else if(HALO[el]) c.X++;
    else c[el] = (c[el]||0)+1;
    c.H += M.h(m,i);
  }
  return c;
}

/* ---- classificação de carbono --------------------------------------------- */
function carbonClass(m, i){
  if(m.atoms[i].el!=='C') return null;
  var n = M.cNbrs(m,i).length;
  return n; // 0 = isolado (metano), 1..4 = primário..quaternário
}
function carbonClassName(n){
  return ['isolado','primário','secundário','terciário','quaternário'][n] || '—';
}
function carbonClassShort(n){
  return ['—','1°','2°','3°','4°'][n] || '—';
}

/* ---- Nox por carbono -------------------------------------------------------
   Regra escolar: C–H vale −1; C–C vale 0; cada ligação com átomo mais
   eletronegativo (O, N, halogênio) vale +1 por par compartilhado
   (logo C=O vale +2).                                                        */
function noxCarbon(m, i){
  if(m.atoms[i].el!=='C') return null;
  var nox = -M.h(m,i);
  var nb = M.nbrs(m,i);
  for(var k=0;k<nb.length;k++){
    var el = m.atoms[nb[k].j].el;
    if(el==='C') continue;
    if(ELETRONEG[el]) nox += nb[k].o;
    else nox -= nb[k].o; // caso teórico: ligação com átomo menos eletronegativo
  }
  return nox;
}
function noxAll(m){
  return M.carbons(m).map(function(i){ return { i:i, nox:noxCarbon(m,i) }; });
}
function noxStr(n){ return (n>0?'+':'') + n; }

/* ---- canonicalização (refinamento de cores tipo Weisfeiler–Lehman) ---------
   Usada para: contar isômeros de monossubstituição por hidrogênios
   equivalentes, comparar a molécula montada pelo jogador com o gabarito e
   remover produtos repetidos. É exata para cadeias abertas (árvores).        */
function canonKey(m){
  var n = m.atoms.length;
  if(!n) return '';
  var col = [];
  for(var i=0;i<n;i++){
    var os = M.nbrs(m,i).map(function(x){ return x.o; }).sort().join('');
    col.push(m.atoms[i].el + '.' + M.h(m,i) + '.' + os);
  }
  for(var r=0;r<n+2;r++){
    var next = [];
    for(var i2=0;i2<n;i2++){
      var tags = M.nbrs(m,i2).map(function(x){ return x.o + col[x.j]; }).sort();
      next.push(col[i2] + '(' + tags.join(',') + ')');
    }
    // comprime as cores para strings não crescerem exponencialmente
    var uniq = next.slice().sort(), map = {}, c = 0;
    uniq.forEach(function(s){ if(map[s]===undefined) map[s] = 'c'+(c++); });
    var compressed = next.map(function(s){ return map[s]; });
    if(compressed.join('|')===col.join('|')) { col = compressed; break; }
    col = compressed;
  }
  var edges = m.bonds.map(function(b){
    var x = col[b.a], y = col[b.b];
    return (x<y ? x+'-'+y : y+'-'+x) + ':' + b.o;
  }).sort().join(';');
  var verts = m.atoms.map(function(a,i){ return a.el + col[i] + 'h' + M.h(m,i); }).sort().join(',');
  return verts + '#' + edges;
}

function sameMol(a, b){
  if(!a||!b) return false;
  return canonKey(a) === canonKey(b);
}

// Chave do ramo que sai de `from` em direção a `to` (sem voltar). Para quiralidade.
function branchKey(m, from, to, depth){
  depth = depth===undefined ? 12 : depth;
  if(depth<=0) return '…';
  var el = m.atoms[to].el;
  var parts = M.nbrs(m,to).filter(function(x){ return x.j!==from; })
    .map(function(x){ return x.o + branchKey(m, to, x.j, depth-1); }).sort();
  return el + M.h(m,to) + '(' + parts.join(',') + ')';
}

function isChiralCarbon(m, i){
  if(m.atoms[i].el!=='C') return false;
  if(M.nbrs(m,i).some(function(x){ return x.o>1; })) return false;  // nenhuma dupla/tripla
  if(M.h(m,i)>1) return false;               // 2 H iguais → não é quiral
  if(inRing(m,i)) return false;              // simplificação: só cadeia aberta
  var nb = M.nbrIdx(m,i);
  var keys = nb.map(function(j){ return branchKey(m,i,j); });
  if(M.h(m,i)===1) keys.push('H');
  var set = {};
  for(var k=0;k<keys.length;k++){
    if(set[keys[k]]) return false;
    set[keys[k]] = 1;
  }
  return keys.length===4;
}
function chiralCarbons(m){
  return M.carbons(m).filter(function(i){ return isChiralCarbon(m,i); });
}

/* ---- detecção de funções orgânicas ---------------------------------------- */
// Devolve {tipo, atoms:[...], rotulo, sufixoPrioridade}
var FG_PRIO = {
  acido:100, ester:95, amida:90, nitrila:85, aldeido:80, cetona:75,
  alcool:70, fenol:68, amina:60, eter:50, alcino:40, alceno:38, dieno:37,
  nitro:20, haleto:15, aromatico:10, ciclano:6, alcano:5
};

function groupsOf(m){
  var gs = [], ring = findRing(m), benz = ring && isBenzeneRing(m, ring) ? ring : null;
  function add(t, ats, rot){
    var g = { tipo:t, atoms:ats, rotulo:rot, prio:FG_PRIO[t]||0, classe:0 };
    gs.push(g);
    return g;
  }

  for(var i=0;i<m.atoms.length;i++){
    var el = m.atoms[i].el;
    if(el==='NO2'){ add('nitro', [i], 'nitrocomposto'); continue; }
    if(HALO[el]){
      var cDoX = M.nbrIdx(m,i).filter(function(j){ return m.atoms[j].el==='C'; });
      var gx = add('haleto', [i], 'haleto orgânico');
      if(cDoX.length){ gx.classe = carbonClass(m, cDoX[0]); gx.atoms.push(cDoX[0]); }
      continue;
    }
    if(el!=='C') continue;

    var nb = M.nbrs(m,i);
    var dblO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===2; });
    var sglO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===1; });
    var Ns   = nb.filter(function(x){ return m.atoms[x.j].el==='N'; });
    var Cs   = nb.filter(function(x){ return m.atoms[x.j].el==='C'; });

    if(dblO.length){
      if(sglO.length){
        var o = sglO[0].j;
        var oC = M.cNbrs(m,o).filter(function(x){ return x.j!==i; });
        if(oC.length) add('ester', [i, o, dblO[0].j, oC[0].j], 'éster');
        else add('acido', [i, o, dblO[0].j], 'ácido carboxílico');
      } else if(Ns.length && Ns[0].o===1){
        add('amida', [i, Ns[0].j, dblO[0].j], 'amida');
      } else if(Cs.length>=2){
        add('cetona', [i, dblO[0].j], 'cetona');
      } else {
        add('aldeido', [i, dblO[0].j], 'aldeído');
      }
      continue;
    }
    var trN = nb.filter(function(x){ return m.atoms[x.j].el==='N' && x.o===3; });
    if(trN.length){ add('nitrila', [i, trN[0].j], 'nitrila'); continue; }

    for(var k=0;k<sglO.length;k++){
      var oi = sglO[k].j;
      if(M.h(m,oi)===1){
        if(benz && benz.indexOf(i)>=0) add('fenol', [i,oi], 'fenol');
        else add('alcool', [i,oi], 'álcool ' + carbonClassShort(carbonClass(m,i))).classe = carbonClass(m,i);
      } else {
        var other = M.nbrs(m,oi).filter(function(x){ return x.j!==i; });
        if(other.length) { if(i < other[0].j) add('eter', [i, oi, other[0].j], 'éter'); }
      }
    }
    for(var k2=0;k2<Ns.length;k2++){
      var ni = Ns[k2].j;
      if(Ns[k2].o!==1) continue;
      var isAmida = M.nbrs(m,ni).some(function(x){
        return m.atoms[x.j].el==='C' && M.nbrs(m,x.j).some(function(y){ return m.atoms[y.j].el==='O' && y.o===2; });
      });
      if(!isAmida) add('amina', [i, ni], 'amina ' + carbonClassShort(M.cNbrs(m,ni).length)).classe = M.cNbrs(m,ni).length;
    }
  }

  // insaturações fora do anel aromático
  var dbl = [], tri = [];
  m.bonds.forEach(function(b){
    if(m.atoms[b.a].el!=='C' || m.atoms[b.b].el!=='C') return;
    if(benz && benz.indexOf(b.a)>=0 && benz.indexOf(b.b)>=0) return;
    if(b.o===2) dbl.push(b);
    if(b.o===3) tri.push(b);
  });
  if(tri.length) add('alcino', [tri[0].a, tri[0].b], 'alcino');
  if(dbl.length>=2) add('dieno', [dbl[0].a, dbl[0].b, dbl[1].a, dbl[1].b], 'dieno');
  else if(dbl.length===1) add('alceno', [dbl[0].a, dbl[0].b], 'alceno');
  if(benz) add('aromatico', benz, 'aromático');
  if(ring && !benz) add('ciclano', ring, 'cíclico');
  if(!gs.length) add('alcano', [], 'alcano');
  gs.sort(function(a,b){ return b.prio - a.prio; });
  return gs;
}

function mainGroup(m){ var g = groupsOf(m); return g.length ? g[0] : null; }

function functionLabels(m){
  var g = groupsOf(m), seen = {}, out = [];
  g.forEach(function(x){
    var r = x.rotulo;
    if(!seen[r]){ seen[r]=1; out.push(r); }
  });
  return out;
}

// Dieno conjugado: C=C–C=C
function conjugatedDiene(m){
  var ds = m.bonds.filter(function(b){
    return b.o===2 && m.atoms[b.a].el==='C' && m.atoms[b.b].el==='C';
  });
  if(ds.length<2) return null;
  var benz = benzeneRing(m);
  if(benz) return null;
  for(var i=0;i<ds.length;i++) for(var j=i+1;j<ds.length;j++){
    var A = [ds[i].a, ds[i].b], B = [ds[j].a, ds[j].b];
    for(var x=0;x<2;x++) for(var y=0;y<2;y++){
      if(M.bond(m, A[x], B[y])){
        return { c1:A[1-x], c2:A[x], c3:B[y], c4:B[1-y] };
      }
    }
  }
  return null;
}

/* ---- utilidades ------------------------------------------------------------ */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(a){
  var b = a.slice();
  for(var i=b.length-1;i>0;i--){ var j = rnd(i+1); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* ============================================================================
   2. NOMEADOR IUPAC
   Algoritmo (cadeia aberta):
     a) acha a função principal pela ordem de sufixo
     b) enumera todos os caminhos de carbono terminal a terminal
     c) escolhe a cadeia: contém a função > mais insaturações > mais longa > mais ramificada
     d) numera: menor localizador para função > insaturação > ramificações > ordem alfabética
     e) monta: prefixos alfabéticos + raiz + insaturação + sufixo
   Anéis e aromáticos têm rotas próprias (tabela de nomes consagrados).
   ========================================================================== */

var ROOT = ['','met','et','prop','but','pent','hex','hept','oct','non','dec','undec','dodec'];
var MULT = ['','','di','tri','tetra','penta','hexa'];
var SUFFIX_ORDER = ['acido','ester','amida','nitrila','aldeido','cetona','alcool','amina'];
// Sufixos que ficam obrigatoriamente no carbono 1 (não recebem localizador)
var SUF_C1 = { acido:1, ester:1, amida:1, nitrila:1, aldeido:1 };
var SUF_TXT = { alcool:'ol', cetona:'ona', aldeido:'al', acido:'oico', ester:'oato',
                amida:'amida', amina:'amina', nitrila:'onitrila' };

function firstOf(gs, t){ for(var i=0;i<gs.length;i++) if(gs[i].tipo===t) return gs[i]; return null; }

/* ---- corte de ligação, devolvendo o lado desejado ---- */
function cutSide(m, cutA, cutB, keep){
  var mm = M.clone(m);
  M.delBond(mm, cutA, cutB);
  var seen = {}, st = [keep]; seen[keep] = 1;
  while(st.length){
    var i = st.pop();
    M.nbrIdx(mm,i).forEach(function(j){ if(!seen[j]){ seen[j]=1; st.push(j); } });
  }
  var idxs = Object.keys(seen).map(Number).sort(function(a,b){ return a-b; });
  var map = {}, nm = M.make();
  idxs.forEach(function(g,k){ map[g] = k; M.addAtom(nm, mm.atoms[g].el); });
  mm.bonds.forEach(function(b){
    if(map[b.a]!==undefined && map[b.b]!==undefined) M.addBond(nm, map[b.a], map[b.b], b.o);
  });
  return { mol:nm, map:map };
}

/* ---- átomos de um ramo (a partir de `a`, sem voltar para `from`) ---- */
function branchAtoms(m, from, a){
  var seen = {}; seen[from] = 1; seen[a] = 1;
  var st = [a], out = [a];
  while(st.length){
    var i = st.pop();
    M.nbrIdx(m,i).forEach(function(j){ if(!seen[j]){ seen[j]=1; out.push(j); st.push(j); } });
  }
  return out;
}

/* ---- nome de radical (substituinte) ---- */
function radicalName(m, a, from){
  var ats = branchAtoms(m, from, a);
  var ring = findRing(m);
  if(ring && ring.indexOf(a)>=0 && isBenzeneRing(m,ring)){
    // anel benzênico pendurado
    var extra = ats.filter(function(i){ return ring.indexOf(i)<0; });
    return extra.length ? 'fenil-substituído' : 'fenil';
  }
  var cs = ats.filter(function(i){ return m.atoms[i].el==='C'; });
  var hetero = ats.filter(function(i){ return m.atoms[i].el!=='C'; });
  var n = cs.length;
  var kids = M.cNbrs(m,a).filter(function(x){ return x.j!==from; });

  // insaturados consagrados
  var hasDbl = false, hasTri = false;
  m.bonds.forEach(function(b){
    if(ats.indexOf(b.a)>=0 && ats.indexOf(b.b)>=0){
      if(b.o===2) hasDbl = true; if(b.o===3) hasTri = true;
    }
  });
  if(!hetero.length && hasDbl){
    if(n===2) return 'vinil';
    if(n===3 && M.bond(m,a,kids.length?kids[0].j:-1) && M.bond(m,a,kids[0].j).o===1) return 'alil';
    if(n===3) return 'propenil';
  }
  if(!hetero.length && hasTri && n===2) return 'etinil';

  if(!hetero.length && !hasDbl && !hasTri){
    if(n===1) return 'metil';
    if(n===2) return 'etil';
    if(n===3) return kids.length===2 ? 'isopropil' : 'propil';
    if(n===4){
      if(kids.length===3) return 'terc-butil';
      if(kids.length===2) return 'sec-butil';
      var k = kids[0];
      if(k && M.cNbrs(m,k.j).filter(function(x){ return x.j!==a; }).length===2) return 'isobutil';
      return 'butil';
    }
    if(n===5 && kids.length===1){
      var k5 = kids[0];
      if(k5 && M.cNbrs(m,k5.j).filter(function(x){ return x.j!==a; }).length===3) return 'neopentil';
    }
    if(n>=5 && n<ROOT.length) return ROOT[n] + 'il';
  }
  // Ramo com heteroátomo ou insaturação incomum: nomeia a maior cadeia do ramo a partir de `a`
  var sub = cutSide(m, from, a, a);
  var inner = nameAcyclic(sub.mol, { asRadical:true, radicalRoot:sub.map[a] });
  return inner || (ROOT[n]||'poli') + 'il';
}

function radicalFeminine(r){
  // "etil" → "etila" (usado em ésteres: etanoato de etila)
  if(/il$/.test(r)) return r + 'a';
  return r;
}
function alkoxyName(r){ return r.replace(/il$/, 'oxi'); }

/* ---- caminhos de carbono ---- */
function carbonPaths(m, blocked){
  blocked = blocked || [];
  var cs = M.carbons(m).filter(function(i){ return blocked.indexOf(i)<0; });
  if(!cs.length) return [];
  var ok = {}; cs.forEach(function(i){ ok[i] = 1; });
  var paths = [], MAXP = 4000;
  function dfs(cur, path, seen){
    if(paths.length > MAXP) return;
    var ends = true;
    var nb = M.cNbrs(m,cur).filter(function(x){ return ok[x.j] && !seen[x.j]; });
    for(var k=0;k<nb.length;k++){
      ends = false;
      seen[nb[k].j] = 1; path.push(nb[k].j);
      dfs(nb[k].j, path, seen);
      path.pop(); delete seen[nb[k].j];
    }
    if(path.length>=1) paths.push(path.slice());
    return ends;
  }
  cs.forEach(function(s){ var seen = {}; seen[s] = 1; dfs(s, [s], seen); });
  // remove caminhos duplicados (mesmo conjunto/ordem invertida)
  var seenK = {}, out = [];
  paths.forEach(function(p){
    var k1 = p.join(','), k2 = p.slice().reverse().join(',');
    if(seenK[k1]||seenK[k2]) return;
    seenK[k1] = 1; out.push(p);
  });
  return out;
}

function chainInsat(m, path){
  var d = 0, t = 0, locs = [];
  for(var i=0;i<path.length-1;i++){
    var b = M.bond(m, path[i], path[i+1]);
    if(b && b.o===2){ d++; locs.push({ k:i+1, tipo:'en' }); }
    if(b && b.o===3){ t++; locs.push({ k:i+1, tipo:'in' }); }
  }
  return { d:d, t:t, n:d+t, locs:locs };
}

/* ============================================================================
   Nome de cadeia aberta
   ========================================================================== */
function nameAcyclic(m, opt){
  opt = opt || {};
  var gs = groupsOf(m);
  var blocked = opt.blocked || [];

  // Éster tem estrutura de nome própria: "<acila>ato de <alquila>ila"
  if(!opt.asRadical){
    var eg = firstOf(gs,'ester');
    if(eg) return nameEster(m, eg);
  }

  // função principal (a que vira sufixo)
  var fg = null;
  if(!opt.asRadical){
    for(var s=0;s<SUFFIX_ORDER.length;s++){
      var cand = firstOf(gs, SUFFIX_ORDER[s]);
      if(cand){ fg = cand; break; }
    }
  }
  var fgType = fg ? fg.tipo : null;

  // átomos consumidos pelo sufixo (não viram prefixo).
  // Guarda TODAS as ocorrências da função principal: é o que permite
  // "propano-1,2,3-triol" (glicerol) e "etano-1,2-diol" (oxidação de Baeyer).
  var used = {};
  var anchors = [], anchorN = -1;
  var fgList = fgType ? gs.filter(function(g){ return g.tipo===fgType; }) : [];
  fgList.forEach(function(g){
    if(fgType==='alcool'||fgType==='cetona'||fgType==='aldeido'||fgType==='nitrila'){
      anchors.push(g.atoms[0]); used[g.atoms[1]] = 1;
    } else if(fgType==='acido'){
      anchors.push(g.atoms[0]); used[g.atoms[1]] = 1; used[g.atoms[2]] = 1;
    } else if(fgType==='amida'){
      anchors.push(g.atoms[0]); anchorN = g.atoms[1]; used[g.atoms[1]] = 1; used[g.atoms[2]] = 1;
    } else if(fgType==='amina'){
      anchors.push(g.atoms[0]); anchorN = g.atoms[1]; used[g.atoms[1]] = 1;
    }
  });
  var anchorC = anchors.length ? anchors[0] : -1;

  // candidatos de cadeia principal
  var paths = carbonPaths(m, blocked);
  if(!paths.length) return opt.asRadical ? '' : '—';
  var best = null;
  paths.forEach(function(p){
    if(opt.asRadical && opt.radicalRoot!==undefined && p[0]!==opt.radicalRoot && p[p.length-1]!==opt.radicalRoot) return;
    var nA = anchors.filter(function(a){ return p.indexOf(a)>=0; }).length;
    if(anchors.length && !nA) return;
    var ins = chainInsat(m,p);
    var nsub = 0;
    p.forEach(function(c){
      M.nbrIdx(m,c).forEach(function(j){ if(p.indexOf(j)<0 && !used[j]) nsub++; });
    });
    var score = [nA, ins.n, p.length, nsub];
    if(!best || cmpArr(score, best.score) > 0) best = { path:p, score:score, ins:ins };
  });
  if(!best){
    // função fora de qualquer caminho (caso raro): usa a cadeia mais longa
    paths.forEach(function(p){
      var ins = chainInsat(m,p);
      var score = [0, ins.n, p.length, 0];
      if(!best || cmpArr(score, best.score) > 0) best = { path:p, score:score, ins:ins };
    });
  }

  // as duas direções e cadeias empatadas: escolhe pelos menores localizadores
  var tied = paths.filter(function(p){
    if(opt.asRadical && opt.radicalRoot!==undefined && p[0]!==opt.radicalRoot && p[p.length-1]!==opt.radicalRoot) return false;
    var nA = anchors.filter(function(a){ return p.indexOf(a)>=0; }).length;
    if(anchors.length && !nA) return false;
    var ins = chainInsat(m,p);
    var nsub = 0;
    p.forEach(function(c){ M.nbrIdx(m,c).forEach(function(j){ if(p.indexOf(j)<0 && !used[j]) nsub++; }); });
    return cmpArr([nA, ins.n, p.length, nsub], best.score)===0;
  });
  if(!tied.length) tied = [best.path];

  var chosen = null;
  tied.forEach(function(p){
    [p, p.slice().reverse()].forEach(function(dir){
      if(opt.asRadical && opt.radicalRoot!==undefined && dir[0]!==opt.radicalRoot) return;
      var info = analyzeChain(m, dir, fg, fgType, anchors, used, blocked);
      if(!chosen || cmpArr(info.rank, chosen.rank) < 0) chosen = info;
    });
  });
  if(!chosen) chosen = analyzeChain(m, best.path, fg, fgType, anchors, used, blocked);

  var nomeFinal = buildName(m, chosen, fgType, fg, anchorN, opt);
  // guarda a numeração da cadeia principal da chamada de topo (não a dos radicais):
  // é ela que o construtor mostra sobre os carbonos, para bater com o nome.
  if(!opt.asRadical) ULTIMA_NUM = { key:canonKey(m), pos:chosen.pos };
  return nomeFinal;
}

// Numeração IUPAC dos carbonos da cadeia principal, ou null quando não se aplica
// (aromáticos e ciclos têm numeração própria, tratada nas rotas deles).
var ULTIMA_NUM = null;
function numeracaoIUPAC(m){
  ULTIMA_NUM = null;
  try { iupacName(m); } catch(e){ return null; }
  if(!ULTIMA_NUM || ULTIMA_NUM.key !== canonKey(m)) return null;
  return ULTIMA_NUM.pos;
}

function cmpArr(a,b){
  for(var i=0;i<Math.max(a.length,b.length);i++){
    var x = a[i]===undefined?-Infinity:a[i], y = b[i]===undefined?-Infinity:b[i];
    if(x!==y) return x<y ? -1 : 1;
  }
  return 0;
}

/* ---- analisa uma cadeia numerada em um sentido ---- */
function analyzeChain(m, path, fg, fgType, anchors, used, blocked){
  anchors = anchors || [];
  var pos = {}; path.forEach(function(c,i){ pos[c] = i+1; });
  var ins = chainInsat(m, path);
  var insLocs = ins.locs.map(function(x){ return x.k; }).sort(function(a,b){ return a-b; });
  var fgLocs = anchors.map(function(a){ return pos[a]; })
                      .filter(function(x){ return x!==undefined; })
                      .sort(function(a,b){ return a-b; });
  var fgLoc = fgLocs.length ? fgLocs[0] : 0;

  // substituintes
  var subs = [];
  path.forEach(function(c,i){
    M.nbrs(m,c).forEach(function(x){
      var j = x.j;
      if(path.indexOf(j)>=0 || used[j]) return;
      var el = m.atoms[j].el;
      var nome = null;
      if(el==='C'){
        if(blocked.indexOf(j)>=0) nome = 'fenil';
        else nome = substCarbonName(m, j, c);
      }
      else if(HALO[el]) nome = { F:'fluoro', Cl:'cloro', Br:'bromo', I:'iodo' }[el];
      else if(el==='NO2') nome = 'nitro';
      else if(el==='SO3H') nome = 'sulfo';
      else if(el==='O'){
        if(x.o===2) nome = 'oxo';
        else if(M.h(m,j)===1) nome = 'hidroxi';
        else {
          var other = M.nbrIdx(m,j).filter(function(k){ return k!==c; });
          nome = other.length ? alkoxyName(radicalName(m, other[0], j)) : 'hidroxi';
        }
      }
      else if(el==='N'){
        if(x.o===3) nome = 'ciano';
        else {
          var rs = M.cNbrs(m,j).filter(function(k){ return k.j!==c; })
                    .map(function(k){ return radicalName(m, k.j, j); }).sort();
          nome = rs.length ? (rs.length===2 && rs[0]===rs[1] ? 'di'+rs[0] : rs.join('')) + 'amino' : 'amino';
        }
      }
      if(nome) subs.push({ loc:i+1, nome:nome });
    });
  });

  var subLocs = subs.map(function(s){ return s.loc; }).sort(function(a,b){ return a-b; });
  var alpha = subs.slice().sort(function(a,b){
    var c1 = alphaKey(a.nome).localeCompare(alphaKey(b.nome));
    if(c1) return c1;
    return a.loc-b.loc;
  });
  var alphaLocs = alpha.map(function(s){ return s.loc; });

  var rank = [];
  if(fgType) rank = rank.concat(fgLocs.length ? fgLocs : [99]);
  rank = rank.concat(insLocs.length ? insLocs : [99]);
  rank = rank.concat(subLocs.length ? subLocs : [99]);
  rank = rank.concat(alphaLocs);

  return { path:path, pos:pos, ins:ins, insLocs:insLocs, fgLoc:fgLoc, fgLocs:fgLocs,
           subs:subs, rank:rank, len:path.length };
}

// Nome de um substituinte que começa em carbono
function substCarbonName(m, j, from){
  // grupos especiais consagrados como prefixo
  var nb = M.nbrs(m,j);
  var dblO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===2; });
  var sglO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===1; });
  if(dblO.length && sglO.length && M.h(m,sglO[0].j)===1) return 'carboxi';
  if(dblO.length && M.h(m,j)===1) return 'formil';
  if(dblO.length) return 'acil';
  return radicalName(m, j, from);
}

function alphaKey(n){
  return String(n).replace(/^(sec|terc|tert|n|N)-/,'').replace(/^(di|tri|tetra)(?=[a-z])/,'')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}

/* ---- montagem final do nome ---- */
function buildName(m, ch, fgType, fg, anchorN, opt){
  opt = opt || {};
  var n = ch.len;
  if(n>=ROOT.length) return 'cadeia muito longa';
  var raiz = ROOT[n];

  // ---- prefixos
  var groups = {};
  ch.subs.forEach(function(s){
    if(!groups[s.nome]) groups[s.nome] = [];
    groups[s.nome].push(s.loc);
  });
  // radicais no nitrogênio do sufixo (amina/amida) recebem localizador N
  if(anchorN>=0 && (fgType==='amina'||fgType==='amida')){
    M.cNbrs(m, anchorN).forEach(function(x){
      if(ch.path.indexOf(x.j)>=0) return;
      var r = radicalName(m, x.j, anchorN);
      var key = 'N-' + r;
      if(!groups[key]) groups[key] = [];
      groups[key].push('N');
    });
  }
  var prefList = Object.keys(groups).map(function(nome){
    var locs = groups[nome].slice().sort(function(a,b){
      if(a==='N') return -1; if(b==='N') return 1; return a-b;
    });
    var base = nome.replace(/^N-/,'');
    var mult = locs.length>1 ? (MULT[locs.length]||locs.length+'x') : '';
    var needParen = /[\-]/.test(base) && mult; // ex.: bis(terc-butil) — simplificado
    var locTxt = locs.join(',');
    var txt;
    if(nome.indexOf('N-')===0){
      // dois radicais iguais no nitrogênio: "N,N-dimetil", não "N-metil-N-metil"
      txt = locs.map(function(){ return 'N'; }).join(',') + '-' + mult + base;
    }
    else txt = locTxt + '-' + mult + base;
    return { key:alphaKey(base), txt:txt, minLoc:(locs[0]==='N'?0:locs[0]) };
  }).sort(function(a,b){
    var c = a.key.localeCompare(b.key);
    return c ? c : a.minLoc - b.minLoc;
  });
  // ---- decidir omissão de localizadores
  var temSufixoPosicional = fgType ? !SUF_C1[fgType] : false;
  var descritores = (ch.ins.n>0 ? 1 : 0) + (temSufixoPosicional ? 1 : 0);
  var podeOmitir = ch.subs.length===0 && descritores<=1 && !opt.asRadical;
  // Substituinte único numa cadeia em que só há uma posição possível:
  // "cloroetano", "metoximetano", "etoxietano" — e não "1-cloroetano".
  var omitSub = prefList.length===1 && ch.subs.length===1 && descritores===0
                && Math.ceil(n/2)===1 && !opt.asRadical;
  if(omitSub) prefList[0].txt = prefList[0].txt.replace(/^\d+-/,'');
  var prefixos = prefList.map(function(p){ return p.txt; }).join('-');

  // ---- parte da insaturação
  var insPart, dLocs = [], tLocs = [];
  ch.ins.locs.forEach(function(x){ (x.tipo==='en'?dLocs:tLocs).push(x.k); });
  dLocs.sort(function(a,b){return a-b;}); tLocs.sort(function(a,b){return a-b;});
  if(ch.ins.n===0) insPart = 'an';
  else {
    var parts = [];
    if(dLocs.length){
      var omitD = podeOmitir && dLocs.length===1 && distinctPositions(n,'en')===1;
      var mult = dLocs.length>1 ? MULT[dLocs.length] : '';
      if(dLocs.length>1) parts.push('a-' + dLocs.join(',') + '-' + mult + 'en');
      else parts.push(omitD ? 'en' : '-' + dLocs[0] + '-en');
    }
    if(tLocs.length){
      var omitT = podeOmitir && tLocs.length===1 && !dLocs.length && distinctPositions(n,'in')===1;
      if(tLocs.length>1) parts.push('a-' + tLocs.join(',') + '-' + MULT[tLocs.length] + 'in');
      else parts.push(omitT ? 'in' : '-' + tLocs[0] + '-in');
    }
    insPart = parts.join('');
    insPart = insPart.replace(/^-/,'-');
  }

  // ---- sufixo
  var sufPart = '', prefixoPalavra = '';
  if(!fgType){
    sufPart = 'o';
  } else if(fgType==='acido'){
    prefixoPalavra = 'ácido ';
    sufPart = 'oico';
    if(ch.ins.n===0) insPart = 'an';
  } else if(fgType==='aldeido'){
    sufPart = 'al';
  } else if(fgType==='nitrila'){
    sufPart = 'onitrila';
  } else if(fgType==='amida'){
    sufPart = 'amida';
  } else {
    var st = SUF_TXT[fgType];
    var locs = (ch.fgLocs && ch.fgLocs.length) ? ch.fgLocs : [ch.fgLoc];
    if(locs.length>1){
      // di/tri no sufixo: "propano-1,2,3-triol", "hexano-2,5-diona"
      sufPart = 'o-' + locs.join(',') + '-' + (MULT[locs.length]||locs.length+'x') + st;
    } else {
      var omitS = podeOmitir && distinctPositions(n, fgType)===1;
      sufPart = omitS ? st : '-' + locs[0] + '-' + st;
    }
  }

  var corpo = raiz + insPart + sufPart;
  // ajustes ortográficos: "butan"+"ona" → butanona ; "but"+"-2-en"+"-1-ol"
  corpo = corpo.replace(/--/g,'-');
  var nome = (prefixos ? prefixos + corpo : corpo);
  if(opt.asRadical){
    // radical: troca a terminação por "il"
    return nome.replace(/o$/,'') + 'il';
  }
  return prefixoPalavra + nome;
}

// Quantas posições distintas o descritor pode ocupar numa cadeia linear de n carbonos
function distinctPositions(n, kind){
  if(kind==='en' || kind==='in') return Math.ceil((n-1)/2);
  if(kind==='alcool' || kind==='amina') return Math.ceil(n/2);
  if(kind==='cetona') return Math.ceil((n-2)/2);
  return 1;
}

/* ---- éster ---- */
function nameEster(m, g){
  var C = g.atoms[0], O = g.atoms[1], R = g.atoms[3];
  var acila = cutSide(m, O, R, C);              // vira ácido carboxílico
  var nomeAcido = nameAcyclic(acila.mol);
  var parte1 = nomeAcido.replace(/^ácido\s+/,'').replace(/oico$/,'oato');
  if(parte1===nomeAcido) parte1 = nomeAcido.replace(/^ácido\s+/,'') + 'ato';
  var rad = radicalName(m, R, O);
  return parte1 + ' de ' + radicalFeminine(rad);
}

/* ============================================================================
   Nome de composto cíclico (não aromático)
   ========================================================================== */
function nameCyclic(m, ring){
  var n = ring.length;
  var raiz = 'ciclo' + (n===6 ? '-hex' : ROOT[n]);
  // substituintes do anel
  var subs = [];
  ring.forEach(function(c, idx){
    M.nbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      var el = m.atoms[x.j].el, nome = null, tipo = 'sub';
      if(el==='C') nome = radicalName(m, x.j, c);
      else if(HALO[el]) nome = { F:'fluoro', Cl:'cloro', Br:'bromo', I:'iodo' }[el];
      else if(el==='NO2') nome = 'nitro';
      else if(el==='O' && x.o===1 && M.h(m,x.j)===1){ nome = 'ol'; tipo = 'fg'; }
      else if(el==='O' && x.o===2){ nome = 'ona'; tipo = 'fg'; }
      else if(el==='O') nome = alkoxyName(radicalName(m, M.nbrIdx(m,x.j).filter(function(k){return k!==c;})[0], x.j));
      else if(el==='N') nome = 'amina', tipo = 'fg';
      if(nome) subs.push({ at:c, nome:nome, tipo:tipo });
    });
  });
  // insaturação no anel
  var dbl = [];
  for(var k=0;k<n;k++){
    var b = M.bond(m, ring[k], ring[(k+1)%n]);
    if(b && b.o===2) dbl.push(k);
  }
  // Se uma cadeia lateral for maior que o anel, o anel vira substituinte (regra prática)
  var maiorLateral = 0;
  ring.forEach(function(c){
    M.cNbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      maiorLateral = Math.max(maiorLateral, branchAtoms(m,c,x.j).filter(function(i){ return m.atoms[i].el==='C'; }).length);
    });
  });
  if(maiorLateral > n){
    return nameAcyclic(m, { blocked:ring }); // anel entra como substituinte "ciclo..."
  }

  // numeração do anel: tenta todas as origens e os dois sentidos
  var bestTxt = null, bestRank = null;
  for(var s=0;s<n;s++) for(var d=-1;d<=1;d+=2){
    var ordem = [];
    for(var i=0;i<n;i++) ordem.push(ring[(s + d*i + n*n)%n]);
    var pos = {}; ordem.forEach(function(c,i){ pos[c]=i+1; });
    var fgs = subs.filter(function(x){ return x.tipo==='fg'; });
    var pl  = subs.filter(function(x){ return x.tipo!=='fg'; });
    var dLoc = [];
    for(var k2=0;k2<n;k2++){
      var bb = M.bond(m, ordem[k2], ordem[(k2+1)%n]);
      if(bb && bb.o===2) dLoc.push(k2+1);
    }
    var rank = [];
    rank.push(fgs.length ? Math.min.apply(null, fgs.map(function(x){ return pos[x.at]; })) : 99);
    rank.push(dLoc.length ? Math.min.apply(null, dLoc) : 99);
    rank = rank.concat(pl.map(function(x){ return pos[x.at]; }).sort(function(a,b){return a-b;}));
    if(bestRank===null || cmpArr(rank,bestRank)<0){
      bestRank = rank;
      bestTxt = { ordem:ordem, pos:pos, fgs:fgs, pl:pl, dLoc:dLoc };
    }
  }

  var t = bestTxt;
  var grp = {};
  t.pl.forEach(function(s2){
    if(!grp[s2.nome]) grp[s2.nome] = [];
    grp[s2.nome].push(t.pos[s2.at]);
  });
  var totalSubs = t.pl.length + t.fgs.length;
  var prefList = Object.keys(grp).map(function(nome){
    var locs = grp[nome].sort(function(a,b){return a-b;});
    var mult = locs.length>1 ? MULT[locs.length] : '';
    var txt = (totalSubs>1 || locs.length>1) ? locs.join(',') + '-' + mult + nome : nome;
    return { key:alphaKey(nome), txt:txt, minLoc:locs[0] };
  }).sort(function(a,b){ var c = a.key.localeCompare(b.key); return c?c:a.minLoc-b.minLoc; });
  var prefixos = prefList.map(function(p){ return p.txt; }).join('-');

  var insPart = 'an';
  if(t.dLoc.length===1) insPart = (n>3 && totalSubs>0) ? '-'+t.dLoc[0]+'-en' : 'en';
  else if(t.dLoc.length>1) insPart = 'a-' + t.dLoc.sort(function(a,b){return a-b;}).join(',') + '-' + MULT[t.dLoc.length] + 'en';

  var suf = 'o';
  if(t.fgs.length){
    var f = t.fgs[0];
    var loc = t.pos[f.at];
    var precisa = totalSubs>1;
    suf = precisa ? '-'+loc+'-'+f.nome : f.nome;
    if(f.nome==='ona' && insPart==='an') { /* ciclo-hexanona */ }
  }
  var corpo = raiz + insPart + suf;
  return (prefixos ? prefixos + corpo : corpo).replace(/--/g,'-');
}

/* ============================================================================
   Nome de composto aromático
   ========================================================================== */
var AR_BASE = [
  { pref:'carboxi', nome:'ácido benzoico', pos:'ácido ', suf:'' },
  { pref:'sulfo',   nome:'ácido benzenossulfônico' },
  { pref:'formil',  nome:'benzaldeído' },
  { pref:'hidroxi', nome:'fenol' },
  { pref:'amino',   nome:'anilina' },
  { pref:'metil',   nome:'tolueno' }
];
var AR_MONO = {
  'metil':'tolueno', 'hidroxi':'fenol', 'amino':'anilina', 'nitro':'nitrobenzeno',
  'carboxi':'ácido benzoico', 'sulfo':'ácido benzenossulfônico', 'formil':'benzaldeído',
  'vinil':'estireno', 'etil':'etilbenzeno', 'isopropil':'cumeno', 'fenil':'bifenil',
  'cloro':'clorobenzeno', 'bromo':'bromobenzeno', 'fluoro':'fluorobenzeno', 'iodo':'iodobenzeno',
  'acetil':'acetofenona'
};

function aromaticSubPrefix(m, ringAtom, j){
  var el = m.atoms[j].el;
  if(HALO[el]) return { F:'fluoro', Cl:'cloro', Br:'bromo', I:'iodo' }[el];
  if(el==='NO2') return 'nitro';
  if(el==='SO3H') return 'sulfo';
  if(el==='O'){
    if(M.h(m,j)===1) return 'hidroxi';
    var o = M.nbrIdx(m,j).filter(function(k){ return k!==ringAtom; });
    return o.length ? alkoxyName(radicalName(m, o[0], j)) : 'hidroxi';
  }
  if(el==='N'){
    var rs = M.cNbrs(m,j).filter(function(k){ return k.j!==ringAtom; });
    if(!rs.length) return 'amino';
    return rs.map(function(k){ return radicalName(m,k.j,j); }).join('') + 'amino';
  }
  if(el==='C'){
    var nb = M.nbrs(m,j);
    var dblO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===2; });
    var sglO = nb.filter(function(x){ return m.atoms[x.j].el==='O' && x.o===1; });
    var trN  = nb.filter(function(x){ return m.atoms[x.j].el==='N' && x.o===3; });
    if(trN.length) return 'ciano';
    if(dblO.length && sglO.length) return M.h(m,sglO[0].j)===1 ? 'carboxi' : 'carbalcoxi';
    if(dblO.length && M.h(m,j)===1) return 'formil';
    if(dblO.length){
      var r = M.cNbrs(m,j).filter(function(x){ return x.j!==ringAtom; });
      if(r.length && branchAtoms(m,j,r[0].j).length===1) return 'acetil';
      return 'acil';
    }
    var ramo = branchAtoms(m, ringAtom, j);
    var cls = ramo.filter(function(i){ return m.atoms[i].el==='C'; });
    var halos = ramo.filter(function(i){ return HALO[m.atoms[i].el]; });
    if(cls.length===1 && halos.length===3) return 'triclorometil';   // –CCl₃, meta-dirigente
    return radicalName(m, j, ringAtom);
  }
  return '?';
}

function nameAromatic(m, ring){
  var subs = [];
  ring.forEach(function(c){
    M.nbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      subs.push({ at:c, j:x.j, pref:aromaticSubPrefix(m, c, x.j) });
    });
  });

  // Função principal fora do anel: o nome aromático consagrado só vale se o
  // grupo estiver COLADO no anel (ácido benzoico, benzaldeído, acetofenona).
  // Se estiver a um carbono de distância, o anel vira substituinte "fenil"
  // e quem manda é a cadeia (ex.: ácido fenil-etanoico, fenilmetanol).
  var CONSAGRADOS = ['carboxi','formil','acetil','acil','sulfo','hidroxi','amino','ciano','carbalcoxi'];
  var gs = groupsOf(m);
  for(var s=0;s<SUFFIX_ORDER.length;s++){
    var g = firstOf(gs, SUFFIX_ORDER[s]);
    if(!g) continue;
    if(ring.indexOf(g.atoms[0])>=0) break;
    var coberto = subs.some(function(sb){
      return CONSAGRADOS.indexOf(sb.pref)>=0 && branchAtoms(m, sb.at, sb.j).indexOf(g.atoms[0])>=0;
    });
    if(coberto) break;
    if(SUFFIX_ORDER[s]==='ester') return nameEster(m, g);
    return nameAcyclic(m, { blocked:ring });
  }
  if(!subs.length) return 'benzeno';

  if(subs.length===1){
    var p = subs[0].pref;
    if(AR_MONO[p]) return AR_MONO[p];
    return p + 'benzeno';
  }

  // distâncias no anel
  function dist(a,b){
    var ia = ring.indexOf(a), ib = ring.indexOf(b);
    var d = Math.abs(ia-ib);
    return Math.min(d, ring.length-d);
  }

  if(subs.length===2){
    var d = dist(subs[0].at, subs[1].at);
    var rel = d===1 ? 'o-' : (d===2 ? 'm-' : 'p-');
    // existe base consagrada?
    var baseIdx = -1, basePrio = 99;
    subs.forEach(function(s2, i){
      for(var k=0;k<AR_BASE.length;k++){
        if(AR_BASE[k].pref===s2.pref && k<basePrio){ basePrio = k; baseIdx = i; }
      }
    });
    if(baseIdx>=0){
      var other = subs[1-baseIdx];
      return rel + other.pref + AR_BASE[basePrio].nome;
    }
    var ps = subs.map(function(s3){ return s3.pref; }).sort(function(a,b){ return alphaKey(a).localeCompare(alphaKey(b)); });
    return rel + ps[0] + ps[1] + 'benzeno';
  }

  // 3 ou mais substituintes: numeração explícita
  var bestR = null, bestTxt = null;
  for(var st=0; st<ring.length; st++) for(var dir=-1; dir<=1; dir+=2){
    var ordem = [];
    for(var i=0;i<ring.length;i++) ordem.push(ring[(st + dir*i + ring.length*ring.length)%ring.length]);
    var pos = {}; ordem.forEach(function(c,i){ pos[c]=i+1; });
    var locs = subs.map(function(s4){ return pos[s4.at]; }).sort(function(a,b){return a-b;});
    if(bestR===null || cmpArr(locs,bestR)<0){ bestR = locs; bestTxt = pos; }
  }
  var grp = {};
  subs.forEach(function(s5){
    if(!grp[s5.pref]) grp[s5.pref] = [];
    grp[s5.pref].push(bestTxt[s5.at]);
  });
  var lst = Object.keys(grp).map(function(nome){
    var locs = grp[nome].sort(function(a,b){return a-b;});
    var mult = locs.length>1 ? MULT[locs.length] : '';
    return { key:alphaKey(nome), txt:locs.join(',')+'-'+mult+nome, minLoc:locs[0] };
  }).sort(function(a,b){ var c=a.key.localeCompare(b.key); return c?c:a.minLoc-b.minLoc; });
  return lst.map(function(x){ return x.txt; }).join('-') + 'benzeno';
}

/* ============================================================================
   Roteador
   ========================================================================== */
function iupacName(m){
  if(!m || !m.atoms.length) return '—';
  if(!M.connected(m)){
    return M.split(m).map(iupacName).join(' + ');
  }
  if(!M.carbons(m).length) return inorganicName(m);
  var ring = findRing(m);
  if(ring && isBenzeneRing(m, ring)) return nameAromatic(m, ring);
  if(ring) return nameCyclic(m, ring);
  return nameAcyclic(m);
}

function inorganicName(m){
  var f = formulaPlain(m);
  var t = { 'H2O':'água', 'CO2':'gás carbônico', 'H2':'gás hidrogênio', 'O2':'gás oxigênio' };
  return t[f] || f;
}

/* ============================================================================
   Fórmula condensada
   ========================================================================== */
function condensed(m){
  if(!m || !m.atoms.length) return '—';
  if(!M.connected(m)) return M.split(m).map(condensed).join('  +  ');
  var ring = findRing(m);
  if(ring && isBenzeneRing(m, ring)) return condensedAromatic(m, ring);
  if(ring) return condensedRing(m, ring);
  var paths = carbonPaths(m);
  if(!paths.length) return formula(m);
  var best = paths[0];
  paths.forEach(function(p){ if(p.length>best.length) best = p; });
  return chainCondensed(m, best);
}

function chainCondensed(m, path){
  var out = [];
  for(var i=0;i<path.length;i++){
    var c = path[i];
    var hs = M.h(m,c);
    var txt = 'C' + (hs>1 ? 'H'+sub(hs) : (hs===1?'H':''));
    var pend = [];
    M.nbrs(m,c).forEach(function(x){
      if(path.indexOf(x.j)>=0) return;
      pend.push(groupText(m, x.j, c, x.o));
    });
    if(pend.length){
      var dbls = pend.filter(function(p){ return p.indexOf('=')===0; });
      var others = pend.filter(function(p){ return p.indexOf('=')!==0; });
      txt += dbls.join('');
      if(others.length===1) txt += (others[0].length>2 ? '(' + others[0] + ')' : others[0]);
      else others.forEach(function(o){ txt += '(' + o + ')'; });
    }
    out.push(txt);
    if(i<path.length-1){
      var b = M.bond(m, path[i], path[i+1]);
      out.push(b.o===2 ? '=' : b.o===3 ? '≡' : '–');
    }
  }
  return out.join('');
}

function groupText(m, j, from, ord){
  var el = m.atoms[j].el;
  if(el==='O' && ord===2) return '=O';
  if(el==='O'){
    var o = M.nbrIdx(m,j).filter(function(k){ return k!==from; });
    if(!o.length) return 'OH';
    return 'O' + fragText(m, o[0], j);
  }
  if(el==='N' && ord===3) return '≡N';
  if(el==='N'){
    var rs = M.cNbrs(m,j).filter(function(k){ return k.j!==from; });
    if(!rs.length) return 'NH' + (M.h(m,j)>1 ? sub(M.h(m,j)) : '');
    return 'N' + (M.h(m,j)?'H':'') + rs.map(function(k){ return fragText(m,k.j,j); }).join('');
  }
  if(el==='NO2') return 'NO' + sub(2);
  if(el==='SO3H') return 'SO' + sub(3) + 'H';
  if(el==='C') return fragText(m, j, from);
  return el;
}

function fragText(m, j, from){
  var ring = findRing(m);
  if(ring && ring.indexOf(j)>=0 && isBenzeneRing(m,ring)) return 'C' + sub(6) + 'H' + sub(5);
  var ats = branchAtoms(m, from, j).filter(function(i){ return m.atoms[i].el==='C'; });
  var sub2 = cutSide(m, from, j, j);
  var pth = carbonPaths(sub2.mol);
  if(!pth.length) return 'CH' + sub(3);
  var best = pth[0];
  pth.forEach(function(p){ if(p.length>best.length) best = p; });
  if(best[0]!==sub2.map[j]) best = best.slice().reverse();
  if(best[0]!==sub2.map[j]){
    var alt = pth.filter(function(p){ return p[0]===sub2.map[j] || p[p.length-1]===sub2.map[j]; });
    if(alt.length){
      best = alt[0];
      alt.forEach(function(p){ if(p.length>best.length) best = p; });
      if(best[0]!==sub2.map[j]) best = best.slice().reverse();
    }
  }
  return chainCondensed(sub2.mol, best);
}

function condensedRing(m, ring){
  var n = ring.length;
  var subsTxt = [];
  ring.forEach(function(c){
    M.nbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      subsTxt.push(groupText(m, x.j, c, x.o));
    });
  });
  var base = 'ciclo-C' + sub(n) + 'H' + sub(2*n - subsTxt.length - countRingDbl(m,ring)*2);
  return base + (subsTxt.length ? '(' + subsTxt.join(')(') + ')' : '');
}
function countRingDbl(m, ring){
  var d = 0;
  for(var k=0;k<ring.length;k++){
    var b = M.bond(m, ring[k], ring[(k+1)%ring.length]);
    if(b && b.o===2) d++;
  }
  return d;
}
function condensedAromatic(m, ring){
  var subsTxt = [];
  ring.forEach(function(c){
    M.nbrs(m,c).forEach(function(x){
      if(ring.indexOf(x.j)>=0) return;
      subsTxt.push(groupText(m, x.j, c, x.o));
    });
  });
  if(!subsTxt.length) return 'C' + sub(6) + 'H' + sub(6);
  if(subsTxt.length===1) return 'C' + sub(6) + 'H' + sub(5) + '–' + subsTxt[0].replace(/^=/,'');
  return 'C' + sub(6) + 'H' + sub(6-subsTxt.length) + subsTxt.map(function(s){ return '(' + s + ')'; }).join('');
}

/* ============================================================================
   Leitura de respostas do jogador (tolerante a formato)
   Estratégia: compara "assinatura" = letras (sem acento/pontuação) + dígitos
   ordenados. Assim "but-2-eno" e "2-buteno" batem; "propan-2-ol" e
   "2-propanol" também. Nomes comuns e variantes entram numa lista extra.
   ========================================================================== */
function normName(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\b(cis|trans|[ez])\b/g,'')
    .replace(/ciclo-?hex/g,'cicloex')
    .replace(/\b(tert|t)-butil/g,'terc-butil')
    .replace(/\s+/g,' ').trim();
}
function nameSignature(s){
  var t = normName(s);
  var letras = t.replace(/[^a-z]/g,'');
  var nums = (t.match(/\d/g)||[]).sort().join('');
  return letras + '|' + nums;
}

var COMUNS = {
  'propanona':['acetona','dimetilcetona','propan-2-ona'],
  'etanal':['acetaldeido','aldeido acetico'],
  'metanal':['formaldeido','aldeido formico'],
  'ácido etanoico':['acido acetico','ácido acético'],
  'ácido metanoico':['acido formico'],
  'etino':['acetileno'],
  'eteno':['etileno'],
  'propeno':['propileno'],
  'etoxietano':['eter dietilico','eter etilico','dietil eter'],
  'metoximetano':['eter dimetilico','eter metilico'],
  'etanoato de etila':['acetato de etila'],
  'etanoato de metila':['acetato de metila'],
  'metanol':['alcool metilico'],
  'etanol':['alcool etilico'],
  'propan-2-ol':['alcool isopropilico','isopropanol'],
  'propan-1-ol':['alcool propilico'],
  '2-metilpropan-2-ol':['alcool terc-butilico','terc-butanol'],
  'triclorometano':['cloroformio'],
  'tetraclorometano':['tetracloreto de carbono'],
  'buta-1,3-dieno':['butadieno','1,3-butadieno'],
  'benzeno':['benzol'],
  'tolueno':['metilbenzeno','toluol'],
  'fenol':['hidroxibenzeno','benzenol'],
  'anilina':['aminobenzeno','fenilamina'],
  'estireno':['vinilbenzeno','feniletileno'],
  'ciclo-hexano':['cicloexano','ciclohexano'],
  'etanamida':['acetamida'],
  'etanonitrila':['acetonitrila','cianeto de metila'],
  'ácido benzoico':['acido benzoico'],
  'propanal':['aldeido propionico'],
  'ácido propanoico':['acido propionico'],
  'butanona':['metil etil cetona','butan-2-ona','2-butanona'],
  'glicerol':['glicerina','propano-1,2,3-triol']
};

// Gera formas alternativas a partir do nome canônico (formato antigo, com/sem localizador)
function nameVariants(nome){
  var out = [nome];
  var n = nome;
  // "butan-2-ol" → "2-butanol"; "but-2-eno" → "2-buteno"
  var m1 = n.match(/^(.*?)([a-zà-ú]+)-(\d+)-(ol|ona|amina|al|oico|en|in)(.*)$/);
  if(m1){
    out.push((m1[1]? m1[1]:'') + m1[3] + '-' + m1[2] + m1[4] + m1[5]);
  }
  var m2 = n.match(/^(.*?)([a-zà-ú]+)-(\d+)-(en|in)(.*)$/);
  if(m2) out.push((m2[1]||'') + m2[3] + '-' + m2[2] + m2[4] + m2[5]);
  // sem localizador
  out.push(n.replace(/-(\d+)-(ol|ona|amina|en|in)/g, '$2'));
  // com localizador implícito para cetona/álcool de posição única
  if(/anona$/.test(n)) out.push(n.replace(/anona$/,'an-2-ona'));
  if(/^(o|m|p)-/.test(n)){
    var tab = { 'o-':['orto-','1,2-','2-'], 'm-':['meta-','1,3-','3-'], 'p-':['para-','1,4-','4-'] };
    var pre = n.slice(0,2);
    (tab[pre]||[]).forEach(function(alt){ out.push(alt + n.slice(2)); });
  }
  (COMUNS[nome]||[]).forEach(function(c){ out.push(c); });
  return out;
}

function acceptedNames(m){
  var canon = iupacName(m);
  var set = {}, out = [];
  nameVariants(canon).forEach(function(v){
    [v, normName(v), nameSignature(v)].forEach(function(k){ if(!set[k]){ set[k]=1; } });
    out.push(v);
  });
  return { canon:canon, lista:out };
}

function nameMatches(input, m){
  if(!input || !input.trim()) return false;
  var acc = acceptedNames(m);
  var sigIn = nameSignature(input), normIn = normName(input);
  for(var i=0;i<acc.lista.length;i++){
    if(nameSignature(acc.lista[i])===sigIn) return true;
    if(normName(acc.lista[i])===normIn) return true;
  }
  // último recurso: o jogador pode ter usado um nome comum registrado para outro canônico
  var keys = Object.keys(COMUNS);
  for(var k=0;k<keys.length;k++){
    if(COMUNS[keys[k]].some(function(c){ return normName(c)===normIn; })){
      if(nameSignature(keys[k])===nameSignature(acc.canon)) return true;
    }
  }
  return false;
}
/* ============================================================================
   3. DESENHO — layout 2D e SVG
   Layout: anel em polígono regular; cadeia principal em zigue-zague de 120°;
   o resto por BFS escolhendo, entre 12 direções, a mais afastada do que já
   foi desenhado. Rótulos mostram o carbono com seus hidrogênios (CH3, CH2...),
   que é a fórmula estrutural plana usada no ensino médio.
   ========================================================================== */

var BOND = 46;

function layoutMol(m){
  var comps = componentsWithMap(m);
  var pos = new Array(m.atoms.length);
  var offX = 0;
  comps.forEach(function(comp){
    var local = layoutOne(m, comp);
    var minx = Infinity, maxx = -Infinity;
    comp.forEach(function(i){ minx = Math.min(minx, local[i].x); maxx = Math.max(maxx, local[i].x); });
    comp.forEach(function(i){ pos[i] = { x: local[i].x - minx + offX, y: local[i].y }; });
    offX += (maxx - minx) + BOND*2.2;
  });
  return pos;
}

function componentsWithMap(m){
  var seen = {}, out = [];
  for(var s=0;s<m.atoms.length;s++){
    if(seen[s]) continue;
    var grp = [], st = [s]; seen[s] = 1;
    while(st.length){
      var i = st.pop(); grp.push(i);
      M.nbrIdx(m,i).forEach(function(j){ if(!seen[j]){ seen[j]=1; st.push(j); } });
    }
    out.push(grp.sort(function(a,b){ return a-b; }));
  }
  return out;
}

function layoutOne(m, comp){
  var pos = {};
  var sub = {}; comp.forEach(function(i){ sub[i] = 1; });
  var ring = findRing(m);
  if(ring && !sub[ring[0]]) ring = null;
  var queue = [];

  if(ring){
    var n = ring.length;
    var R = BOND / (2*Math.sin(Math.PI/n));
    ring.forEach(function(a,i){
      var ang = -Math.PI/2 + i*2*Math.PI/n;
      pos[a] = { x:R*Math.cos(ang), y:R*Math.sin(ang), out:ang };
    });
    queue = ring.slice();
  } else {
    // cadeia de carbono mais longa deste componente
    var paths = carbonPaths(m).filter(function(p){ return sub[p[0]]; });
    var path = null;
    paths.forEach(function(p){ if(!path || p.length>path.length) path = p; });
    if(!path) path = [comp[0]];
    var dx = BOND*Math.cos(Math.PI/6), dy = BOND*Math.sin(Math.PI/6);
    path.forEach(function(a,i){ pos[a] = { x:i*dx, y:(i%2 ? dy : 0) }; });
    queue = path.slice();
  }

  // BFS para o restante
  var guard = 0;
  while(queue.length && guard++ < 500){
    var i = queue.shift();
    var rest = M.nbrIdx(m,i).filter(function(j){ return sub[j] && !pos[j]; });
    if(!rest.length) continue;
    rest.forEach(function(j){
      var best = null, bestScore = -Infinity;
      for(var k=0;k<12;k++){
        var ang = k*Math.PI/6;
        var cand = { x:pos[i].x + BOND*Math.cos(ang), y:pos[i].y + BOND*Math.sin(ang) };
        var score = 0, minD = Infinity;
        Object.keys(pos).forEach(function(p){
          var d = Math.hypot(pos[p].x-cand.x, pos[p].y-cand.y);
          minD = Math.min(minD, d);
        });
        score = minD;
        // no anel, prefere sair radialmente
        if(ring && ring.indexOf(i)>=0){
          var rad = Math.atan2(pos[i].y, pos[i].x);
          var diff = Math.abs(normAng(ang - rad));
          score += (Math.PI - diff)*18;
        }
        if(score > bestScore){ bestScore = score; best = cand; }
      }
      pos[j] = best;
      queue.push(j);
    });
  }
  comp.forEach(function(i){ if(!pos[i]) pos[i] = { x:rnd(40), y:rnd(40) }; });
  return pos;
}
function normAng(a){
  while(a > Math.PI) a -= 2*Math.PI;
  while(a < -Math.PI) a += 2*Math.PI;
  return a;
}

// Texto do rótulo do átomo, com os H antes ou depois conforme o lado livre
function labelText(m, i, right){
  var el = m.atoms[i].el, h = M.h(m,i);
  if(el==='NO2') return right ? 'NO₂' : 'O₂N';
  if(el==='SO3H') return right ? 'SO₃H' : 'HO₃S';
  if(h===0) return el;
  var hs = 'H' + (h>1 ? subChar(h) : '');
  return right ? (el+hs) : (hs+el);
}
function subChar(n){
  var map = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
  return String(n).split('').map(function(c){ return map[c]||c; }).join('');
}

var ATOM_COLOR = { C:'#e7ebf2', O:'#fb7185', N:'#7dd3fc', S:'#fbbf24',
                   F:'#4ade80', Cl:'#4ade80', Br:'#c084fc', I:'#f472b6',
                   NO2:'#7dd3fc', SO3H:'#fbbf24' };

/* ---- SVG ---- */
function molSVG(m, o){
  o = o || {};
  if(!m || !m.atoms.length){
    return '<svg viewBox="0 0 200 80"><text x="100" y="45" text-anchor="middle" fill="#6c7a8e" font-size="14">molécula vazia</text></svg>';
  }
  var pos = layoutMol(m);
  var hl = o.highlight || [];
  var hl2 = o.highlight2 || [];
  var dim = o.dim || [];
  var showIdx = o.numbers || null;   // { índice do átomo: rótulo a escrever por cima }

  // direção do rótulo (H à direita ou à esquerda)
  var right = {};
  for(var i=0;i<m.atoms.length;i++){
    var nb = M.nbrIdx(m,i);
    if(!nb.length){ right[i] = true; continue; }
    var mx = 0;
    nb.forEach(function(j){ mx += pos[j].x - pos[i].x; });
    right[i] = mx <= 0;
  }

  var minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
  pos.forEach(function(p){
    minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x);
    miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y);
  });
  var pad = 40;
  var W = (maxx-minx) + pad*2, H = (maxy-miny) + pad*2;
  var ox = -minx + pad, oy = -miny + pad;
  var X = function(i){ return (pos[i].x + ox); };
  var Y = function(i){ return (pos[i].y + oy); };

  var s = [];
  s.push('<svg viewBox="0 0 '+r2(W)+' '+r2(H)+'" preserveAspectRatio="xMidYMid meet" style="max-height:'+(o.maxH||260)+'px" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">');

  // ligações
  m.bonds.forEach(function(b){
    var x1 = X(b.a), y1 = Y(b.a), x2 = X(b.b), y2 = Y(b.b);
    var dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy) || 1;
    var ux = dx/L, uy = dy/L;
    var r1 = labelRadius(m, b.a), rr2 = labelRadius(m, b.b);
    var ax = x1 + ux*r1, ay = y1 + uy*r1;
    var bx = x2 - ux*rr2, by = y2 - uy*rr2;
    var px = -uy, py = ux;
    var faded = dim.indexOf(b.a)>=0 || dim.indexOf(b.b)>=0;
    var hot = hl.indexOf(b.a)>=0 && hl.indexOf(b.b)>=0;
    var col = hot ? '#5eead4' : (faded ? '#3a4656' : '#aeb8c6');
    var wdt = hot ? 2.6 : 1.9;
    if(b.o===1){
      s.push(line(ax,ay,bx,by,col,wdt));
    } else if(b.o===2){
      var d = 3.4;
      s.push(line(ax+px*d,ay+py*d,bx+px*d,by+py*d,col,wdt));
      s.push(line(ax-px*d,ay-py*d,bx-px*d,by-py*d,col,wdt));
    } else {
      var d3 = 4.4;
      s.push(line(ax,ay,bx,by,col,wdt));
      s.push(line(ax+px*d3,ay+py*d3,bx+px*d3,by+py*d3,col,wdt));
      s.push(line(ax-px*d3,ay-py*d3,bx-px*d3,by-py*d3,col,wdt));
    }
  });

  // átomos
  for(var i2=0;i2<m.atoms.length;i2++){
    var txt = labelText(m, i2, right[i2]);
    var col = ATOM_COLOR[m.atoms[i2].el] || '#e7ebf2';
    if(dim.indexOf(i2)>=0) col = '#4c5769';
    var isHl = hl.indexOf(i2)>=0, isHl2 = hl2.indexOf(i2)>=0;
    var fs = 16;
    var wid = txt.length*8.2 + 6;
    if(isHl || isHl2){
      s.push('<rect x="'+r2(X(i2)-wid/2)+'" y="'+r2(Y(i2)-12)+'" width="'+r2(wid)+'" height="24" rx="6" fill="'+
             (isHl?'rgba(94,234,212,.18)':'rgba(251,191,36,.18)')+'" stroke="'+(isHl?'#5eead4':'#fbbf24')+'" stroke-width="1.2"/>');
    }
    s.push('<text class="atomhit" data-atom="'+i2+'" x="'+r2(X(i2))+'" y="'+r2(Y(i2)+5.5)+'" text-anchor="middle" font-size="'+fs+'" font-weight="600" fill="'+col+'">'+txt+'</text>');
    if(showIdx && showIdx[i2]!==undefined && showIdx[i2]!==null){
      s.push('<text x="'+r2(X(i2))+'" y="'+r2(Y(i2)-15)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5eead4">'+esc(showIdx[i2])+'</text>');
    }
    // área de clique maior (dedo no celular)
    if(o.click){
      s.push('<circle class="atomhit" data-atom="'+i2+'" cx="'+r2(X(i2))+'" cy="'+r2(Y(i2))+'" r="17" fill="transparent"/>');
    }
  }
  s.push('</svg>');
  return s.join('');
}
function r2(v){ return Math.round(v*10)/10; }
function line(x1,y1,x2,y2,col,w){
  return '<line x1="'+r2(x1)+'" y1="'+r2(y1)+'" x2="'+r2(x2)+'" y2="'+r2(y2)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';
}
function labelRadius(m, i){
  var t = labelText(m, i, true);
  return 7 + t.length*3.4;
}

/* ---- caixa pronta com legenda ---- */
function molCard(m, o){
  o = o || {};
  var cap = o.cap ? '<div class="molcap">'+esc(o.cap)+'</div>' : '';
  return '<div class="molbox'+(o.click?' clickable':'')+'"'+(o.id?' id="'+o.id+'"':'')+'>'+cap+molSVG(m,o)+'</div>';
}
/* ============================================================================
   4. MOTOR DE REAÇÕES
   Cada regra é um objeto:
     { id, nome, reagente, condicao, classes[], grupo,
       aplica(m)      → true se a molécula atende ao requisito estrutural
       run(m)         → { produtos:[{mol|texto, papel, rot}], regra, porque,
                          mecanismo, passos[], distratores[] } }
   "papel" é 'principal', 'secundário' ou 'subproduto'.
