    b.onclick = function(){ FUN.aba = b.getAttribute('data-fa'); telaFuncoes(); };
  });

  var descs = {
    reconhecer:'Olhe a estrutura e diga que função é. É o passo que decide todo o resto.',
    classificar:'Álcool e haleto se classificam pelo carbono que segura o grupo; amina, por quantos carbonos estão no nitrogênio.',
    achar:'Toque no átomo do grupo funcional. Serve para treinar o olho antes da prova.',
    pares:'As trocas mais comuns: aldeído com cetona, ácido com éster, álcool com éter, amina com amida.',
    grupos:'A associação que precisa estar na ponta da língua: grupo, função e sufixo.',
    tabela:'Referência completa. Fica aqui sempre que precisar consultar.'
  };
  $('funDesc').textContent = descs[FUN.aba] || '';

  if(FUN.aba==='tabela') return tabelaFuncoes();
  if(FUN.aba==='achar') return acharGrupoNovo();
  questaoDeFuncoes();
}

function questaoDeFuncoes(){
  var q;
  switch(FUN.aba){
    case 'classificar': q = questaoClassificarFuncao(4); break;
    case 'pares': q = questaoPares(4); break;
    case 'grupos': q = questaoGrupo(4); break;
    default: q = questaoFuncao(5);
  }
  renderQuestao(q, $('funArea'), {
    textoProximo:'Próxima',
    aoResponder:function(acertou){
      FUN.total++;
      if(acertou) FUN.acertos++;
    },
    aoProximo:function(){ telaFuncoes(); }
  });
}

/* ---- achar o grupo funcional tocando na estrutura ---- */
var GRUPO_ROTULO = {
  alcool:'álcool', fenol:'fenol', eter:'éter', aldeido:'aldeído', cetona:'cetona',
  acido:'ácido carboxílico', ester:'éster', amina:'amina', amida:'amida',
  nitrila:'nitrila', nitro:'nitrocomposto', haleto:'haleto orgânico',
  alceno:'alceno', alcino:'alcino', aromatico:'aromático'
};

function acharGrupoNovo(){
  var m = null, g = null;
  for(var t=0;t<60 && !g;t++){
    m = Math.random()<0.45 ? doBanco().mol : gerarMolecula(5 + rnd(2));
    var cands = groupsOf(m).filter(function(x){ return GRUPO_ROTULO[x.tipo] && x.atoms.length; });
    if(cands.length) g = cands[0];
  }
  if(!g){ m = smiles('CCC(O)C'); g = groupsOf(m)[0]; }
  FUN.alvo = { mol:m, grupo:g, respondido:false };
  pintarAcharGrupo();
}

function pintarAcharGrupo(){
  var a = FUN.alvo, m = a.mol, g = a.grupo;
  var rot = GRUPO_ROTULO[g.tipo] || g.rotulo;
  var html = '<div class="card">' +
    '<h3>Toque no átomo do grupo que caracteriza <span class="hl">'+esc(rot)+'</span> nesta molécula</h3>' +
    '<div id="agMol"></div>' +
    '<div id="agFb"></div>' +
    '<div class="btnrow" style="margin-top:10px">' +
      '<button class="btn sm gh" id="agDica">Dica</button>' +
      '<button class="btn '+(a.respondido?'pri':'gh')+'" id="agProx">Outra molécula</button>' +
      '<span style="flex:1"></span><span class="chip">'+esc(iupacName(m))+'</span>' +
    '</div></div>';
  $('funArea').innerHTML = html;

  $('agMol').innerHTML = '<div class="molbox clickable">' +
    molSVG(m, { click:true, maxH:250, highlight:a.respondido ? g.atoms : [] }) + '</div>';
  qsa('#agMol .atomhit').forEach(function(el){
    el.onclick = function(){ tocouAtomo(parseInt(el.getAttribute('data-atom'),10)); };
  });
  $('agProx').onclick = acharGrupoNovo;
  $('agDica').onclick = function(){
    var info = funcInfo(rot);
    $('agFb').innerHTML = '<div class="fb tip"><b>Dica</b>' +
      esc(info ? info.dica : 'Procure o heteroátomo — oxigênio, nitrogênio ou halogênio.') + '</div>';
  };
}

function tocouAtomo(i){
  var a = FUN.alvo;
  if(a.respondido) return;
  var m = a.mol, g = a.grupo;
  var certo = g.atoms.indexOf(i) >= 0;
  a.respondido = true;
  FUN.total++;
  if(certo) FUN.acertos++;
  registrarTopico('acharGrupo', certo);
  if(certo) darXP(10);

  var rot = GRUPO_ROTULO[g.tipo] || g.rotulo;
  var info = funcInfo(rot);
  var oQueE = descreverAtomo(m, i);
  var html = '<div class="fb '+(certo?'ok':'no')+'">' +
    '<b>'+(certo ? 'Isso · +10 XP' : 'Não é esse átomo')+'</b>' +
    '<div class="why">' +
      (certo ? '' : 'Você tocou em '+esc(oQueE)+'.<br>') +
      'O grupo do(a) <b>'+esc(rot)+'</b> está destacado: ' + esc(info ? info.grupo : g.rotulo) + '.' +
      (info ? '<br>'+esc(info.dica) : '') +
    '</div></div>';
  $('agFb').innerHTML = html;
  pintarAcharGrupoDestacado();
}

function pintarAcharGrupoDestacado(){
  var a = FUN.alvo;
  var fb = $('agFb').innerHTML;
  pintarAcharGrupo();
  $('agFb').innerHTML = fb;
}

function descreverAtomo(m, i){
  var el = m.atoms[i].el;
  if(el==='C'){
    var cls = carbonClass(m,i);
    return 'um carbono ' + (cls ? carbonClassName(cls) : 'isolado') + ' com ' + M.h(m,i) + ' hidrogênio(s)';
  }
  if(el==='O') return M.h(m,i)===1 ? 'um oxigênio com hidrogênio (OH)' : 'um oxigênio sem hidrogênio';
  if(el==='N') return 'um nitrogênio';
  if(el==='NO2') return 'o grupo nitro';
  if(HALO[el]) return 'um halogênio (' + el + ')';
  return 'o átomo ' + el;
}

function renderQuestao(q, el, opts){
  opts = opts || {};
  var estado = { dicas:0, respondido:false, escolha:-1 };

  function pintar(){
    var html = '<div class="card">';
    if(opts.cabecalho) html += opts.cabecalho;
    html += '<h3 style="margin-bottom:10px">'+q.enunciado+'</h3>';

    // corpo visual
    if(q.etapas){
      html += '<div class="rxnline">' +
        '<div class="item">'+molCard(q.mol,{maxH:150})+'<div class="tiny center">'+esc(iupacName(q.mol))+'</div></div>';
      q.etapas.forEach(function(e,i){
        html += '<div class="arrow"><b>'+esc(e.cond)+'</b>etapa '+(i+1)+'<span class="head"></span></div>' +
                (i<q.etapas.length-1 ? '<div class="item center" style="font-size:26px;color:#6c7a8e">?</div>' : '');
      });
      html += '<div class="item center" style="font-size:34px;color:#6c7a8e">?</div></div>';
    }
    else if(q.produtosMostrar){
      html += '<div class="rxnline">' +
        '<div class="item center" style="font-size:34px;color:#6c7a8e">?</div>' +
        '<div class="arrow"><b>'+esc(q.reacao.reagente)+'</b>'+esc(q.reacao.condicao)+'<span class="head"></span></div>';
      q.produtosMostrar.forEach(function(p,i){
        html += (i?'<div class="center" style="font-size:20px;color:#6c7a8e">+</div>':'') +
          '<div class="item">'+molCard(p.mol,{maxH:150})+
          '<div class="tiny center" style="margin-top:4px">'+esc(produtoNome(p))+'</div></div>';
      });
      html += '</div>';
    }
    else if(q.equacao){
      html += blocoEquacao(q.mol, q.equacao.reagente, q.equacao.condicao, estado.dicas>=2 ? q.highlight : []);
    }
    else if(q.mol && !q.escondeMol){
      html += molCard(q.mol, { maxH:220, highlight:q.highlight||[] });
    }

    // dicas já reveladas
    if(estado.dicas>0){
      html += '<div class="fb tip"><b>Dica '+estado.dicas+' de 3</b>'+q.dicas[estado.dicas-1]+'</div>';
    }

    // resposta
    html += '<div style="margin-top:12px" id="areaResp">';
    if(q.tipo==='texto'){
      html += '<label class="fld"><span>Sua resposta</span>' +
        '<input type="text" id="respTxt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(q.placeholder||'')+'"></label>' +
        '<div class="tiny">Aceita formato novo e antigo (but-2-eno ou 2-buteno) e nomes comuns.</div>';
    } else {
      html += q.opcoes.map(function(o,i){
        var extra = '';
        if(o.mol) extra = '<div style="max-width:230px;margin-top:6px">'+molCard(o.mol,{maxH:110})+'</div>';
        return '<button class="opt" data-op="'+i+'"><span class="oi">'+String.fromCharCode(65+i)+'</span>'+esc(o.txt)+extra+'</button>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="btnrow" style="margin-top:10px">';
    if(!opts.semDicas) html += '<button class="btn sm gh" id="btnDica">Dica ('+(3-estado.dicas)+')</button>';
    html += '<button class="btn pri" id="btnResp">Responder</button>';
    if(opts.podePular) html += '<button class="btn sm gh" id="btnPular">Pular</button>';
    html += '<span style="flex:1"></span><span class="chip">'+esc(TOPICO_NOME[q.topico]||q.topico)+'</span>';
    if(q.revisao) html += '<span class="chip wa">revisão</span>';
    html += '</div><div id="fbArea"></div></div>';

    el.innerHTML = html;

    if($('btnDica')) $('btnDica').onclick = function(){
      if(estado.dicas>=3) return toast('As três dicas já foram usadas.');
      estado.dicas++; pintar();
      var inp = $('respTxt'); if(inp) inp.focus();
    };
    $('btnResp').onclick = responder;
    if($('btnPular')) $('btnPular').onclick = function(){ if(opts.aoProximo) opts.aoProximo(false); };
    qsa('[data-op]', el).forEach(function(b){
      b.onclick = function(){
        if(estado.respondido) return;
        estado.escolha = parseInt(b.getAttribute('data-op'),10);
        qsa('[data-op]', el).forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
    var inp = $('respTxt');
    if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') responder(); });
  }

  function responder(){
    if(estado.respondido){ if(opts.aoProximo) opts.aoProximo(estado.acertou); return; }
    var acertou = false, dadoTxt = '';
    if(q.tipo==='texto'){
      dadoTxt = ($('respTxt')||{}).value || '';
      if(!dadoTxt.trim()) return toast('Escreva uma resposta.');
      acertou = q.validar(dadoTxt);
    } else {
      if(estado.escolha<0) return toast('Escolha uma alternativa.');
      acertou = !!q.opcoes[estado.escolha].certa;
    }
    estado.respondido = true;
    estado.acertou = acertou;

    var ganho = acertou ? Math.max(3, q.xp - estado.dicas*3) : 0;
    registrarTopico(q.topico, acertou);
    if(acertou){
      darXP(ganho);
      acertouRevisao(q);
      marcarContadores(q, true);
    } else {
      paraRevisao(q);
    }
    checarConquistas();

    // marca as alternativas
    if(q.tipo!=='texto'){
      qsa('[data-op]', el).forEach(function(b,i){
        b.classList.remove('sel');
        if(q.opcoes[i].certa) b.classList.add('right');
        else if(i===estado.escolha) b.classList.add('wrong');
      });
    }
    if($('btnDica')) $('btnDica').disabled = true;
    $('btnResp').textContent = opts.textoProximo || 'Próxima';

    var fb = $('fbArea');
    var erroEscolha = (q.tipo!=='texto' && estado.escolha>=0) ? q.opcoes[estado.escolha].erro : null;
    var html = '<div class="fb '+(acertou?'ok':'no')+'">' +
      '<b>'+(acertou ? 'Certo' + (ganho?' · +'+ganho+' XP':'') : 'Ainda não')+'</b>';
    if(!acertou){
      if(q.tipo==='texto') html += '<div>Você escreveu <i>'+esc(dadoTxt)+'</i>. O certo é <b>'+esc(q.gabarito)+'</b>.</div>';
      if(erroEscolha) html += '<div class="why" style="margin-top:4px">'+esc(erroEscolha)+'</div>';
    }
    html += '<div class="why" style="margin-top:6px">'+q.explica+'</div></div>';
    fb.innerHTML = html;

    if(!acertou && q.resultado) animarProduto(fb, q);
    if(opts.aoResponder) opts.aoResponder(acertou, q);
    rolarPara(fb);
  }

  pintar();
  return estado;
}

function marcarContadores(q, acertou){
  if(!acertou) return;
  if(q.topico==='markovnikov' || (q.reacao && /markov|hidratacao|hidrohalog/.test(q.reacao.id))) contar('markov_ok');
  if(q.topico==='saytzeff' || (q.reacao && /desidrat|desidroalog/.test(q.reacao.id))) contar('saytzeff_ok');
  if(q.reacao && q.reacao.id==='hbr_peroxido') ganharConquista('kharasch');
  if(q.topico==='nome') contar('nome_ok');
  if(q.topico==='nox') contar('nox_ok');
  if(q.topico==='dirigencia') contar('dirigencia_ok');
  if(q.topico==='inverso') contar('inverso_ok');
}

/* ---- animação do produto correto, passo a passo ---- */
function animarProduto(container, q){
  var res = q.resultado;
  var certo = (q.opcoes||[]).filter(function(o){ return o.certa; })[0];
  if(!certo || !certo.mol) return;
  var alvo = res.alvo || [];
  var box = document.createElement('div');
  box.className = 'card';
  box.style.marginTop = '10px';
  box.innerHTML = '<h4>Como o produto se forma</h4><div id="animBox"></div>' +
    '<div class="btnrow" style="margin-top:8px"><button class="btn sm" id="animRe">Ver de novo</button></div>';
  container.appendChild(box);

  var quadros = [
    { mol:q.mol, hl:alvo, txt:'<b>1.</b> O ataque acontece aqui — nos átomos destacados.' },
    { mol:q.mol, hl:alvo, dim:[], txt:'<b>2.</b> '+esc(res.mecanismo || res.regra) },
    { mol:certo.mol, hl:novosAtomos(q.mol, certo.mol), txt:'<b>3.</b> Produto: <b>'+esc(iupacName(certo.mol))+'</b>' }
  ];
  var i = 0, timer = null;
  function passo(){
    var f = quadros[i];
    $('animBox').innerHTML = molCard(f.mol, { maxH:170, highlight:f.hl||[] }) +
      '<div class="sub" style="margin-top:6px">'+f.txt+'</div>';
    i++;
    if(i<quadros.length) timer = setTimeout(passo, 1700);
  }
  passo();
  $('animRe').onclick = function(){ clearTimeout(timer); i = 0; passo(); };
}
// átomos que existem no produto e não existiam no reagente (destaque da animação)
function novosAtomos(antes, depois){
  var out = [];
  for(var i=antes.atoms.length; i<depois.atoms.length; i++) out.push(i);
  return out.length ? out : [];
}

/* ============================================================================
   SESSÕES: prática, desafio, revisão
   ========================================================================== */
var SESSAO = null;

function iniciarSessao(cfg){
  var topicos = cfg.nivel ? cfg.nivel.topicos : null;
  SESSAO = {
    cfg:cfg, i:0, acertos:0,
    total: cfg.modo==='desafio' ? cfg.nivel.metaDesafio : (cfg.modo==='revisao' ? Math.min(6, S.revisao.length) : 8),
    topicos:topicos, erradas:[]
  };
  MODO_ATUAL = cfg.nivel ? 'nivel' : MODO_ATUAL;
  renderNav();
  proximaDaSessao();
}

function proximaDaSessao(){
  var s = SESSAO;
  if(!s) return;
  if(s.i >= s.total) return fimDaSessao();
  var q;
  if(s.cfg.modo==='revisao'){
    q = gerarQuestaoDeRevisao();
    if(!q) return fimDaSessao();
  } else {
    var nivelNum = s.cfg.nivel ? s.cfg.nivel.id : 3;
    var topico = pick(s.topicos || ['nome','funcao','nox','produto_adicao']);
    // 1 em cada 4 questões vem da fila de revisão, se houver
    if(S.revisao.length && s.cfg.modo==='pratica' && s.i>0 && s.i%4===0){
      var qr = gerarQuestaoDeRevisao();
      q = qr || gerarQuestao(topico, nivelNum);
    } else q = gerarQuestao(topico, nivelNum);
  }
  var titulo = s.cfg.modo==='desafio' ? 'Desafio' : (s.cfg.modo==='revisao' ? 'Revisão' : 'Prática');
  var cab = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">' +
    '<button class="btn sm gh" id="sairSessao">&larr; Sair</button>' +
    '<b>'+titulo+(s.cfg.nivel?' · '+esc(s.cfg.nivel.nome):'')+'</b>' +
    '<span style="flex:1"></span>' +
    '<span class="chip">'+(s.i+1)+' / '+s.total+'</span>' +
    '<span class="chip ok">'+s.acertos+' certas</span></div>' +
    '<div class="prog" style="margin-bottom:12px"><i style="width:'+Math.round(s.i/s.total*100)+'%"></i></div>';

  render('<div id="areaQ"></div>');
  renderQuestao(q, $('areaQ'), {
    cabecalho:cab,
    semDicas: s.cfg.modo==='desafio',
    aoResponder:function(acertou, qq){
      if(acertou) s.acertos++;
      else s.erradas.push(qq);
    },
    aoProximo:function(){ s.i++; proximaDaSessao(); }
  });
  $('sairSessao').onclick = function(){
    SESSAO = null;
    if(s.cfg.nivel) irPara('nivel', { id:s.cfg.nivel.id });
    else irPara('trilha');
  };
}

function fimDaSessao(){
  var s = SESSAO;
  if(!s) return;
  var pct = Math.round(s.acertos/Math.max(1,s.total)*100);
  var html = '<div class="card center">' +
    '<h2>'+(s.cfg.modo==='desafio' ? 'Desafio concluído' : (s.cfg.modo==='revisao' ? 'Revisão concluída' : 'Prática concluída'))+'</h2>' +
    '<div style="font-size:40px;font-weight:700;color:'+(pct>=70?'#4ade80':(pct>=40?'#fbbf24':'#fb7185'))+'">'+pct+'%</div>' +
    '<p class="sub">'+s.acertos+' de '+s.total+' questões</p>';

  if(s.cfg.nivel){
    var st = trilhaDe(s.cfg.nivel.id);
    if(s.cfg.modo==='pratica'){
      st.pratica += s.acertos;
      salvar();
      html += '<p>Progresso da prática: <b>'+Math.min(st.pratica, s.cfg.nivel.metaPratica)+'/'+s.cfg.nivel.metaPratica+'</b></p>';
    } else if(s.cfg.modo==='desafio'){
      st.melhorDesafio = Math.max(st.melhorDesafio, pct);
      st.estrelas = Math.max(st.estrelas, pct>=95?3:(pct>=85?2:(pct>=70?1:0)));
      if(pct>=70 && !st.concluido){
        st.concluido = true;
        html += '<div class="fb ok"><b>Nível concluído</b>O próximo nível da trilha está liberado.</div>';
        darXP(60, 'nível concluído');
      } else if(pct<70){
        html += '<div class="fb tip"><b>Faltou pouco</b>São necessários 70% para concluir. Revise os pontos abaixo e tente de novo.</div>';
      }
      salvar();
      checarConquistas();
    }
  }

  if(s.erradas.length){
    var contagem = {};
    s.erradas.forEach(function(q){ contagem[q.topico] = (contagem[q.topico]||0)+1; });
    html += '<div style="text-align:left;margin-top:12px"><h4>Onde escorregou</h4><div class="chips">' +
      Object.keys(contagem).map(function(t){
        return '<span class="chip no">'+esc(TOPICO_NOME[t]||t)+' · '+contagem[t]+'</span>';
      }).join('') + '</div>' +
      '<div class="tiny" style="margin-top:8px">Esses itens entraram na fila de revisão e vão voltar até você acertar 3 vezes.</div></div>';
  } else {
    html += '<div class="fb ok"><b>Sem erros</b>Nada novo entrou na fila de revisão.</div>';
  }

  html += '<div class="btnrow" style="margin-top:14px;justify-content:center">' +
    '<button class="btn" id="dnv">Fazer de novo</button>' +
    '<button class="btn pri" id="dvolta">Voltar</button></div></div>';

  render(html);
  $('dnv').onclick = function(){ iniciarSessao(s.cfg); };
  $('dvolta').onclick = function(){
    SESSAO = null;
    if(s.cfg.nivel) irPara('nivel', { id:s.cfg.nivel.id });
    else irPara('trilha');
  };
}

var ALE = { mol:null, topico:'nome', nivel:null };

function telaAleatoria(){
  if(!ALE.nivel) ALE.nivel = ultimoNivelLiberado() + 1;
  if(!ALE.mol) ALE.mol = gerarMolecula(ALE.nivel);
  var topicos = ['nome','funcao','classe','nox','quiral','teste','isomeros'];
  var html = '<div class="card">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
    '<h2 style="margin:0">Molécula aleatória</h2><span style="flex:1"></span>' +
    '<label class="tiny">nível <select id="selNivel" style="width:auto;display:inline-block;min-height:32px;padding:4px 8px">' +
      [1,2,3,4,5,6].map(function(n){ return '<option value="'+n+'"'+(n===ALE.nivel?' selected':'')+'>'+n+'</option>'; }).join('') +
    '</select></label>' +
    '<button class="btn sm" id="novaMol">Sortear outra</button></div>' +
    '<p class="sub" style="margin-top:6px">Escolha o que quer treinar nesta molécula. As respostas digitadas aceitam qualquer formato usual.</p>' +
    '<div class="chips" style="margin-top:8px" id="chipsTop">' +
    topicos.map(function(t){ return '<span class="chip'+(t===ALE.topico?' ac':'')+'" data-t="'+t+'">'+esc(TOPICO_NOME[t])+'</span>'; }).join('') +
    '</div></div><div id="areaQ"></div>';
  render(html);

  $('selNivel').onchange = function(){
    ALE.nivel = parseInt(this.value,10);
    ALE.mol = gerarMolecula(ALE.nivel);
    telaAleatoria();
  };
  $('novaMol').onclick = function(){ ALE.mol = gerarMolecula(ALE.nivel); telaAleatoria(); };
  qsa('[data-t]').forEach(function(c){
    c.onclick = function(){ ALE.topico = c.getAttribute('data-t'); telaAleatoria(); };
  });

  var q;
  switch(ALE.topico){
    case 'nome': q = questaoNome(ALE.nivel, ALE.mol); break;
    case 'funcao': q = questaoFuncao(ALE.nivel, ALE.mol); break;
    case 'classe': q = questaoClasse(ALE.nivel, ALE.mol); break;
    case 'nox': q = questaoNox(ALE.nivel, ALE.mol); break;
    default: q = gerarQuestao(ALE.topico, ALE.nivel); ALE.mol = q.mol;
  }
  renderQuestao(q, $('areaQ'), {
    textoProximo:'Outra molécula',
    aoProximo:function(){ ALE.mol = gerarMolecula(ALE.nivel); telaAleatoria(); }
  });
}

/* ============================================================================
   TELA: LABORATÓRIO DE REAÇÕES
   ========================================================================== */
var LAB = { mol:null, rx:null, opcaoX:'Br' };

function telaLaboratorio(args){
  if(args && args.mol) { LAB.mol = M.clone(args.mol); LAB.rx = args.rx || null; }
  if(!LAB.mol) LAB.mol = gerarMolecula(ultimoNivelLiberado()+1);
  var m = LAB.mol;
  var rs = reacoesAplicaveis(m);

  var html = '<div class="split">' +
    '<div><div class="card">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<h3 style="margin:0">Substrato</h3><span style="flex:1"></span>' +
        '<button class="btn sm" id="labNova">Sortear</button>' +
        '<button class="btn sm gh" id="labMontar">Montar no construtor</button>' +
      '</div>' +
      molCard(m, { maxH:200 }) +
      '<div class="molname" style="margin-top:8px">'+esc(iupacName(m))+'</div>' +
      '<div class="molform">'+formula(m)+'</div>' +
      '<div class="chips" style="margin-top:8px">' +
        functionLabels(m).map(function(f){ return '<span class="chip ac">'+esc(f)+'</span>'; }).join('') +
      '</div></div>' +

      '<div class="card" id="listaRx"><h3>Escolha o reagente e a condição</h3>';
  if(!rs.length) html += '<p class="sub">Esta molécula não sofre nenhuma das reações do programa. Sorteie outra.</p>';
  else {
    var porGrupo = {};
    rs.forEach(function(r){ (porGrupo[r.grupo] = porGrupo[r.grupo]||[]).push(r); });
    html += Object.keys(porGrupo).map(function(g){
      return '<h4 style="margin-top:10px;color:var(--ac2)">'+esc(g)+'</h4>' +
        porGrupo[g].map(function(r){
          return '<button class="opt" data-rx="'+r.id+'" style="margin-bottom:6px">' +
            '<b>'+esc(r.reagente)+'</b> <span class="tiny">· '+esc(r.condicao)+'</span>' +
            '<div class="tiny" style="margin-top:2px">'+esc(r.nome)+'</div></button>';
        }).join('');
    }).join('');
  }
  html += '</div></div><div id="areaPrev"><div class="card"><p class="sub">Escolha um reagente à esquerda para prever o produto.</p></div></div></div>';

  render(html);
  $('labNova').onclick = function(){ LAB.mol = gerarMolecula(ultimoNivelLiberado()+1); LAB.rx = null; telaLaboratorio(); };
  $('labMontar').onclick = function(){ irPara('construtor', { mol:LAB.mol }); };
  qsa('[data-rx]').forEach(function(b){
    b.onclick = function(){ prepararPrevisao(b.getAttribute('data-rx')); };
  });
  if(LAB.rx) prepararPrevisao(LAB.rx);
}

function prepararPrevisao(rxId){
  LAB.rx = rxId;
  var r = rxById(rxId), m = LAB.mol;
  var res = rodarReacao(rxId, m, { X:LAB.opcaoX });
  var area = $('areaPrev');
  if(!res || res.erro){ area.innerHTML = '<div class="card"><p class="sub">'+esc((res&&res.erro)||'Não foi possível aplicar.')+'</p></div>'; return; }

  var principais = res.produtos.filter(function(p){ return p.papel==='principal' && p.mol; });
  if(!principais.length){
    // produto textual (polimerização, combustão, álcool+Na…)
    area.innerHTML = '<div class="card"><h3>'+esc(r.nome)+'</h3>' +
      blocoEquacao(m, r.reagente, r.condicao, res.alvo||[], '') +
      '<div class="fb tip"><b>'+esc(res.regra)+'</b><div class="why">'+esc(res.porque).replace(/\n/g,'<br>')+'</div></div>' +
      res.produtos.map(function(p){ return '<div class="ex"><b>'+esc(p.papel)+':</b> '+esc(produtoNome(p))+'</div>'; }).join('') +
      (res.atencao ? '<div class="pega"><h4>Atenção</h4>'+esc(res.atencao)+'</div>' : '') +
      '</div>';
    return;
  }

  // Duas formas de responder: escolher entre 4 alternativas ou desenhar o produto.
  var q = questaoDeReacao(m, rxId, res, r);
  area.innerHTML = '<div class="card" style="margin-bottom:12px">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
    '<span class="sub">Prefere desenhar em vez de escolher?</span><span style="flex:1"></span>' +
    '<button class="btn sm" id="irMontar">Montar o produto no construtor</button></div></div>' +
    '<div id="areaQ"></div>';
  $('irMontar').onclick = function(){
    irPara('construtor', { desafio:{
      base:M.clone(m), mol:principais[0].mol, rxId:rxId,
      reagente:r.reagente, condicao:r.condicao, regra:res.regra, porque:res.porque
    }});
  };
  renderQuestao(q, $('areaQ'), {
    textoProximo:'Outra reação',
    aoProximo:function(){ telaLaboratorio(); }
  });
}

// Constrói uma questão de previsão a partir de uma reação já rodada
function questaoDeReacao(m, id, res, r){
  var certo = res.produtos.filter(function(p){ return p.papel==='principal' && p.mol; })[0].mol;
  var cands = [];
  (res.distratores||[]).forEach(function(d){ cands.push({ mol:d.mol, erro:d.erro }); });
  res.produtos.forEach(function(p){
    if(p.mol && p.papel==='secundário') cands.push({ mol:p.mol, erro:'Esse é o produto secundário — '+(p.nota||'minoritário')+'.' });
  });
  reacoesAplicaveis(m).forEach(function(o){
    if(o.id===id || cands.length>7) return;
    var x = rodarReacao(o.id, m);
    if(x && !x.erro && x.produtos) x.produtos.forEach(function(p){
      if(p.mol && p.papel==='principal') cands.push({ mol:p.mol, erro:'Esse seria o produto de outra condição: '+o.nome+'.' });
    });
  });
  var dist = distratoresMol(certo, shuffle(cands), 3);
  while(dist.length<3){
    var e = gerarMolecula(4);
    if(canonKey(e)!==canonKey(certo) && !dist.some(function(d){ return canonKey(d.mol)===canonKey(e); }))
      dist.push({ mol:e, erro:'Essa estrutura não pode se formar a partir deste reagente.' });
  }
  var ops = shuffle([{ mol:certo, certa:true, txt:iupacName(certo) }].concat(
    dist.slice(0,3).map(function(d){ return { mol:d.mol, certa:false, txt:iupacName(d.mol), erro:d.erro }; })));
  var outros = res.produtos.filter(function(p){ return !(p.papel==='principal' && p.mol===certo); })
                           .map(function(p){ return produtoNome(p); });
  return {
    topico:'produto_'+(r.grupo==='Adição'?'adicao':r.grupo==='Eliminação'?'eliminacao':r.grupo==='Substituição'?'substituicao':'oxidacao'),
    tipo:'escolha', mol:m, opcoes:ops, reacao:r, resultado:res, highlight:res.alvo||[],
    enunciado:'Qual é o <b>produto principal</b>?',
    equacao:{ reagente:r.reagente, condicao:r.condicao },
    explica:'<b>'+esc(res.regra)+'</b><br>'+esc(res.porque).replace(/\n/g,'<br>') +
            (res.mecanismo ? '<br><span class="tiny">Mecanismo: '+esc(res.mecanismo)+'</span>' : '') +
            (res.isomerosTexto ? '<br><span class="tiny">'+esc(res.isomerosTexto)+'</span>' : '') +
            (outros.length ? '<br><span class="tiny">Também se forma: '+esc(outros.join(' · '))+'</span>' : '') +
            (res.teste ? '<br><span class="tiny">'+esc(res.teste)+'</span>' : '') +
            (res.atencao ? '<div class="pega" style="margin-top:8px"><h4>Atenção</h4>'+esc(res.atencao)+'</div>' : ''),
    dicas:[
      'Reação de <b>'+r.grupo.toLowerCase()+'</b>. Regra em jogo: '+esc(res.regra)+'.',
      (res.alvo&&res.alvo.length) ? 'Olhe os carbonos destacados no reagente.' : 'Localize o grupo funcional que reage.',
      esc(String(res.porque).split('.')[0])+'.'
    ],
    xp:15
  };
}

/* ============================================================================
   TELA: LABORATÓRIO DE IDENTIFICAÇÃO
   Um frasco desconhecido entre 2 e 4 candidatos. Ganha mais XP quem usa
   menos testes.
   ========================================================================== */

var IDF = { cands:[], alvo:null, feitos:[], fim:false };

function sortearFrasco(){
  for(var t=0;t<120;t++){
    var n = 2 + rnd(3);                       // 2 a 4 candidatos
    var esc = shuffle(BANCO).slice(0,n).map(function(b){
      return { mol:smiles(b.sm), nome:b.n, fam:b.fam };
    });
    // todos precisam ser distinguíveis entre si por pelo menos um teste
    var ok = true;
    for(var i=0;i<esc.length && ok;i++) for(var j=i+1;j<esc.length && ok;j++){
      var separa = TESTES.some(function(x){ return x.ver(esc[i].mol).pos !== x.ver(esc[j].mol).pos; });
      if(!separa) ok = false;
    }
    if(!ok) continue;
    IDF = { cands:esc, alvo:rnd(esc.length), feitos:[], fim:false };
    return;
  }
  IDF = { cands:[{ mol:smiles('CCO'), nome:'etanol', fam:'álcool 1°' },
                 { mol:smiles('CC(=O)C'), nome:'propanona', fam:'cetona' }],
          alvo:rnd(2), feitos:[], fim:false };
}

function telaIdentificacao(){
  if(!IDF.cands.length) sortearFrasco();
  var alvoMol = IDF.cands[IDF.alvo].mol;

  var html = '<div class="card">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<h2 style="margin:0">Frasco desconhecido</h2><span style="flex:1"></span>' +
      '<span class="chip">'+IDF.feitos.length+' teste(s) usado(s)</span>' +
      '<button class="btn sm" id="novoFrasco">Novo frasco</button></div>' +
    '<p class="sub" style="margin-top:6px">Um líquido não identificado chegou na bancada. Use o <b>menor número de testes</b> para descobrir qual dos candidatos é.</p>' +
    '</div>';

  html += '<div class="split3"><div class="card" id="candidatos"><h3>Candidatos</h3>' +
    IDF.cands.map(function(c,i){
      var eliminado = IDF.feitos.some(function(f){
        var t = testeById(f.id);
        return t.ver(c.mol).pos !== f.pos;
      });
      return '<button class="opt" data-cand="'+i+'"'+(eliminado?' style="opacity:.42"':'')+'>' +
        '<b>'+esc(c.nome)+'</b><div class="tiny">'+esc(c.fam)+(eliminado?' · já eliminado pelos testes':'')+'</div></button>';
    }).join('') +
    '<div class="tiny" style="margin-top:6px">Toque no candidato para dar o veredito.</div></div>';

  html += '<div><div class="card" id="bancada"><h3>Bancada</h3>' +
    '<div class="flaskwrap">' + TESTES.map(function(t){
      var feito = IDF.feitos.filter(function(f){ return f.id===t.id; })[0];
      var r = feito ? t.ver(alvoMol) : null;
      var corpo;
      if(!feito){
        corpo = '<div class="tube"><i style="background:'+t.corInicial+'"></i></div>';
      } else if(t.id==='chama'){
        corpo = '<div class="flame'+(r.fuligem?' soot':'')+'"></div>';
      } else {
        corpo = '<div class="tube"><i style="background:'+r.cor+'"></i>'+
                (r.fizz?'<span class="fizz"></span><span class="fizz" style="left:38%;animation-delay:.4s"></span>':'')+
                (r.espelho?'<i style="height:100%;background:linear-gradient(90deg,rgba(229,231,235,.75),rgba(229,231,235,.15))"></i>':'')+
                '</div>';
      }
      return '<div class="flask-card"'+(feito?'':' data-teste="'+t.id+'" style="cursor:pointer"')+'>' +
        corpo +
        '<div style="font-weight:600;font-size:12.5px">'+esc(t.nome)+'</div>' +
        '<div class="tiny">'+esc(t.reagente)+'</div>' +
        (feito ? '<div class="chip '+(r.pos?'ok':'no')+'" style="margin-top:6px">'+(r.pos?'positivo':'negativo')+'</div>' +
                 '<div class="tiny" style="margin-top:4px">'+esc(r.obs)+'</div>' : '') +
        '</div>';
    }).join('') + '</div></div>';

  if(IDF.feitos.length){
    html += '<div class="card"><h3>O que cada resultado significa</h3>' +
      IDF.feitos.map(function(f){
        var t = testeById(f.id), r = t.ver(alvoMol);
        return '<div class="rulehit" style="padding:8px 0"><b>'+esc(t.nome)+'</b> — ' +
          '<span class="chip '+(r.pos?'ok':'no')+'">'+(r.pos?'positivo':'negativo')+'</span>' +
          '<div class="sub" style="margin-top:3px">'+esc(r.porque)+'</div></div>';
      }).join('') + '</div>';
  }
  html += '</div></div><div id="fimId"></div>';

  render(html);
  $('novoFrasco').onclick = function(){ sortearFrasco(); telaIdentificacao(); };
  qsa('[data-teste]').forEach(function(el){
    el.onclick = function(){
      if(IDF.fim) return;
      var id = el.getAttribute('data-teste');
      var t = testeById(id);
      IDF.feitos.push({ id:id, pos:t.ver(alvoMol).pos });
      telaIdentificacao();
    };
  });
  qsa('[data-cand]').forEach(function(el){
    el.onclick = function(){ if(!IDF.fim) veredito(parseInt(el.getAttribute('data-cand'),10)); };
  });
}

function veredito(i){
  var certo = i===IDF.alvo;
  var alvo = IDF.cands[IDF.alvo];
  IDF.fim = true;
  var n = IDF.feitos.length;
  var ganho = certo ? Math.max(6, 30 - n*5) : 0;
  registrarTopico('teste', certo);
  if(certo){
    darXP(ganho, n<=2 ? 'com só '+n+' teste(s)' : '');
    if(n<=2) ganharConquista('detetive');
    if(IDF.feitos.some(function(f){ return f.id==='tollens'; })) ganharConquista('espelho');
  }
  // qual teste teria resolvido de uma vez?
  var decisivo = null;
  TESTES.forEach(function(t){
    if(decisivo) return;
    var assinatura = IDF.cands.map(function(c){ return t.ver(c.mol).pos ? 1 : 0; });
    var doAlvo = assinatura[IDF.alvo];
    if(assinatura.filter(function(x){ return x===doAlvo; }).length===1) decisivo = t;
  });

  var html = '<div class="card">' +
    '<div class="fb '+(certo?'ok':'no')+'"><b>'+(certo?'Identificado corretamente'+(ganho?' · +'+ganho+' XP':''):'Não era esse')+'</b>' +
    '<div class="why">O frasco continha <b>'+esc(alvo.nome)+'</b> ('+esc(alvo.fam)+').</div></div>' +
    molCard(alvo.mol, { maxH:170 }) +
    '<div class="tiny center" style="margin-top:4px">'+esc(iupacName(alvo.mol))+' · '+formula(alvo.mol)+'</div>';

  html += '<div class="sep"></div><h4>Assinatura de cada candidato</h4><div class="tscroll"><table class="t"><tr><th>Teste</th>' +
    IDF.cands.map(function(c){ return '<th>'+esc(c.nome)+'</th>'; }).join('') + '</tr>' +
    TESTES.map(function(t){
      return '<tr><td>'+esc(t.nome)+'</td>' + IDF.cands.map(function(c){
        var p = t.ver(c.mol).pos;
        return '<td><span class="chip '+(p?'ok':'no')+'">'+(p?'+':'–')+'</span></td>';
      }).join('') + '</tr>';
    }).join('') + '</table></div>';

  if(decisivo) html += '<div class="fb tip"><b>Atalho</b>Um único teste resolveria: <b>'+esc(decisivo.nome)+'</b>. ' +
    esc(decisivo.ver(alvo.mol).porque)+'</div>';

  html += '<div class="btnrow" style="margin-top:12px"><button class="btn pri" id="outroFrasco">Novo frasco</button>' +
    '<button class="btn gh" id="voltaTrilha">Voltar à trilha</button></div></div>';

  $('fimId').innerHTML = html;
  $('outroFrasco').onclick = function(){ sortearFrasco(); telaIdentificacao(); };
  $('voltaTrilha').onclick = function(){ irPara('trilha'); };
  rolarPara($('fimId'), { behavior:'smooth', block:'start' });
}

/* ============================================================================
   TELA: SIMULADO "PROVA DIFÍCIL"
   ========================================================================== */
var SIM = null;
var SIM_TOPICOS = ['nome','nome_produto','produto_adicao','produto_eliminacao','produto_substituicao',
                   'produto_oxidacao','nox','dirigencia','isomeros','condicao','inverso','teste',
                   'sequencia','markovnikov','saytzeff','classe_funcao','pares'];

function telaSimulado(){
  if(SIM && !SIM.fim) return rodarSimulado();
  var html = '<div class="card">' +
    '<h2 style="margin-bottom:2px">Simulado — prova difícil</h2>' +
    '<p class="sub">Questões mistas de todo o conteúdo, com tempo e <b>sem dicas</b>. A correção detalhada vem no fim, com o diagnóstico dos seus pontos fracos.</p>' +
    '<div class="grid g2" style="margin-top:12px">' +
      '<label class="fld"><span>Número de questões</span>' +
        '<select id="simN"><option value="10">10 questões (10 min)</option>' +
        '<option value="12" selected>12 questões (12 min)</option>' +
        '<option value="15">15 questões (15 min)</option></select></label>' +
      '<label class="fld"><span>Nível das moléculas</span>' +
        '<select id="simNv"><option value="4">4 — intermediário</option>' +
        '<option value="5" selected>5 — avançado</option>' +
        '<option value="6">6 — integração</option></select></label>' +
    '</div>' +
    '<div class="fb tip"><b>Como funciona</b>Um minuto por questão, em média. O cronômetro é do simulado inteiro: se sobrar tempo numa questão, ele fica para a seguinte. Quando o tempo acabar, o que não foi respondido conta como erro.</div>' +
    '<button class="btn pri wide" id="simStart" style="margin-top:10px">Começar</button></div>';

  if(S.simulados.length){
    html += '<div class="card"><h3>Seus simulados</h3><div class="tscroll"><table class="t">' +
      '<tr><th>Data</th><th>Nota</th><th>%</th></tr>' +
      S.simulados.slice(-8).reverse().map(function(s){
        var p = Math.round(s.nota/s.total*100);
        return '<tr><td>'+new Date(s.data).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td>' +
               '<td>'+s.nota+'/'+s.total+'</td><td><span class="chip '+(p>=70?'ok':(p>=50?'wa':'no'))+'">'+p+'%</span></td></tr>';
      }).join('') + '</table></div></div>';
  }
  render(html);
  $('simStart').onclick = function(){
    var n = parseInt($('simN').value,10), nv = parseInt($('simNv').value,10);
    iniciarSimulado(n, nv);
  };
}

function iniciarSimulado(n, nivel){
  var qs2 = [];
  var pool = shuffle(SIM_TOPICOS);
  for(var i=0;i<n;i++){
    var t = pool[i % pool.length];
    var q;
    try { q = gerarQuestao(t, nivel); } catch(e){ q = questaoNome(nivel); }
    qs2.push(q);
  }
  SIM = { qs:qs2, i:0, respostas:new Array(n).fill(null), n:n, nivel:nivel,
          restante:n*60, fim:false, inicio:Date.now() };
  if(SIM.timer) clearInterval(SIM.timer);
  SIM.timer = setInterval(function(){
    if(!SIM || SIM.fim) return;
    SIM.restante--;
    var el = $('simTimer');
    if(el){
      el.textContent = fmtTempo(SIM.restante);
      el.className = 'timer' + (SIM.restante<60 ? ' low' : '');
    }
    if(SIM.restante<=0) encerrarSimulado();
  }, 1000);
  rodarSimulado();
}
function fmtTempo(s){
  s = Math.max(0,s);
  return Math.floor(s/60) + ':' + ('0'+(s%60)).slice(-2);
}

function rodarSimulado(){
  var s = SIM;
  if(!s || s.fim) return telaSimulado();
  if(s.i >= s.n) return encerrarSimulado();
  var q = s.qs[s.i];

  var html = '<div class="card">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
      '<b>Simulado</b><span class="chip">'+(s.i+1)+' / '+s.n+'</span>' +
      '<span style="flex:1"></span>' +
      '<span class="timer" id="simTimer">'+fmtTempo(s.restante)+'</span>' +
      '<button class="btn sm gh" id="simSair">Encerrar</button>' +
    '</div>' +
    '<div class="prog" style="margin-bottom:12px"><i style="width:'+Math.round(s.i/s.n*100)+'%"></i></div>' +
    '<h3 style="margin-bottom:10px">'+q.enunciado+'</h3>';

  if(q.etapas){
    html += '<div class="rxnline"><div class="item">'+molCard(q.mol,{maxH:140})+'</div>';
    q.etapas.forEach(function(e,i){
      html += '<div class="arrow"><b>'+esc(e.cond)+'</b>etapa '+(i+1)+'<span class="head"></span></div>' +
              (i<q.etapas.length-1?'<div class="item center" style="font-size:24px;color:#6c7a8e">?</div>':'');
    });
    html += '<div class="item center" style="font-size:30px;color:#6c7a8e">?</div></div>';
  } else if(q.produtosMostrar){
    html += '<div class="rxnline"><div class="item center" style="font-size:30px;color:#6c7a8e">?</div>' +
      '<div class="arrow"><b>'+esc(q.reacao.reagente)+'</b>'+esc(q.reacao.condicao)+'<span class="head"></span></div>' +
      q.produtosMostrar.map(function(p){
        return '<div class="item">'+molCard(p.mol,{maxH:140})+'<div class="tiny center">'+esc(produtoNome(p))+'</div></div>';
      }).join('<div class="center" style="font-size:18px;color:#6c7a8e">+</div>') + '</div>';
  } else if(q.equacao){
    html += blocoEquacao(q.mol, q.equacao.reagente, q.equacao.condicao, []);
  } else if(q.mol && !q.escondeMol){
    html += molCard(q.mol, { maxH:200, highlight:q.highlight||[] });
  }

  if(q.tipo==='texto'){
    html += '<label class="fld" style="margin-top:12px"><span>Sua resposta</span>' +
      '<input type="text" id="simTxt" autocomplete="off" spellcheck="false" placeholder="'+esc(q.placeholder||'')+'" value="'+esc(s.respostas[s.i]||'')+'"></label>';
  } else {
    html += '<div style="margin-top:12px">' + q.opcoes.map(function(o,i){
      var sel = s.respostas[s.i]===i ? ' sel' : '';
      var extra = o.mol ? '<div style="max-width:230px;margin-top:6px">'+molCard(o.mol,{maxH:105})+'</div>' : '';
      return '<button class="opt'+sel+'" data-op="'+i+'"><span class="oi">'+String.fromCharCode(65+i)+'</span>'+esc(o.txt)+extra+'</button>';
    }).join('') + '</div>';
  }

  html += '<div class="btnrow" style="margin-top:12px">' +
    (s.i>0 ? '<button class="btn sm gh" id="simAnt">Anterior</button>' : '') +
    '<button class="btn pri" id="simProx">'+(s.i===s.n-1?'Entregar':'Próxima')+'</button>' +
    '<span style="flex:1"></span><span class="tiny">respondidas: '+s.respostas.filter(function(x){ return x!==null && x!==''; }).length+'/'+s.n+'</span>' +
    '</div></div>';

  render(html);
  function guardar(){
    if(q.tipo==='texto') s.respostas[s.i] = ($('simTxt')||{}).value || '';
  }
  qsa('[data-op]').forEach(function(b){
    b.onclick = function(){
      s.respostas[s.i] = parseInt(b.getAttribute('data-op'),10);
      qsa('[data-op]').forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
    };
  });
  $('simProx').onclick = function(){ guardar(); s.i++; if(s.i>=s.n) encerrarSimulado(); else rodarSimulado(); };
  if($('simAnt')) $('simAnt').onclick = function(){ guardar(); s.i--; rodarSimulado(); };
  $('simSair').onclick = function(){
    guardar();
    modal('Encerrar o simulado?', '<p>As questões não respondidas contam como erro.</p>', [
      { txt:'Continuar' },
      { txt:'Encerrar', cls:'pri', fn:function(f){ f(); encerrarSimulado(); } }
    ]);
  };
  var inp = $('simTxt');
  if(inp) inp.addEventListener('input', function(){ s.respostas[s.i] = inp.value; });
}

function encerrarSimulado(){
  var s = SIM;
  if(!s || s.fim) return;
  s.fim = true;
  if(s.timer) clearInterval(s.timer);

  var acertos = 0, porTopico = {};
  s.qs.forEach(function(q,i){
    var r = s.respostas[i], ok;
    if(q.tipo==='texto') ok = !!(r && q.validar(r));
    else ok = (r!==null && q.opcoes[r] && q.opcoes[r].certa);
    q._ok = ok; q._resp = r;
    if(ok) acertos++;
    var t = q.topico;
    if(!porTopico[t]) porTopico[t] = { c:0, e:0 };
    porTopico[t][ok?'c':'e']++;
    registrarTopico(t, ok);
    if(!ok) paraRevisao(q);
    else { acertouRevisao(q); marcarContadores(q, true); }
  });
  var pct = Math.round(acertos/s.n*100);
  S.simulados.push({ data:Date.now(), nota:acertos, total:s.n });
  salvar();
  darXP(acertos*8 + (pct>=80?40:0), 'simulado');
  if(pct>=80) ganharConquista('aprovado');
  if(acertos===s.n) ganharConquista('gabarito');
  checarConquistas();

  var fracos = Object.keys(porTopico).filter(function(t){ return porTopico[t].e > 0; })
    .sort(function(a,b){ return porTopico[b].e - porTopico[a].e; });

  var html = '<div class="card center">' +
    '<h2>Resultado do simulado</h2>' +
    '<div style="font-size:46px;font-weight:700;color:'+(pct>=70?'#4ade80':(pct>=50?'#fbbf24':'#fb7185'))+'">'+pct+'%</div>' +
    '<p class="sub">'+acertos+' de '+s.n+' · tempo usado '+fmtTempo(s.n*60 - s.restante)+'</p></div>';

  html += '<div class="card"><h3>Diagnóstico</h3>';
  if(!fracos.length) html += '<div class="fb ok"><b>Sem pontos fracos neste simulado</b>Você acertou todos os tópicos sorteados.</div>';
  else {
    html += '<p class="sub">Comece por aqui — os tópicos estão em ordem de prioridade:</p>' +
      '<div class="tscroll"><table class="t"><tr><th>Tópico</th><th>Erros</th><th>O que revisar</th></tr>' +
      fracos.map(function(t){
        return '<tr><td>'+esc(TOPICO_NOME[t]||t)+'</td><td>'+porTopico[t].e+'</td>' +
               '<td><button class="btn sm" data-rev="'+esc(t)+'">Livro de regras</button></td></tr>';
      }).join('') + '</table></div>';
  }
  html += '</div>';

  html += '<div class="card"><h3>Correção detalhada</h3>' + s.qs.map(function(q,i){
    var respTxt;
    if(q.tipo==='texto') respTxt = q._resp ? esc(q._resp) : '<i>em branco</i>';
    else respTxt = (q._resp!==null && q.opcoes[q._resp]) ? esc(q.opcoes[q._resp].txt) : '<i>em branco</i>';
    var certaTxt = q.tipo==='texto' ? esc(q.gabarito) : esc((q.opcoes.filter(function(o){ return o.certa; })[0]||{}).txt);
    return '<div class="rulehit">' +
      '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">' +
        '<span class="chip '+(q._ok?'ok':'no')+'">'+(i+1)+(q._ok?' · certa':' · errada')+'</span>' +
        '<span class="tiny">'+esc(TOPICO_NOME[q.topico]||q.topico)+'</span></div>' +
      '<div style="margin-top:6px">'+q.enunciado+'</div>' +
      (q.mol && !q.escondeMol ? '<div style="max-width:280px;margin:6px 0">'+molCard(q.mol,{maxH:120,highlight:q.highlight||[]})+'</div>' : '') +
      '<div class="tiny">Sua resposta: '+respTxt+' · Correta: <b>'+certaTxt+'</b></div>' +
      '<div class="sub" style="margin-top:5px">'+q.explica+'</div></div>';
  }).join('') + '</div>';

  html += '<div class="btnrow" style="margin-top:12px;justify-content:center">' +
    '<button class="btn" id="simNovo">Outro simulado</button>' +
    '<button class="btn pri" id="simVolta">Voltar à trilha</button></div>';

  render(html);
  qsa('[data-rev]').forEach(function(b){
    b.onclick = function(){ irPara('livro'); setTimeout(function(){
      var busca = $('buscaLivro');
      if(busca){ busca.value = (TOPICO_NOME[b.getAttribute('data-rev')]||'').split(' ')[0]; busca.dispatchEvent(new Event('input')); }
    }, 120); };
  });
  $('simNovo').onclick = function(){ SIM = null; telaSimulado(); };
  $('simVolta').onclick = function(){ SIM = null; irPara('trilha'); };
}

/* ============================================================================
   10. AUTOTESTE (Ctrl+Shift+T)
   Casos mínimos pedidos + verificações extras de consistência do motor.
   ========================================================================== */
function rodarAutoteste(){
  var R = [];
  function t(nome, obtido, esperado){
    R.push({ nome:nome, ok:String(obtido)===String(esperado), obtido:String(obtido), esperado:String(esperado) });
  }
  function nome(sm){ try { return iupacName(smiles(sm)); } catch(e){ return 'ERRO: '+e.message; } }
  function prod(sm, id, papel, opt){
    try {
      var r = rodarReacao(id, smiles(sm), opt);
      if(!r || r.erro) return 'ERRO: '+((r&&r.erro)||'nulo');
      return r.produtos.filter(function(p){ return !papel || p.papel===papel; }).map(produtoNome).join(' + ');
    } catch(e){ return 'ERRO: '+e.message; }
  }

  // --- nomenclatura (casos mínimos exigidos)
  t('CH3–CH(CH3)–CH2–CH3', nome('CC(C)CC'), '2-metilbutano');
  t('CH3–CH=CH–CH3', nome('CC=CC'), 'but-2-eno');
  t('CH3–CH(OH)–CH3', nome('CC(O)C'), 'propan-2-ol');
  t('CH3–CO–CH2–CH3', nome('CC(=O)CC'), 'butanona');
  t('CH3–CH2–CHO', nome('CCC=O'), 'propanal');
  t('(CH3)3C–OH', nome('CC(C)(C)O'), '2-metilpropan-2-ol');
  t('CH3–COO–CH2–CH3', nome('CC(=O)OCC'), 'etanoato de etila');
  t('CH2=CH–CH2–Br', nome('C=CCBr'), '3-bromoprop-1-eno');
  // extras
  t('nome: ácido 3-metilbutanoico', nome('CC(C)CC(=O)O'), 'ácido 3-metilbutanoico');
  t('nome: buta-1,3-dieno', nome('C=CC=C'), 'buta-1,3-dieno');
  t('nome: etoxietano', nome('CCOCC'), 'etoxietano');
  t('nome: ciclo-hexano', nome('C1CCCCC1'), 'ciclo-hexano');
  t('nome: tolueno', nome('CC1=CC=CC=C1'), 'tolueno');
  t('nome: o-nitrotolueno', nome('CC1=CC=CC=C1{NO2}'), 'o-nitrotolueno');
  t('nome: glicerol', nome('OCC(O)CO'), 'propano-1,2,3-triol');
  t('nome: etanamida', nome('CC(N)=O'), 'etanamida');
  t('nome: 2-metilbut-2-eno', nome('CC(C)=CC'), '2-metilbut-2-eno');

  // --- leitura tolerante de respostas
  t('aceita "2-buteno"', nameMatches('2-buteno', smiles('CC=CC')), 'true');
  t('aceita "2-propanol"', nameMatches('2-propanol', smiles('CC(O)C')), 'true');
  t('aceita "acetona"', nameMatches('acetona', smiles('CC(=O)C')), 'true');
  t('recusa "but-1-eno" p/ but-2-eno', nameMatches('but-1-eno', smiles('CC=CC')), 'false');

  // --- Nox
  t('Nox etanol', noxAll(smiles('CCO')).map(function(x){ return x.nox; }).join(' e '), '-3 e -1');
  t('Nox ácido etanoico', noxAll(smiles('CC(=O)O')).map(function(x){ return x.nox; }).join(' e '), '-3 e 3');
  t('Nox metano', noxCarbon(smiles('C'),0), '-4');
  t('Nox propanona', noxAll(smiles('CC(=O)C')).map(function(x){ return x.nox; }).join(','), '-3,2,-3');

  // --- reações (casos mínimos exigidos)
  t('propeno + HBr', prod('C=CC','hidrohalogenacao','principal',{X:'Br'}), '2-bromopropano');
  t('propeno + HBr/peróxido', prod('C=CC','hbr_peroxido','principal'), '1-bromopropano');
  t('butan-2-ol + H2SO4 170°C', prod('CCC(O)C','desidratacao_intra','principal'), 'but-2-eno');
  t('2-bromobutano + KOH alcoólico', prod('CCC(Br)C','desidroalogenacao','principal'), 'but-2-eno');
  t('2-bromobutano + KOH aquoso', prod('CCC(Br)C','haleto_hidrolise','principal'), 'butan-2-ol');
  t('2-metilbut-2-eno + KMnO4/H+ quente', prod('CC(C)=CC','oxidacao_energica','principal'), 'propanona + ácido etanoico');
  t('2-metilbut-2-eno + O3/Zn', prod('CC(C)=CC','ozonolise','principal'), 'propanona + etanal');
  t('but-1-eno + KMnO4/H+ quente', prod('CCC=C','oxidacao_energica','principal'), 'ácido propanoico + CO₂ + H₂O');
  t('tolueno + HNO3/H2SO4', prod('CC1=CC=CC=C1','benzeno_nitracao','principal') + ' e ' +
      prod('CC1=CC=CC=C1','benzeno_nitracao','secundário'), 'p-nitrotolueno e o-nitrotolueno');
  t('nitrobenzeno + Br2/FeBr3', prod('{NO2}C1=CC=CC=C1','benzeno_halogenacao','principal',{X:'Br'}), 'm-bromonitrobenzeno');
  t('etino + H2O/H2SO4/HgSO4', prod('C#C','hidratacao_alcino','principal'), 'etanal');
  t('propan-2-ol + K2Cr2O7/H+', prod('CC(O)C','oxidacao_alcool','principal'), 'propanona');
  t('2-metilpropan-2-ol + K2Cr2O7/H+', prod('CC(C)(C)O','oxidacao_alcool','principal'), 'Não reage');
  var isoTeste = rodarReacao('halogenacao_alcano', smiles('CC(C)CC'), { X:'Cl' });
  t('2-metilbutano + Cl2/luz: isômeros', isoTeste && isoTeste.isomeros, '4');

  // --- reações (verificações complementares)
  t('propino + H2O → cetona', prod('CC#C','hidratacao_alcino','principal'), 'propanona');
  t('propeno + Baeyer', prod('C=CC','oxidacao_branda','principal'), 'propano-1,2-diol');
  t('etanol + K2Cr2O7', prod('CCO','oxidacao_alcool','principal'), 'ácido etanoico');
  t('tolueno + KMnO4/H+', prod('CC1=CC=CC=C1','oxidacao_energica','principal'), 'ácido benzoico');
  t('benzeno + H2/Ni', prod('C1=CC=CC=C1','hidrogenacao','principal'), 'ciclo-hexano');
  t('ciclopropano + H2', prod('C1CC1','hidrogenacao','principal'), 'propano');
  t('ácido etanoico + etanol', prod('CC(=O)O','esterificacao','principal'), 'etanoato de etila');
  t('nitrobenzeno + H2 → anilina', prod('{NO2}C1=CC=CC=C1','reducao_nitro','principal'), 'anilina');
  t('1,2-dibromoetano + Zn', prod('BrCCBr','desalogenacao','principal'), 'eteno');
  t('butadieno + Br2 (1,4)', prod('C=CC=C','dieno_conjugado','principal',{X:'Br'}), '1,4-dibromobut-2-eno');
  t('combustão do propano', combustaoEq(smiles('CCC'), true), 'C3H8 + 5 O₂ → 3 CO₂ + 4 H₂O');
  t('combustão do metano', combustaoEq(smiles('C'), true), 'CH4 + 2 O₂ → CO₂ + 2 H₂O');
  t('neopentano: 1 isômero', (rodarReacao('halogenacao_alcano', smiles('CC(C)(C)C'), {X:'Cl'})||{}).isomeros, '1');
  t('propano: 2 isômeros', (rodarReacao('halogenacao_alcano', smiles('CCC'), {X:'Cl'})||{}).isomeros, '2');

  // --- estrutura
  t('classes do 2-metilbutano', M.carbons(smiles('CC(C)CC')).map(function(i){
      return carbonClassShort(carbonClass(smiles('CC(C)CC'), i)); }).join(''), '1°3°1°2°1°');
  t('butan-2-ol tem 1 C quiral', chiralCarbons(smiles('CCC(O)C')).length, '1');
  t('propan-2-ol não é quiral', chiralCarbons(smiles('CC(O)C')).length, '0');
  t('fórmula do etanol', formulaPlain(smiles('CCO')), 'C2H6O');
  t('fórmula do benzeno', formulaPlain(smiles('C1=CC=CC=C1')), 'C6H6');

  // --- testes de identificação
  t('Tollens: aldeído positivo', testeById('tollens').ver(smiles('CCC=O')).pos, 'true');
  t('Tollens: cetona negativa', testeById('tollens').ver(smiles('CC(=O)C')).pos, 'false');
  t('Fehling: aldeído positivo', testeById('fehling').ver(smiles('CC=O')).pos, 'true');
  t('Baeyer: alceno positivo', testeById('baeyer').ver(smiles('CC=CC')).pos, 'true');
  t('Baeyer: alcano negativo', testeById('baeyer').ver(smiles('CCC')).pos, 'false');
  t('Sódio: álcool positivo', testeById('sodio').ver(smiles('CCO')).pos, 'true');
  t('Sódio: éter negativo', testeById('sodio').ver(smiles('CCOCC')).pos, 'false');
  t('NaOH: fenol positivo', testeById('naoh').ver(smiles('OC1=CC=CC=C1')).pos, 'true');
  t('NaOH: álcool negativo', testeById('naoh').ver(smiles('CCO')).pos, 'false');
  t('NaHCO3: ácido positivo', testeById('bicarbonato').ver(smiles('CC(=O)O')).pos, 'true');
  t('NaHCO3: fenol negativo', testeById('bicarbonato').ver(smiles('OC1=CC=CC=C1')).pos, 'false');
  t('Dicromato: álcool 3° negativo', testeById('dicromato').ver(smiles('CC(C)(C)O')).pos, 'false');
  t('Chama: aromático com fuligem', !!testeById('chama').ver(smiles('C1=CC=CC=C1')).fuligem, 'true');

  // --- gerador e questões (robustez)
  var falhasGer = 0, falhasQ = 0;
  for(var i=0;i<45;i++){
    try {
      var g = gerarMolecula(1 + (i % 6));
      var nm = iupacName(g);
      if(!nm || nm==='—' || /undefined|NaN/.test(nm)) falhasGer++;
      if(!M.valid(g)) falhasGer++;
      molSVG(g, { click:true }); condensed(g);
    } catch(e){ falhasGer++; }
  }
  t('gerador: 45 moléculas válidas e nomeáveis', falhasGer, '0');
  var topicosTeste = ['nome','nome_produto','funcao','classe','classe_funcao','pares','grupo','nox','quiral',
                      'isomeros','dirigencia','teste','inverso','condicao','sequencia','markovnikov','saytzeff',
                      'tautomeria','produto_adicao','produto_eliminacao','produto_substituicao','produto_oxidacao'];
  topicosTeste.forEach(function(tp){
    try {
      var q = gerarQuestao(tp, 4);
      if(!q) { falhasQ++; return; }
      if(q.tipo==='escolha'){
        if(q.opcoes.filter(function(o){ return o.certa; }).length!==1) falhasQ++;
        var txts = q.opcoes.map(function(o){ return o.txt; });
        if(txts.some(function(x){ return !x; })) falhasQ++;
      } else if(!q.validar(q.gabarito)) falhasQ++;
      if(!q.dicas || q.dicas.length<3) falhasQ++;
    } catch(e){ falhasQ++; }
  });
  t('questões: 22 tópicos bem formados', falhasQ, '0');

  // classificação de funções
  t('álcool 1°', groupsOf(smiles('CCCO')).filter(function(g){ return g.tipo==='alcool'; })[0].classe, '1');
  t('álcool 2°', groupsOf(smiles('CCC(O)C')).filter(function(g){ return g.tipo==='alcool'; })[0].classe, '2');
  t('álcool 3°', groupsOf(smiles('CC(C)(C)O')).filter(function(g){ return g.tipo==='alcool'; })[0].classe, '3');
  t('amina primária', groupsOf(smiles('CCN')).filter(function(g){ return g.tipo==='amina'; })[0].classe, '1');
  t('amina secundária', groupsOf(smiles('CCNC')).filter(function(g){ return g.tipo==='amina'; })[0].classe, '2');
  t('amina terciária', groupsOf(smiles('CCN(C)C')).filter(function(g){ return g.tipo==='amina'; })[0].classe, '3');
  t('haleto 3°', groupsOf(smiles('CC(C)(Cl)C')).filter(function(g){ return g.tipo==='haleto'; })[0].classe, '3');
  t('N,N-dimetiletanamina', nome('CCN(C)C'), 'N,N-dimetiletanamina');
  t('gerador de classificados', (function(){
      var erros = 0;
      ['alcool','haleto','amina'].forEach(function(tp){
        for(var c=1;c<=3;c++){
          var mm = gerarClassificado(tp, c);
          var gg = groupsOf(mm).filter(function(x){ return x.tipo===tp; })[0];
          if(!gg || gg.classe!==c) erros++;
        }
      });
      return erros;
    })(), '0');
  t('tabela de funções completa', FUNCOES.length >= 15, 'true');
  t('pares que confundem', PARES_CONFUSOS.length >= 6, 'true');

  var reacoesSemErro = 0;
  RX.forEach(function(r){
    var m = gerarParaReacao(r.id, 4);
    var res = rodarReacao(r.id, m);
    if(!res || res.erro || !res.produtos || !res.produtos.length) reacoesSemErro++;
  });
  t('todas as '+RX.length+' reações produzem resultado', reacoesSemErro, '0');
  t('livro de regras tem verbetes', LIVRO.length >= 30, 'true');
  t('busca no livro funciona', buscarLivro('markovnikov').length >= 1, 'true');

  return R;
}

  var falhas = R.filter(function(x){ return !x.ok; });
  $('stSummary').innerHTML =
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
    '<span class="chip '+(falhas.length?'no':'ok')+'" style="font-size:14px">' +
    (R.length-falhas.length)+' / '+R.length+' passaram</span>' +
    (falhas.length ? '<span class="chip no">'+falhas.length+' falha(s)</span>' : '<span class="chip ok">sem falhas</span>') +
    '<span class="tiny">'+dt+' ms</span></div>' +
    (falhas.length ? '<div class="tiny" style="margin-top:6px">As linhas em vermelho mostram o valor obtido e o esperado.</div>' : '');
  var lista = ST_SOFALHAS ? falhas : R;
  $('stOut').innerHTML = lista.map(function(x){
    return '<div class="tline '+(x.ok?'pass':'fail')+'">' +
      (x.ok?'ok  ':'FALHA ') + esc(x.nome) +
      (x.ok ? '' : '<div class="exp">obtido: '+esc(x.obtido)+'</div><div class="exp">esperado: '+esc(x.esperado)+'</div>') +
      '</div>';
  }).join('');
}

/* ============================================================================
   INICIALIZAÇÃO
   ========================================================================== */
function iniciar(){
  carregar();
  atualizarHeader();
  renderNav();

  $('nav').addEventListener('click', function(e){
    var b = e.target.closest('[data-modo]');
    if(b) irPara(b.getAttribute('data-modo'));
  });
  $('btnCfg').onclick = abrirConfig;
  $('btnRev').onclick = abrirRevisao;

  $('stClose').onclick = function(){ $('selftest').classList.remove('on'); };
  $('stRun').onclick = pintarAutoteste;
  $('stOnlyFail').onclick = function(){
    ST_SOFALHAS = !ST_SOFALHAS;
    $('stOnlyFail').textContent = ST_SOFALHAS ? 'Mostrar tudo' : 'Só falhas';
    pintarAutoteste();
  };

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && (e.key==='T' || e.key==='t')){
      e.preventDefault();
      if($('selftest').classList.contains('on')) $('selftest').classList.remove('on');
      else abrirAutoteste();
    }
    if(e.key==='Escape'){
      fecharSpot();
      var mask = qs('.mask');
      if(mask && mask.parentNode) mask.parentNode.removeChild(mask);
    }
  });
  window.addEventListener('resize', function(){
    if($('spot').classList.contains('on')) mostrarPasso();
  });

  var primeiraVez = !S.stats.respondidas && !Object.keys(S.trilha).length;
  if(primeiraVez) SUPRIMIR_TUTORIAL = true;   // o tutorial entra só depois das boas-vindas
  irPara('trilha');

  if(primeiraVez){
    setTimeout(function(){
      modal('Laboratório de Reações',
        '<p>Este é um curso completo de <b>reações orgânicas</b> em forma de jogo: adição, eliminação, substituição e oxirredução, no nível de uma prova difícil de 3º ano.</p>' +
        '<ul class="tight"><li><b>Trilha</b> — teoria, tutorial guiado, prática e desafio, nível por nível</li>' +
        '<li><b>Construtor</b> — monte qualquer molécula e veja nome, Nox e reações possíveis na hora</li>' +
        '<li><b>Laboratório</b> — escolha reagente e condição e preveja o produto</li>' +
        '<li><b>Identificação</b> — descubra o frasco desconhecido com o menor número de testes</li>' +
        '<li><b>Simulado</b> — 10 a 15 questões com tempo e correção comentada</li></ul>' +
        '<p class="tiny">Tudo funciona offline. Seu progresso fica salvo neste navegador e pode ser exportado no ícone de engrenagem.</p>',
        [{ txt:'Começar', cls:'pri', fn:function(fechar){
            fechar();
            SUPRIMIR_TUTORIAL = false;
            setTimeout(function(){ iniciarTutorial('trilha'); }, 250);
          } }]);
    }, 400);
  }
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();
</script>
